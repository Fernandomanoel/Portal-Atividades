<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogos do Computador - Caça-Figuras, Ligar, Memória e Mais</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --tinta: #14213d;
            --papel: #fffdf7;
            --menta: #12b886;
            --menta-claro: #e6fcf5;
            --laranja: #ff8c42;
            --laranja-claro: #fff4ec;
            --uva: #7048e8;
            --uva-claro: #f3f0ff;
            --sol: #ffd43b;
            --coral: #ff6b6b;
            --coral-claro: #fff0f0;
            --azul: #4c6ef5;
            --azul-claro: #e7f0ff;
            --borda: #dfe3ec;
        }

        html, body { height: 100%; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at 12% 18%, rgba(255,212,59,.18) 0, transparent 42%),
                radial-gradient(circle at 88% 82%, rgba(18,184,134,.20) 0, transparent 45%),
                linear-gradient(160deg, #1b1f3b 0%, #2d1b53 100%);
            color: var(--tinta);
            overflow: hidden;
        }

        .app { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; padding: clamp(8px,1.6vh,20px); gap: clamp(8px,1.4vh,16px); }
        .palco { flex: 1; position: relative; min-height: 0; overflow: hidden; display: flex; }

        .slide {
            position: absolute; inset: 0;
            background: var(--papel); border-radius: 22px;
            box-shadow: 0 18px 60px rgba(0,0,0,.38);
            padding: clamp(12px,2.2vh,24px);
            display: flex; flex-direction: column; gap: clamp(7px,1.2vh,14px);
            opacity: 0; transform: scale(.97);
            transition: opacity .35s ease, transform .35s ease;
            pointer-events: none; overflow: hidden;
        }
        .slide.ativo { opacity: 1; transform: scale(1); pointer-events: auto; z-index: 5; }

        .topo {
            display: flex; align-items: center; gap: clamp(10px,1.4vw,18px);
            background: linear-gradient(100deg, var(--uva) 0%, #9775fa 100%);
            color: #fff; border-radius: 18px;
            padding: clamp(9px,1.5vh,16px) clamp(13px,1.5vw,20px); flex-shrink: 0;
        }
        .topo-emoji { font-size: clamp(1.7rem,3.2vh,2.4rem); line-height: 1; }
        .topo-textos { flex: 1; min-width: 0; }
        .topo h1 { font-size: clamp(1rem,2.4vh,1.65rem); font-weight: 800; line-height: 1.15; }
        .topo p { font-size: clamp(.72rem,1.45vh,.98rem); opacity: .92; }

        .btn-ouvir {
            background: rgba(255,255,255,.22); color: #fff; border: 2px solid rgba(255,255,255,.5);
            border-radius: 999px; padding: clamp(6px,1.1vh,10px) clamp(11px,1.3vw,18px);
            font-size: clamp(.75rem,1.45vh,.95rem); font-weight: 800; cursor: pointer;
            font-family: inherit; white-space: nowrap; flex-shrink: 0;
        }
        .btn-ouvir:hover { background: rgba(255,255,255,.34); }
        .btn-ouvir.falando { background: var(--menta); border-color: var(--menta); }

        .corpo {
            flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
            display: flex; flex-direction: column; gap: clamp(7px,1.2vh,13px);
            justify-content: safe center; padding-right: 4px;
        }
        .corpo::-webkit-scrollbar { width: 8px; }
        .corpo::-webkit-scrollbar-thumb { background: var(--uva); border-radius: 10px; }

        .cartao {
            background: #fff; border: 3px solid var(--borda); border-radius: 16px;
            padding: clamp(9px,1.5vh,16px) clamp(11px,1.3vw,18px);
            font-weight: 700; font-size: clamp(.82rem,1.7vh,1.05rem); line-height: 1.35; text-align: center;
        }
        .cartao.menta { background: var(--menta-claro); border-color: var(--menta); }
        .cartao.laranja { background: var(--laranja-claro); border-color: var(--laranja); }
        .cartao.uva { background: var(--uva-claro); border-color: var(--uva); }
        .cartao b { color: var(--uva); }

        .aviso {
            padding: clamp(8px,1.2vh,13px) clamp(10px,1.2vw,16px); border-radius: 14px;
            font-weight: 800; font-size: clamp(.78rem,1.55vh,.98rem); display: none; flex-shrink: 0; text-align: center;
        }
        .aviso.on { display: block; }
        .aviso.ok { background: var(--menta-claro); color: #0b7c5b; }
        .aviso.nao { background: var(--coral-claro); color: #b02525; }

        .placar { text-align: center; font-weight: 800; color: var(--uva); font-size: clamp(.8rem,1.6vh,1.05rem); flex-shrink: 0; }

        .btn-acao {
            align-self: center; background: var(--laranja); color: #fff; border: none; border-radius: 14px;
            padding: clamp(8px,1.3vh,13px) clamp(15px,1.5vw,24px); font-weight: 800;
            font-size: clamp(.8rem,1.55vh,1rem); cursor: pointer; font-family: inherit; flex-shrink: 0;
        }
        .btn-acao:hover { background: #f97316; }

        /* ---------- LIGAR ---------- */
        .duplas { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(8px,1vw,16px); }
        .coluna { display: flex; flex-direction: column; gap: clamp(5px,.9vh,9px); }
        .liga {
            background: #fff; border: 3px solid var(--borda); border-radius: 13px;
            padding: clamp(6px,1.1vh,11px) clamp(8px,1vw,13px);
            font-weight: 800; font-size: clamp(.75rem,1.5vh,.98rem); cursor: pointer;
            font-family: inherit; text-align: center; color: var(--tinta); transition: all .18s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .liga .ic { font-size: clamp(1.2rem,2.5vh,1.8rem); }
        .liga:hover { border-color: var(--laranja); }
        .liga.sel { border-color: var(--uva); background: var(--uva-claro); }
        .liga.certo { border-color: var(--menta); background: var(--menta-claro); cursor: default; }
        .liga.errado { border-color: var(--coral); background: var(--coral-claro); }

        /* ---------- CAÇA-FIGURAS ---------- */
        .cf-figuras { display: flex; flex-wrap: wrap; gap: clamp(5px,.9vh,9px); justify-content: center; flex-shrink: 0; }
        .cf-fig {
            background: #fff; border: 3px solid var(--uva); border-radius: 13px;
            padding: clamp(4px,.8vh,8px) clamp(7px,.9vw,12px); text-align: center; min-width: clamp(58px,7vw,86px);
        }
        .cf-fig .ic { font-size: clamp(1.3rem,2.8vh,2rem); line-height: 1; display: block; }
        .cf-fig .qt { font-size: clamp(.58rem,1.15vh,.75rem); font-weight: 800; color: var(--uva); display: block; margin-top: 2px; }
        .cf-fig.achada { border-color: var(--menta); background: var(--menta-claro); }
        .cf-fig.achada .qt { color: var(--menta); }
        .cf-fig.achada .nome-revelado { display: block; }
        .nome-revelado { display: none; font-size: clamp(.55rem,1.1vh,.72rem); font-weight: 800; color: #0b7c5b; }

        .cf-area { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
        .cf-grade { display: grid; gap: clamp(2px,.35vh,4px); }
        .cf-cel {
            display: flex; align-items: center; justify-content: center;
            width: clamp(19px,3.6vh,38px); height: clamp(19px,3.6vh,38px);
            background: #fff; border: 2px solid var(--borda); border-radius: 6px;
            font-weight: 800; font-size: clamp(.62rem,1.5vh,1rem); cursor: pointer;
            font-family: inherit; color: var(--tinta); padding: 0; transition: all .12s;
        }
        .cf-cel:hover { border-color: var(--uva); }
        .cf-cel.inicio { background: var(--sol); border-color: var(--laranja); }
        .cf-cel.achada { background: var(--menta); border-color: var(--menta); color: #fff; }

        /* ---------- COMPLETAR PALAVRA ---------- */
        .cp-figura { text-align: center; font-size: clamp(2.4rem,6vh,4.2rem); line-height: 1; flex-shrink: 0; }
        .cp-slots { display: flex; justify-content: center; gap: clamp(4px,.7vw,9px); flex-wrap: wrap; flex-shrink: 0; }
        .cp-slot {
            width: clamp(28px,5vh,50px); height: clamp(34px,6vh,60px);
            border: 3px solid var(--borda); border-radius: 10px; background: #fff;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: clamp(.95rem,2.4vh,1.6rem); color: var(--tinta);
        }
        .cp-slot.fixa { background: #eef0f6; border-color: #cdd3e0; }
        .cp-slot.vazia { border-style: dashed; border-color: var(--uva); }
        .cp-slot.ok { background: var(--menta-claro); border-color: var(--menta); }
        .cp-letras { display: flex; justify-content: center; gap: clamp(4px,.7vw,9px); flex-wrap: wrap; flex-shrink: 0; }
        .cp-letra {
            background: #fff; border: 3px solid var(--uva); color: var(--uva);
            border-radius: 10px; width: clamp(30px,5vh,50px); height: clamp(30px,5vh,50px);
            font-weight: 900; font-size: clamp(.9rem,2.2vh,1.5rem); cursor: pointer; font-family: inherit;
        }
        .cp-letra:hover { background: var(--uva); color: #fff; }
        .cp-letra.usada { opacity: .25; pointer-events: none; }

        /* ---------- MEMÓRIA ---------- */
        .mem-grade { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(5px,.9vh,10px); max-width: clamp(320px, 62vh, 640px); margin: 0 auto; width: 100%; }
        .mem-carta {
            aspect-ratio: 1 / .7; border-radius: 12px; border: 3px solid var(--uva);
            background: var(--uva); color: #fff; cursor: pointer; font-family: inherit;
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(.68rem,1.5vh,1rem); font-weight: 800; text-align: center; padding: 2px;
            transition: all .18s;
        }
        .mem-carta .face { font-size: clamp(1.2rem,2.8vh,2rem); }
        .mem-carta.virada { background: #fff; color: var(--tinta); }
        .mem-carta.par { background: var(--menta-claro); border-color: var(--menta); color: #0b7c5b; cursor: default; }

        /* ---------- MONTAR ---------- */
        .montar-area { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(5px,.9vh,10px); }
        .vaga {
            border: 4px dashed var(--uva); border-radius: 14px; background: var(--uva-claro);
            padding: clamp(6px,1.1vh,12px) 4px; text-align: center; cursor: pointer; min-height: clamp(56px,9vh,92px);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
        }
        .vaga .rot { font-weight: 800; font-size: clamp(.65rem,1.35vh,.88rem); color: var(--uva); }
        .vaga .ic { font-size: clamp(1.3rem,2.8vh,2rem); line-height: 1; }
        .vaga.cheia { border-style: solid; border-color: var(--menta); background: var(--menta-claro); cursor: default; }
        .vaga.cheia .rot { color: #0b7c5b; }

        .pecas-banco { display: flex; flex-wrap: wrap; gap: clamp(5px,.9vh,10px); justify-content: center; flex-shrink: 0; }
        .peca-btn {
            background: #fff; border: 3px solid var(--laranja); border-radius: 12px;
            padding: clamp(5px,.9vh,10px) clamp(8px,1vw,13px); cursor: pointer; font-family: inherit;
            font-weight: 800; font-size: clamp(.72rem,1.45vh,.92rem); color: var(--tinta);
            display: flex; align-items: center; gap: 6px;
        }
        .peca-btn .ic { font-size: clamp(1.1rem,2.4vh,1.6rem); }
        .peca-btn:hover { background: var(--laranja-claro); }
        .peca-btn.sel { background: var(--laranja); color: #fff; }
        .peca-btn.usada { display: none; }

        /* ---------- CAIXAS (classificar) ---------- */
        .caixas { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(8px,1vw,16px); }
        .caixa { border-radius: 16px; padding: clamp(7px,1.1vh,13px); min-height: clamp(64px,11vh,110px); }
        .caixa.entrada { background: var(--azul-claro); border: 4px dashed var(--azul); }
        .caixa.saida { background: var(--laranja-claro); border: 4px dashed var(--laranja); }
        .caixa h3 { text-align: center; font-size: clamp(.75rem,1.5vh,.98rem); margin-bottom: 5px; }
        .caixa .conteudo { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; }

        /* ---------- ORDENAR ---------- */
        .banco, .fila { display: flex; flex-direction: column; gap: clamp(5px,.9vh,8px); padding: clamp(7px,1.1vh,11px); border-radius: 16px; min-height: 46px; }
        .banco { background: #f3f4f8; border: 3px dashed #c8cede; }
        .fila { background: var(--uva-claro); border: 3px solid var(--uva); }
        .peca-ord {
            background: #fff; border: 3px solid var(--uva); color: var(--uva); border-radius: 12px;
            padding: clamp(6px,1.1vh,11px) clamp(9px,1vw,14px); font-weight: 800; cursor: pointer;
            text-align: center; font-size: clamp(.75rem,1.5vh,.98rem); font-family: inherit;
        }
        .peca-ord:hover { background: var(--uva); color: #fff; }
        .posto { display: flex; align-items: center; gap: 9px; background: #fff; border: 3px solid transparent; border-radius: 12px; padding: clamp(5px,1vh,10px) clamp(9px,1vw,14px); font-weight: 700; font-size: clamp(.75rem,1.5vh,.98rem); }
        .posto .n { width: clamp(22px,3.6vh,30px); height: clamp(22px,3.6vh,30px); border-radius: 50%; background: var(--uva); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; flex-shrink: 0; font-size: clamp(.7rem,1.4vh,.9rem); }
        .posto.certo { background: var(--menta-claro); border-color: var(--menta); }
        .posto.errado { background: var(--coral-claro); border-color: var(--coral); }

        /* ---------- ESCREVER ---------- */
        .esc-linha { display: flex; gap: clamp(5px,.8vw,10px); align-items: center; justify-content: center; flex-wrap: wrap; }
        .esc-campo {
            border: 3px solid var(--uva); border-radius: 12px; padding: clamp(7px,1.2vh,12px) clamp(9px,1vw,14px);
            font-size: clamp(.85rem,1.7vh,1.1rem); font-weight: 800; font-family: inherit;
            width: clamp(140px,26vw,240px); text-align: center; color: var(--tinta); text-transform: uppercase;
        }
        .esc-campo:focus { outline: none; border-color: var(--laranja); }
        .esc-campo.ok { border-color: var(--menta); background: var(--menta-claro); }
        .esc-campo.nao { border-color: var(--coral); background: var(--coral-claro); }

        /* ---------- OPÇÕES ---------- */
        .opcoes { display: grid; gap: clamp(6px,1vh,9px); }
        .opcoes.duas { grid-template-columns: 1fr 1fr; }
        .opcao {
            background: #fff; border: 3px solid var(--borda); border-radius: 14px;
            padding: clamp(8px,1.3vh,13px) clamp(9px,1.1vw,16px);
            font-weight: 800; font-size: clamp(.78rem,1.6vh,1rem); cursor: pointer;
            font-family: inherit; text-align: center; color: var(--tinta); transition: all .18s;
        }
        .opcao:hover { border-color: var(--uva); }
        .opcao.certo { background: var(--menta-claro); border-color: var(--menta); }
        .opcao.errado { background: var(--coral-claro); border-color: var(--coral); }

        /* ---------- CAPA / FINAL ---------- */
        .capa { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: clamp(8px,1.5vh,16px); min-height: 0; }
        .capa h1 { font-size: clamp(1.3rem,4vh,2.6rem); color: var(--uva); line-height: 1.1; }
        .capa .sub { font-size: clamp(.82rem,1.8vh,1.15rem); color: #566; font-weight: 600; }
        .capa .emoji { font-size: clamp(2rem,5.6vh,3.4rem); line-height: 1; }
        .grade-icones { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: clamp(5px,1vh,11px); width: 100%; max-width: 560px; }
        .mini { display: flex; flex-direction: column; align-items: center; gap: 3px; background: #fff; border: 3px solid var(--borda); border-radius: 14px; padding: clamp(5px,1vh,10px) 4px; }
        .mini .ic { font-size: clamp(1.1rem,2.4vh,1.7rem); line-height: 1; }
        .mini span { font-size: clamp(.58rem,1.2vh,.78rem); font-weight: 800; color: var(--tinta); }

        .trofeu { text-align: center; }
        .trofeu .emoji { font-size: clamp(2.2rem,6vh,3.8rem); }
        .trofeu h2 { color: var(--uva); font-size: clamp(1.2rem,3.4vh,2.1rem); margin: 8px 0; }
        .trofeu p { font-size: clamp(.85rem,1.8vh,1.1rem); color: #455; font-weight: 600; line-height: 1.45; margin-bottom: 8px; }
        .trofeu b { color: var(--menta); }

        /* ---------- RODAPÉ ---------- */
        .rodape { display: flex; align-items: center; gap: clamp(8px,1.4vw,20px); flex-shrink: 0; }
        .nav { background: var(--sol); color: var(--tinta); border: none; padding: clamp(8px,1.4vh,13px) clamp(13px,1.7vw,26px); border-radius: 12px; cursor: pointer; font-size: clamp(.78rem,1.55vh,1rem); font-weight: 800; font-family: inherit; white-space: nowrap; }
        .nav:hover { background: #ffe066; }
        .nav:disabled { opacity: .4; cursor: not-allowed; }
        .barra { flex: 1; height: 10px; background: rgba(255,255,255,.25); border-radius: 999px; overflow: hidden; min-width: 40px; }
        .barra span { display: block; height: 100%; background: linear-gradient(90deg, var(--menta), var(--sol)); transition: width .3s; }
        .contagem { color: #fff; font-weight: 800; font-size: clamp(.72rem,1.45vh,.92rem); white-space: nowrap; }

        @media (max-width: 820px) {
            .topo { flex-wrap: wrap; padding: 9px 13px; gap: 9px; }
            .topo-emoji { font-size: 1.6rem; }
            .btn-ouvir { width: 100%; margin-top: 2px; }
            .caixas, .opcoes.duas { grid-template-columns: 1fr; }
            .duplas { gap: 6px; }
            .liga { padding: 5px 7px; font-size: .74rem; }
            .liga .ic { font-size: 1.1rem; }
            .mem-grade { grid-template-columns: repeat(4,1fr); }
            .montar-area { grid-template-columns: repeat(2,1fr); }
            .grade-icones { grid-template-columns: repeat(3,minmax(0,1fr)); }
            .rodape { flex-wrap: wrap; }
            .nav { flex: 1; }
            .barra { order: 3; width: 100%; flex-basis: 100%; }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="palco" id="palco"></div>
        <div class="rodape">
            <button class="nav" id="btnVoltar" onclick="voltar()">← Voltar</button>
            <div class="barra"><span id="progresso"></span></div>
            <span class="contagem"><span id="atual">1</span> / <span id="total">1</span></span>
            <button class="nav" id="btnProximo" onclick="avancar()">Próximo →</button>
        </div>
    </div>

    <script>
        let atual = 0;

        function topo(emoji, titulo, sub, fala) {
            return `<div class="topo">
                <div class="topo-emoji">${emoji}</div>
                <div class="topo-textos"><h1>${titulo}</h1><p>${sub}</p></div>
                <button class="btn-ouvir" data-falar="${fala.replace(/"/g,'&quot;')}">🔊 Ouvir</button>
            </div>`;
        }

        const misturar = l => { const c=l.slice(); for(let i=c.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[c[i],c[j]]=[c[j],c[i]];} return c; };

        /* ==================== DADOS ==================== */
        const PARES_LIGAR_1 = [
            { ic:'🖥️', nome:'MONITOR' }, { ic:'🖱️', nome:'MOUSE' }, { ic:'⌨️', nome:'TECLADO' },
            { ic:'🖨️', nome:'IMPRESSORA' }, { ic:'🔊', nome:'CAIXA DE SOM' }, { ic:'📷', nome:'WEBCAM' },
        ];
        const PARES_LIGAR_2 = [
            { ic:'🧠', nome:'PENSA E CALCULA' }, { ic:'💾', nome:'GUARDA OS ARQUIVOS' },
            { ic:'🖥️', nome:'MOSTRA A IMAGEM' }, { ic:'⌨️', nome:'SERVE PARA ESCREVER' },
            { ic:'🖱️', nome:'MOVE A SETINHA' }, { ic:'🖨️', nome:'IMPRIME NO PAPEL' },
        ];
        const CACA_1 = [
            { ic:'🖱️', p:'MOUSE' }, { ic:'🖥️', p:'TELA' }, { ic:'💾', p:'HD' },
            { ic:'🧠', p:'CPU' }, { ic:'🔊', p:'SOM' },
        ];
        const CACA_2 = [
            { ic:'⌨️', p:'TECLADO' }, { ic:'🖨️', p:'IMPRESSORA' }, { ic:'📷', p:'WEBCAM' },
            { ic:'🗄️', p:'GABINETE' }, { ic:'🔌', p:'CABO' }, { ic:'📁', p:'PASTA' },
        ];
        const COMPLETAR = [
            { ic:'🖱️', p:'MOUSE' }, { ic:'🖥️', p:'MONITOR' }, { ic:'⌨️', p:'TECLADO' },
            { ic:'🖨️', p:'IMPRESSORA' }, { ic:'🗄️', p:'GABINETE' },
        ];
        const ESCREVER = [
            { ic:'🖱️', p:'MOUSE' }, { ic:'🖥️', p:'MONITOR' }, { ic:'⌨️', p:'TECLADO' },
        ];
        const MEMORIA = [
            { ic:'🖥️', nome:'MONITOR' }, { ic:'🖱️', nome:'MOUSE' },
            { ic:'⌨️', nome:'TECLADO' }, { ic:'🖨️', nome:'IMPRESSORA' },
        ];
        const MONTAR = [

        /* ======== gerador de caça-palavras ======== */
        const ALFA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        function gerarCaca(palavras, tam) {
            const dirs = [[0,1],[1,0],[1,1],[-1,1],[0,-1],[1,-1]];
            let grade, colocadas;
            for (let tent = 0; tent < 60; tent++) {
                grade = Array.from({length:tam}, () => Array(tam).fill(''));
                colocadas = [];
                let falhou = false;
                for (const palavra of palavras) {
                    const limpa = palavra.replace(/\s/g,'');
                    let posto = false;
                    for (let t = 0; t < 220 && !posto; t++) {
                        const [dr,dc] = dirs[(Math.random()*dirs.length)|0];
                        const r0 = (Math.random()*tam)|0, c0 = (Math.random()*tam)|0;
                        const rf = r0 + dr*(limpa.length-1), cf = c0 + dc*(limpa.length-1);
                        if (rf < 0 || rf >= tam || cf < 0 || cf >= tam) continue;
                        let cabe = true;
                        for (let k = 0; k < limpa.length; k++) {
                            const cel = grade[r0+dr*k][c0+dc*k];
                            if (cel && cel !== limpa[k]) { cabe = false; break; }
                        }
                        if (!cabe) continue;
                        for (let k = 0; k < limpa.length; k++) grade[r0+dr*k][c0+dc*k] = limpa[k];
                        colocadas.push({ palavra: limpa, r0, c0, dr, dc });
                        posto = true;
                    }
                    if (!posto) { falhou = true; break; }
                }
                if (!falhou) break;
            }
            for (let r = 0; r < tam; r++) for (let c = 0; c < tam; c++)
                if (!grade[r][c]) grade[r][c] = ALFA[(Math.random()*26)|0];
            return { grade, colocadas };
        }

        /* ==================== VOZ ==================== */
        function falar(texto, botao) {
            if (!('speechSynthesis' in window)) return;
            speechSynthesis.cancel();
            const f = new SpeechSynthesisUtterance(texto);
            f.lang = 'pt-BR'; f.rate = .92;
            if (botao) {
                botao.classList.add('falando');
                f.onend = () => botao.classList.remove('falando');
                f.onerror = () => botao.classList.remove('falando');
            }
            speechSynthesis.speak(f);
        }
        document.addEventListener('click', e => {
            const b = e.target.closest('[data-falar]');
            if (b) falar(b.dataset.falar, b);
        });

        /* ==================== JOGO: LIGAR ==================== */
        function montarLigar(pares, idE, idD, idPlacar) {
            const E = document.getElementById(idE), D = document.getElementById(idD), placar = document.getElementById(idPlacar);
            E.innerHTML = ''; D.innerHTML = '';
            const comId = pares.map((p,i) => ({...p, id:i}));
            let sel = null, achou = 0;
            misturar(comId).forEach(p => {
                const b = document.createElement('button');
                b.className = 'liga';
                b.innerHTML = `<span class="ic">${p.ic}</span>`;
                b.dataset.id = p.id;
                b.addEventListener('click', () => {
                    if (b.classList.contains('certo')) return;
                    E.querySelectorAll('.liga').forEach(x => x.classList.remove('sel'));
                    b.classList.add('sel'); sel = b;
                });
                E.appendChild(b);
            });
            misturar(comId).forEach(p => {
                const b = document.createElement('button');
                b.className = 'liga';
                b.textContent = p.nome;
                b.dataset.id = p.id;
                b.addEventListener('click', () => {
                    if (b.classList.contains('certo') || !sel) return;
                    if (sel.dataset.id === b.dataset.id) {
                        sel.classList.remove('sel'); sel.classList.add('certo'); b.classList.add('certo');
                        sel = null; achou++;
                        placar.textContent = `${achou} de ${pares.length} ligados`;
                        if (achou === pares.length) placar.textContent = '🎉 Você ligou tudo certinho!';
                    } else {
                        b.classList.add('errado');
                        setTimeout(() => { b.classList.remove('errado'); if (sel) sel.classList.remove('sel'); sel = null; }, 460);
                    }
                });
                D.appendChild(b);
            });
        }

        /* ==================== JOGO: CAÇA-FIGURAS ==================== */
        function montarCaca(itens, tam, idFigs, idGrade, idMsg, idPlacar) {
            const boxF = document.getElementById(idFigs), boxG = document.getElementById(idGrade);
            const msg = document.getElementById(idMsg), placar = document.getElementById(idPlacar);
            const palavras = itens.map(i => i.p.replace(/\s/g,''));
            const { grade } = gerarCaca(palavras, tam);
            const achadas = new Set();

            boxF.innerHTML = '';
            itens.forEach(it => {
                const d = document.createElement('div');
                d.className = 'cf-fig';
                d.id = 'fig-' + it.p.replace(/\s/g,'');
                d.innerHTML = `<span class="ic">${it.ic}</span><span class="qt">${it.p.replace(/\s/g,'').length} letras</span><span class="nome-revelado">${it.p}</span>`;
                boxF.appendChild(d);
            });

            boxG.innerHTML = '';
            boxG.style.gridTemplateColumns = `repeat(${tam}, auto)`;
            const cels = [];
            for (let r = 0; r < tam; r++) {
                cels[r] = [];
                for (let c = 0; c < tam; c++) {
                    const b = document.createElement('button');
                    b.className = 'cf-cel'; b.textContent = grade[r][c];
                    b.dataset.r = r; b.dataset.c = c;
                    b.addEventListener('click', () => clicar(r,c));
                    boxG.appendChild(b); cels[r][c] = b;
                }
            }

            let inicio = null;
            function ler(a,b) {
                const dr = Math.sign(b.r-a.r), dc = Math.sign(b.c-a.c);
                const pr = Math.abs(b.r-a.r), pc = Math.abs(b.c-a.c);
                if (pr !== 0 && pc !== 0 && pr !== pc) return null;
                const n = Math.max(pr,pc);
                let s = '';
                for (let k = 0; k <= n; k++) s += grade[a.r+dr*k][a.c+dc*k];
                return s;
            }
            function marcar(a,b) {
                const dr = Math.sign(b.r-a.r), dc = Math.sign(b.c-a.c);
                const n = Math.max(Math.abs(b.r-a.r), Math.abs(b.c-a.c));
                for (let k = 0; k <= n; k++) cels[a.r+dr*k][a.c+dc*k].classList.add('achada');
            }
            function clicar(r,c) {
                if (!inicio) {
                    inicio = { r, c };
                    cels[r][c].classList.add('inicio');
                    msg.className = 'aviso on ok';
                    msg.textContent = '👆 Agora clique na ÚLTIMA letra!';
                    return;
                }
                cels[inicio.r][inicio.c].classList.remove('inicio');
                const lida = ler(inicio, { r, c });
                const inv = lida ? lida.split('').reverse().join('') : null;
                const achou = palavras.find(p => p === lida || p === inv);
                if (achou && !achadas.has(achou)) {
                    marcar(inicio, { r, c });
                    achadas.add(achou);
                    const fig = document.getElementById('fig-' + achou);
                    if (fig) fig.classList.add('achada');
                    msg.className = 'aviso on ok';
                    msg.textContent = `🎉 Achou ${achou}!`;
                    falar('Achou ' + achou);
                    placar.textContent = `${achadas.size} de ${itens.length} achadas`;
                    if (achadas.size === itens.length) {
                        msg.textContent = '🏆 Você achou TODAS as figuras!';
                        placar.textContent = '🏆 Caçada completa!';
                    }
                } else if (achou) {
                    msg.className = 'aviso on ok';
                    msg.textContent = '🙂 Essa você já achou!';
                } else {
                    msg.className = 'aviso on nao';
                    msg.textContent = '🔎 Não é essa. Tente de novo!';
                }
                inicio = null;
            }
        }

        /* ==================== JOGO: COMPLETAR ==================== */
        function jogoCompletar() {
            const fig = document.getElementById('cpFig'), slots = document.getElementById('cpSlots');
            const letras = document.getElementById('cpLetras'), msg = document.getElementById('cpMsg'), placar = document.getElementById('cpPlacar');
            let idx = 0;

            function montar() {
                const item = COMPLETAR[idx];
                const palavra = item.p;
                fig.textContent = item.ic;
                placar.textContent = `Palavra ${idx+1} de ${COMPLETAR.length}`;
                msg.className = 'aviso';
                slots.innerHTML = ''; letras.innerHTML = '';

                // sorteia ~40% das posições para esconder (mínimo 2)
                const total = palavra.replace(/\s/g,'').length;
                const qtd = Math.max(2, Math.round(total * .4));
                const idxLetras = palavra.split('').map((ch,i) => ch === ' ' ? null : i).filter(i => i !== null);
                const escondidas = new Set(misturar(idxLetras).slice(0, qtd));

                const slotEls = [];
                palavra.split('').forEach((ch,i) => {
                    if (ch === ' ') { const g = document.createElement('div'); g.style.width='10px'; slots.appendChild(g); slotEls.push(null); return; }
                    const s = document.createElement('div');
                    if (escondidas.has(i)) { s.className = 'cp-slot vazia'; s.dataset.esperado = ch; }
                    else { s.className = 'cp-slot fixa'; s.textContent = ch; }
                    slots.appendChild(s); slotEls.push(s);
                });

                const faltantes = [...escondidas].map(i => palavra[i]);
                const extras = [];
                while (extras.length < 2) {
                    const l = ALFA[(Math.random()*26)|0];
                    if (!faltantes.includes(l) && !extras.includes(l)) extras.push(l);
                }
                misturar(faltantes.concat(extras)).forEach(l => {
                    const b = document.createElement('button');
                    b.className = 'cp-letra'; b.textContent = l;
                    b.addEventListener('click', () => {
                        const alvo = slotEls.find(s => s && s.classList.contains('vazia') && !s.textContent);
                        if (!alvo) return;
                        if (alvo.dataset.esperado === l) {
                            alvo.textContent = l; alvo.classList.remove('vazia'); alvo.classList.add('ok');
                            b.classList.add('usada');
                            const faltam = slotEls.filter(s => s && s.classList.contains('vazia') && !s.textContent).length;
                            if (faltam === 0) {
                                msg.className = 'aviso on ok';
                                msg.textContent = `🎉 Isso! É ${palavra}!`;
                                falar('Isso! É ' + palavra);
                                setTimeout(() => {
                                    idx++;
                                    if (idx < COMPLETAR.length) montar();
                                    else { placar.textContent = '🏆 Você completou todas as palavras!'; msg.textContent = '🏆 Todas completas!'; }
                                }, 1400);
                            } else {
                                msg.className = 'aviso on ok';
                                msg.textContent = `✅ Certo! Faltam ${faltam}.`;
                            }
                        } else {
                            msg.className = 'aviso on nao';
                            msg.textContent = '❌ Essa letra não é. Tente outra!';
                        }
                    });
                    letras.appendChild(b);
                });
            }
            montar();
        }

        /* ==================== JOGO: MEMÓRIA ==================== */

                        virada = null; pares++;
                        placar.textContent = `${pares} de ${MEMORIA.length} pares`;
                        if (pares === MEMORIA.length) placar.textContent = '🎉 Você achou todos os pares!';
                    } else {
                        travado = true;
                        const anterior = virada;
                        setTimeout(() => {
                            anterior.el.classList.remove('virada'); anterior.el.innerHTML = '<span class="face">❓</span>';
                            b.classList.remove('virada'); b.innerHTML = '<span class="face">❓</span>';
                            virada = null; travado = false;
                        }, 900);
                        virada = null;
                    }
                });
                grade.appendChild(b);
            });
        }

        /* ==================== JOGO: MONTAR ==================== */
        function jogoMontar() {
            const area = document.getElementById('montarArea'), banco = document.getElementById('montarBanco');
            const msg = document.getElementById('montarMsg'), placar = document.getElementById('montarPlacar');
            area.innerHTML = ''; banco.innerHTML = '';
            let sel = null, feitas = 0;

            MONTAR.forEach(m => {
                const v = document.createElement('div');
                v.className = 'vaga';
                v.dataset.nome = m.nome;
                v.innerHTML = `<span class="ic">❔</span><span class="rot">${m.dica}</span>`;
                v.addEventListener('click', () => {
                    if (v.classList.contains('cheia') || !sel) return;
                    if (sel.dataset.nome === v.dataset.nome) {
                        v.classList.add('cheia');
                        v.innerHTML = `<span class="ic">${sel.dataset.ic}</span><span class="rot">${sel.dataset.nome}</span>`;
                        sel.classList.add('usada'); sel = null; feitas++;
                        placar.textContent = `${feitas} de ${MONTAR.length} montadas`;
                        msg.className = 'aviso on ok'; msg.textContent = '✅ No lugar certo!';
                        if (feitas === MONTAR.length) { msg.textContent = '🎉 Computador montado!'; placar.textContent = '🏆 Tudo montado!'; }
                    } else {
                        msg.className = 'aviso on nao'; msg.textContent = '❌ Essa peça não vai aí. Leia a dica!';
                    }
                });
                area.appendChild(v);
            });

            misturar(MONTAR).forEach(m => {
                const b = document.createElement('button');
                b.className = 'peca-btn';
                b.innerHTML = `<span class="ic">${m.ic}</span>${m.nome}`;
                b.dataset.nome = m.nome; b.dataset.ic = m.ic;
                b.addEventListener('click', () => {
                    banco.querySelectorAll('.peca-btn').forEach(x => x.classList.remove('sel'));
                    b.classList.add('sel'); sel = b;
                });
                banco.appendChild(b);
            });
        }

        /* ==================== JOGO: ENTRADA/SAÍDA ==================== */
        function jogoEntradaSaida() {
            const banco = document.getElementById('esBanco'), msg = document.getElementById('esMsg'), placar = document.getElementById('esPlacar');
            banco.innerHTML = '';
            document.querySelectorAll('.caixa .conteudo').forEach(c => c.innerHTML = '');
            let sel = null, postas = 0;
            misturar(ENTRADA_SAIDA).forEach(f => {
                const b = document.createElement('button');
                b.className = 'peca-btn';
                b.innerHTML = `<span class="ic">${f.ic}</span>${f.nm}`;
                b.dataset.tipo = f.tipo;
                b.addEventListener('click', () => {
                    if (b.dataset.posta) return;
                    banco.querySelectorAll('.peca-btn').forEach(x => x.classList.remove('sel'));
                    b.classList.add('sel'); sel = b;
                });
                banco.appendChild(b);
            });
            document.querySelectorAll('.caixa').forEach(caixa => {
                caixa.addEventListener('click', () => {
                    if (!sel) return;
                    if (sel.dataset.tipo === caixa.dataset.caixa) {
                        sel.classList.remove('sel'); sel.dataset.posta = '1';
                        caixa.querySelector('.conteudo').appendChild(sel);
                        sel = null; postas++;
                        placar.textContent = `${postas} de ${ENTRADA_SAIDA.length} guardados`;
                        msg.className = 'aviso on ok'; msg.textContent = '✅ Isso mesmo!';
                        if (postas === ENTRADA_SAIDA.length) { msg.textContent = '🎉 Você guardou tudo certo!'; placar.textContent = '🏆 Tudo guardado!'; }
                    } else {
                        msg.className = 'aviso on nao'; msg.textContent = '❌ Essa não é a caixa certa!';
                    }
                });
            });
        }

        /* ==================== JOGO: ESCREVER ==================== */
        function jogoEscrever() {
            const fig = document.getElementById('escFig'), campo = document.getElementById('escCampo');
            const btn = document.getElementById('escBtn'), msg = document.getElementById('escMsg'), placar = document.getElementById('escPlacar');
            let idx = 0;
            function montar() {
                fig.textContent = ESCREVER[idx].ic;
                campo.value = ''; campo.className = 'esc-campo';
                msg.className = 'aviso';
                placar.textContent = `Figura ${idx+1} de ${ESCREVER.length}`;
            }
            function conferir() {
                const certo = campo.value.trim().toUpperCase() === ESCREVER[idx].p;
                campo.classList.remove('ok','nao');
                campo.classList.add(certo ? 'ok' : 'nao');
                msg.className = 'aviso on ' + (certo ? 'ok' : 'nao');
                if (certo) {
                    msg.textContent = `🎉 Isso! É ${ESCREVER[idx].p}!`;
                    falar('Isso! É ' + ESCREVER[idx].p);
                    setTimeout(() => {
                        idx++;
                        if (idx < ESCREVER.length) montar();
                        else { msg.className = 'aviso on ok'; msg.textContent = '🏆 Você escreveu todos os nomes!'; placar.textContent = '🏆 Completo!'; }
                    }, 1400);
                } else {
                    msg.textContent = '❌ Não é esse nome. Olhe bem a figura!';
                }
            }
            btn.addEventListener('click', conferir);
            campo.addEventListener('keyup', e => { if (e.key === 'Enter') conferir(); });
            montar();
        }

        /* ==================== JOGO: ORDENAR ==================== */
        function jogoOrdenar() {
            const banco = document.getElementById('ordBanco'), fila = document.getElementById('ordFila');
            const msg = document.getElementById('ordMsg'), btn = document.getElementById('ordBtn');
            let escolhida = [];
            banco.innerHTML = ''; fila.innerHTML = ''; msg.className = 'aviso';
            misturar(ORDEM_LIGAR).forEach(txt => {
                const p = document.createElement('button');
                p.className = 'peca-ord'; p.textContent = txt;
                p.addEventListener('click', () => { escolhida.push(txt); p.remove(); desenhar(); });
                banco.appendChild(p);
            });
            function desenhar() {
                fila.innerHTML = '';
                escolhida.forEach((t,i) => {
                    const d = document.createElement('div');
                    d.className = 'posto';
                    d.innerHTML = `<span class="n">${i+1}</span><span>${t}</span>`;
                    fila.appendChild(d);
                });
            }
            btn.onclick = () => {
                let ok = 0;
                fila.querySelectorAll('.posto').forEach((d,i) => {
                    const c = escolhida[i] === ORDEM_LIGAR[i];
                    d.classList.remove('certo','errado');
                    d.classList.add(c ? 'certo' : 'errado');
                    if (c) ok++;
                });
                msg.className = 'aviso on ' + (ok === ORDEM_LIGAR.length ? 'ok' : 'nao');
                msg.textContent = ok === ORDEM_LIGAR.length ? '🎉 Perfeito! Essa é a ordem certa!' : `⚠️ Acertou ${ok} de ${ORDEM_LIGAR.length}. Os vermelhos estão fora de ordem.`;
            };
        }

        /* ==================== JOGO: VF FINAL ==================== */
        function jogoVFFinal() {
            const area = document.getElementById('vfFinal');
            area.innerHTML = '';
            VFS.forEach((q,i) => {
                const bloco = document.createElement('div');
                bloco.className = 'cartao';
                bloco.innerHTML = `<div style="font-weight:800; margin-bottom:6px;">${i+1}) ${q.t}</div>
                    <div class="opcoes duas">
                        <button class="opcao" data-r="falso">❌ Falso</button>
                        <button class="opcao" data-r="verdadeiro">✅ Verdadeiro</button>
                    </div>
                    <div class="aviso" style="margin-top:6px;"></div>`;
                const msg = bloco.querySelector('.aviso');
                bloco.querySelectorAll('.opcao').forEach(b => b.addEventListener('click', () => {
                    const certo = (b.dataset.r === 'verdadeiro') === q.v;
                    bloco.querySelectorAll('.opcao').forEach(x => x.classList.remove('certo','errado'));
                    b.classList.add(certo ? 'certo' : 'errado');
                    msg.className = 'aviso on ' + (certo ? 'ok' : 'nao');
                    msg.textContent = (certo ? '✅ ' : '❌ ') + q.x;
                }));
                area.appendChild(bloco);
            });
        }

        const JOGOS = {
            ligar1: () => montarLigar(PARES_LIGAR_1, 'lig1E', 'lig1D', 'lig1Placar'),
            ligar2: () => montarLigar(PARES_LIGAR_2, 'lig2E', 'lig2D', 'lig2Placar'),
            caca1:  () => montarCaca(CACA_1, 9,  'cf1Figs', 'cf1Grade', 'cf1Msg', 'cf1Placar'),
            caca2:  () => montarCaca(CACA_2, 11, 'cf2Figs', 'cf2Grade', 'cf2Msg', 'cf2Placar'),
            completar: jogoCompletar,
            memoria: jogoMemoria,
            montar: jogoMontar,
            entradaSaida: jogoEntradaSaida,
            escrever: jogoEscrever,
            ordenar: jogoOrdenar,
            vfFinal: jogoVFFinal,
        };

        function montarTudo() {
            const palco = document.getElementById('palco');
            telas.forEach((t,i) => {
                const d = document.createElement('div');
                d.className = 'slide' + (i === 0 ? ' ativo' : '');
                d.innerHTML = t.html;
                palco.appendChild(d);
            });
            document.getElementById('total').textContent = telas.length;
            telas.forEach(t => { if (t.jogo && JOGOS[t.jogo]) JOGOS[t.jogo](); });
            atualizar();
        }

        function mostrar(n) {
            document.querySelectorAll('.slide')[atual].classList.remove('ativo');
            atual = n;
            document.querySelectorAll('.slide')[atual].classList.add('ativo');
            atualizar();
        }
        function avancar() { if (atual < telas.length - 1) mostrar(atual + 1); }
        function voltar()  { if (atual > 0) mostrar(atual - 1); }

        function atualizar() {
            document.getElementById('atual').textContent = atual + 1;
            document.getElementById('btnVoltar').disabled = atual === 0;
            document.getElementById('btnProximo').disabled = atual === telas.length - 1;
            document.getElementById('progresso').style.width = ((atual + 1) / telas.length * 100) + '%';
            if ('speechSynthesis' in window) speechSynthesis.cancel();
        }

        document.addEventListener('keydown', e => {
            if (e.target.tagName === 'INPUT') return;
            if (e.key === 'ArrowRight') avancar();
            if (e.key === 'ArrowLeft') voltar();
        });

        montarTudo();
    </script>
</body>
</html>
