<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Power BI - Planilhas</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter', sans-serif;
}

body {
    display:flex;
    background:#f8fafc;
}

/* SIDEBAR */
.sidebar {
    width:260px;
    height:100vh;
    background:#0f172a;
    color:#fff;
    padding:30px 20px;
    position:fixed;
}

.logo {
    font-size:20px;
    font-weight:600;
    margin-bottom:40px;
    color:#22c55e;
}

.menu a {
    display:block;
    padding:12px;
    border-radius:10px;
    color:#cbd5e1;
    text-decoration:none;
    margin-bottom:10px;
}

.menu a:hover {
    background:#1e293b;
    color:#fff;
}

/* CONTEÚDO */
.container {
    margin-left:260px;
    padding:30px;
    width:100%;
}

.header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.title {
    font-size:26px;
    font-weight:600;
}

.search {
    padding:10px;
    border-radius:10px;
    border:1px solid #ddd;
}

/* GRID */
.grid {
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap:15px;
}

/* CARD */
.card {
    background:#fff;
    border-radius:15px;
    padding:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.05);
    transition:.3s;
}

.card:hover {
    transform:translateY(-5px);
}

.top {
    display:flex;
    align-items:center;
}

.icon {
    width:45px;
    height:45px;
    border-radius:10px;
    background:#22c55e;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-right:10px;
    font-weight:bold;
}

.card h3 {
    font-size:15px;
}

.card p {
    font-size:12px;
    color:#64748b;
}

.btn {
    margin-top:10px;
    width:100%;
    padding:8px;
    border:none;
    border-radius:10px;
    background:#16a34a;
    color:#fff;
    cursor:pointer;
}

/* VIEWER */
.viewer {
    margin-top:20px;
    width:100%;
    height:500px;
    border:none;
    border-radius:15px;
}

</style>
</head>

<body>

<div class="sidebar">
    <div class="logo">Power BI</div>

    <div class="menu">
        <a href="powerbi.html">Voltar</a>
        <a href="../index.html">Home</a>
        <a href="powerbi.html">Atividades</a>

    </div>
</div>

<div class="container">

    <div class="header">
        <div class="title">Planilhas</div>
        <input class="search" placeholder="Pesquisar...">
    </div>

    <div id="lista" class="grid"></div>

    <iframe id="viewer" class="viewer"></iframe>

</div>

<script>

/* LISTA */
const planilhas = [
    {
        titulo:"Controle de Vendas",
        descricao:"Planilha de vendas mensal",
        link:"/base dados/Dados_Power_Bi_Atv1.xlsx"
    },
    {
        titulo:"Controle de Estoque",
        descricao:"Controle de Estoque",
        link:"/base dados/Planilha_Atacadão.xlsx"
    },
    {
        titulo:"Logo Atacadão",
        descricao:"Logo Atacadão",
        link:"/base dados/transferir.png"
    }

];

const lista = document.getElementById("lista");

/* RENDER */
function render(listaDados){
    lista.innerHTML = "";

    listaDados.forEach(p => {
        lista.innerHTML += `
        <div class="card">
            <div class="top">
                <div class="icon">XLS</div>
                <div>
                    <h3>${p.titulo}</h3>
                    <p>${p.descricao}</p>
                </div>
            </div>

            <button class="btn" onclick="abrir('${p.link}')">
                Abrir
            </button>
        </div>
        `;
    });
}

render(planilhas);

/* BUSCA */
document.querySelector(".search").addEventListener("input", e => {
    const valor = e.target.value.toLowerCase();

    const filtrado = planilhas.filter(p =>
        p.titulo.toLowerCase().includes(valor)
    );

    render(filtrado);
});

/* ABRIR */
function abrir(link){
    document.getElementById("viewer").src = link;
}

</script>

</body>
</html>
