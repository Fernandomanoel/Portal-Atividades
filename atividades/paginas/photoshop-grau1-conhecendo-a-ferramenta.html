<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adobe Photoshop — Grau 1: Conhecendo a Ferramenta</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #001e36 0%, #00111f 100%);
            color: #333;
            overflow: hidden;
            height: 100vh;
        }

        :root {
            --ps: #001e36;
            --ps-claro: #e4f4ff;
            --azul: #31a8ff;
            --azul-claro: #e4f4ff;
            --amarelo: #e0a800;
            --cinza: #555555;
            --verde: #1b6b3a;
            --verde-claro: #e6f4ec;
            --roxo: #6b3fa0;
            --roxo-claro: #f1e9fb;
        }

        .presentation-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .slide-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .slide {
            width: 92%;
            height: 92%;
            max-width: 1400px;
            max-height: 820px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.4);
            padding: 45px 50px;
            position: absolute;
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            transform: translateX(100px) scale(0.95);
            pointer-events: none;
        }

        .slide.active {
            opacity: 1;
            transform: translateX(0) scale(1);
            pointer-events: auto;
            z-index: 10;
        }

        .slide-header {
            background: linear-gradient(90deg, var(--ps) 0%, #003a5c 100%);
            color: white;
            padding: 26px 30px;
            border-radius: 15px;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .slide-header h1 {
            font-size: 2.1em;
            font-weight: 700;
            margin: 0;
        }

        .slide-header p {
            font-size: 0.9em;
            opacity: 0.9;
            margin: 0;
        }

        .emoji-large {
            font-size: 2.3em;
        }

        .slide-content {
            display: flex;
            flex-direction: column;
            gap: 18px;
            height: calc(100% - 110px);
            overflow-y: auto;
            padding-right: 10px;
        }

        .slide-content::-webkit-scrollbar { width: 6px; }
        .slide-content::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        .slide-content::-webkit-scrollbar-thumb { background: var(--azul); border-radius: 10px; }

        .content-box {
            padding: 20px 22px;
            border-radius: 12px;
            border-left: 6px solid;
            font-size: 0.98em;
            line-height: 1.65;
        }

        .box-ps { background: var(--ps-claro); border-left-color: var(--ps); }
        .box-azul { background: var(--azul-claro); border-left-color: var(--azul); }
        .box-amarelo { background: #fff3e0; border-left-color: var(--amarelo); }
        .box-verde { background: var(--verde-claro); border-left-color: var(--verde); }
        .box-roxo { background: var(--roxo-claro); border-left-color: var(--roxo); }

        .content-box h3 { color: var(--ps); margin-bottom: 12px; font-size: 1.1em; }
        .content-box strong { color: var(--ps); }
        .box-roxo strong { color: var(--roxo); }
        .box-verde strong { color: var(--verde); }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; }
        .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }

        .card {
            background: white;
            border: 2px solid;
            border-radius: 12px;
            padding: 18px;
            text-align: center;
        }

        .card h4 { margin-bottom: 12px; font-size: 0.95em; }
        .card-ps { border-color: var(--ps); }
        .card-ps h4 { color: var(--ps); }
        .card-verde { border-color: var(--verde); }
        .card-verde h4 { color: var(--verde); }
        .card-azul { border-color: var(--azul); }
        .card-azul h4 { color: var(--azul); }
        .card-roxo { border-color: var(--roxo); }
        .card-roxo h4 { color: var(--roxo); }
        .card.desativado { opacity: 0.55; border-style: dashed; }

        .lista-bullets { list-style: none; padding-left: 0; }
        .lista-bullets li { padding-left: 28px; position: relative; margin-bottom: 10px; }
        .lista-bullets li::before {
            content: "•"; position: absolute; left: 0;
            color: var(--azul); font-weight: bold; font-size: 1.2em;
        }

        .passos-numerados { display: flex; flex-direction: column; gap: 13px; }
        .passo {
            display: flex; gap: 15px; padding: 14px 16px;
            background: #f9f9f9; border-radius: 8px; border-left: 4px solid var(--azul);
        }
        .passo-numero {
            min-width: 38px; height: 38px; background: var(--azul); color: white;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 1.05em; flex-shrink: 0;
        }
        .passo.opcional .passo-numero { background: var(--roxo); }
        .passo-texto { flex: 1; }
        .passo-texto .onde {
            display: inline-block; margin-top: 6px; padding: 3px 10px;
            background: #eef2ff; color: #3730a3; border-radius: 999px;
            font-size: 0.82em; font-weight: 600;
        }

        .tema-tag {
            background: var(--azul-claro); color: var(--ps);
            padding: 7px 14px; border-radius: 20px; font-weight: 600; font-size: 0.86em;
        }
        .temas-list { display: flex; flex-wrap: wrap; gap: 9px; padding: 6px 0; }

        .controls {
            display: flex; justify-content: space-between; align-items: center;
            padding: 18px 40px; background: rgba(0, 0, 0, 0.3);
        }

        button {
            background: var(--azul); color: white; border: none; padding: 12px 25px;
            border-radius: 8px; cursor: pointer; font-size: 1em; font-weight: 600; transition: all 0.3s;
        }
        button:hover { background: #1b8fe0; transform: translateY(-2px); box-shadow: 0 6px 16px rgba(49, 168, 255, 0.35); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .slide-counter { color: white; font-weight: 600; font-size: 1em; }
        .progress-bar { flex: 1; height: 6px; background: rgba(255, 255, 255, 0.2); margin: 0 30px; border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--azul); transition: width 0.3s; }

        .slide-capa {
            background: linear-gradient(135deg, var(--ps) 0%, #003a5c 100%);
            color: white; height: 100%; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center; gap: 22px;
        }
        .slide-capa .slide-header { background: none; margin-bottom: 0; }
        .slide-capa h1 { color: white; font-size: 3em; }
        .slide-capa .subtitulo { font-size: 1.3em; opacity: 0.95; }
        .slide-capa .emoji-large { font-size: 3.6em; }

        .capa-box {
            background: rgba(255, 255, 255, 0.13); border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px; padding: 26px 30px; backdrop-filter: blur(10px); max-width: 620px;
        }
        .capa-box h2 { color: white; margin-bottom: 16px; font-size: 1.3em; }
        .capa-box ul { list-style: none; text-align: left; }
        .capa-box li { padding: 6px 0; font-size: 1.05em; color: white; }

        .badge-duracao {
            display: inline-flex; align-items: center; gap: 8px;
            background: var(--azul); color: white; padding: 8px 20px;
            border-radius: 999px; font-weight: 700; font-size: 1em;
        }

        .motivacao-box {
            background: linear-gradient(135deg, var(--azul-claro) 0%, white 100%);
            border: 3px solid var(--azul); border-radius: 15px; padding: 36px; text-align: center;
        }
        .motivacao-box h2 { color: var(--ps); font-size: 1.9em; margin-bottom: 18px; }
        .motivacao-box p { color: var(--cinza); font-size: 1.05em; line-height: 1.8; margin-bottom: 14px; }
        .motivacao-box .destaque { color: var(--azul); font-weight: bold; }

        /* ---- mapa da tela do Photoshop (diagrama por CSS) ---- */
        .mapa-tela {
            display: grid;
            grid-template-columns: 90px 1fr 150px;
            grid-template-rows: 40px 34px 1fr;
            gap: 6px;
            height: 340px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            overflow: hidden;
            background: #cbd5e1;
        }
        .mapa-regiao {
            display: flex; align-items: center; justify-content: center;
            text-align: center; font-weight: 700; font-size: 0.82em;
            padding: 6px; line-height: 1.3;
        }
        .mapa-menu   { grid-column: 1 / 4; grid-row: 1; background: var(--ps); color: white; }
        .mapa-opcoes { grid-column: 1 / 4; grid-row: 2; background: #5c7d99; color: white; font-size: 0.78em; }
        .mapa-caixa  { grid-column: 1; grid-row: 3; background: #dbeafe; color: var(--ps); flex-direction: column; }
        .mapa-tela-central { grid-column: 2; grid-row: 3; background: repeating-conic-gradient(#f1f5f9 0% 25%, #e2e8f0 0% 50%) 0 0/24px 24px; color: #64748b; }
        .mapa-paineis { grid-column: 3; grid-row: 3; background: #ede9fe; color: var(--roxo); flex-direction: column; gap: 8px; }
        .mapa-paineis .subpainel {
            background: white; border: 1px solid var(--roxo); border-radius: 6px;
            padding: 8px 6px; width: 88%; font-size: 0.78em;
        }
        .mapa-legenda { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 16px; font-size: 0.85em; }
        .mapa-legenda span { display: flex; align-items: center; gap: 6px; }
        .mapa-legenda i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }

        .ferramenta-icone {
            width: 46px; height: 46px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4em; margin: 0 auto 8px; color: white;
        }

        @media (max-width: 1024px) {
            .slide { padding: 32px; }
            .slide-header h1 { font-size: 1.7em; }
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
            .grid-5 { grid-template-columns: repeat(3, 1fr); }
            .mapa-tela { height: 300px; grid-template-columns: 70px 1fr 120px; }
        }

        @media (max-width: 768px) {
            .slide { padding: 22px; width: 96%; height: 96%; }
            .slide-header { flex-direction: column; text-align: center; gap: 8px; }
            .slide-header h1 { font-size: 1.4em; }
            .controls { flex-direction: column; gap: 12px; padding: 14px; }
            .progress-bar { margin: 8px 0; width: 100%; }
            .slide-counter { font-size: 0.88em; }
            button { width: 100%; }
            .grid-5 { grid-template-columns: repeat(2, 1fr); }
            .mapa-tela { grid-template-columns: 56px 1fr 90px; height: 260px; }
            .mapa-paineis .subpainel { font-size: 0.68em; padding: 5px 3px; }
        }
    </style>
</head>
<body>

        function initPresentation() {
            const wrapper = document.getElementById('slideWrapper');

            slides.forEach((slide, index) => {
                const slideDiv = document.createElement('div');
                slideDiv.className = 'slide' + (index === 0 ? ' active' : '');
                slideDiv.innerHTML = slide.html;
                wrapper.appendChild(slideDiv);
            });

            document.getElementById('totalSlides').textContent = slides.length;
            updateControls();
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                document.querySelectorAll('.slide')[currentSlide].classList.remove('active');
                currentSlide++;
                document.querySelectorAll('.slide')[currentSlide].classList.add('active');
                updateControls();
            }
        }

        function previousSlide() {
            if (currentSlide > 0) {
                document.querySelectorAll('.slide')[currentSlide].classList.remove('active');
                currentSlide--;
                document.querySelectorAll('.slide')[currentSlide].classList.add('active');
                updateControls();
            }
        }

        function updateControls() {
            document.getElementById('currentSlide').textContent = currentSlide + 1;
            document.getElementById('prevBtn').disabled = currentSlide === 0;
            document.getElementById('nextBtn').disabled = currentSlide === slides.length - 1;

            const progress = ((currentSlide + 1) / slides.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
            if (e.key === 'ArrowLeft') previousSlide();
        });

        initPresentation();
    </script>
