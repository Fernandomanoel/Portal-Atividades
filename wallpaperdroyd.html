<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Download de Planilhas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #1d976c, #93f9b9);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 300px;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .download-btn {
            display: inline-block;
            padding: 12px 20px;
            background: #1d976c;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .download-btn:hover {
            background: #148a5a;
            transform: scale(1.05);
        }

        .icon {
            font-size: 40px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="icon">📊</div>
        <h2>Baixar Planilha de Estoque</h2>

        <a href="pdfs/Excel 2021/Planilha da Atividade de Estoque.xlsx" class="download-btn" download>
            ⬇ Baixar Planilha
        </a>
    </div>

</body>

</html>
