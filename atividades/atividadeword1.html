<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay Genially</title>
    <link rel="stylesheet" href="css/atividades.css">
</head>

<body>

    <div class="overlay" id="overlay">
        <div class="frame-box">
            <span class="close-btn" onclick="closeOverlay()">✖</span>

            <iframe title="Atividade Extra" frameborder="0" class="genially-frame"
                src="https://view.genially.com/6939df52cb698f4dbb4d8e35" allowscriptaccess="always"
                allowfullscreen="true" scrolling="yes" allownetworking="all">
            </iframe>
        </div>
    </div>

    <button class="open-btn" onclick="openOverlay()">Abrir Atividade</button>

    <script src="../js/script.js"></script>
</body>

</html>
