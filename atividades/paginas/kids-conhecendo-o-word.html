<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conhecendo o Word - Digitando e Formatando de Verdade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --tinta: #4b4b4b;
            --papel: #ffffff;
            --fundo-app: #e5f6ff;
            --menta: #58cc02;
            --menta-escuro: #46a302;
            --menta-claro: #d7ffb8;
            --laranja: #ff9600;
            --laranja-escuro: #e08600;
            --laranja-claro: #ffedcc;
            --uva: #1cb0f6;
            --uva-escuro: #1899d6;
            --uva-claro: #ddf4ff;
            --sol: #ffc800;
            --sol-escuro: #e6b400;
            --sol-claro: #fff3c4;
            --coral: #ff4b4b;
            --coral-escuro: #ea2b2b;
            --coral-claro: #ffdfe0;
            --borda: #e5e5e5;
        }

        html, body { height: 100%; }

        body {
            font-family: 'Baloo 2', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--fundo-app);
            color: var(--tinta);
            overflow: hidden;
        }

        .app { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; padding: clamp(8px, 1.6vh, 20px); gap: clamp(8px, 1.4vh, 16px); }

        .palco { flex: 1; position: relative; min-height: 0; overflow: hidden; display: flex; }

        .slide {
            position: absolute;
            inset: 0;
            background: var(--papel);
            border: 3px solid var(--borda);
            border-radius: 24px;
            box-shadow: 0 6px 0 var(--borda);
            padding: clamp(14px, 2.4vh, 26px);
            display: flex;
            flex-direction: column;
            gap: clamp(8px, 1.4vh, 16px);
            opacity: 0;
            transform: scale(.97);
            transition: opacity .35s ease, transform .35s ease;
            pointer-events: none;
            overflow: hidden;
        }
        .slide.ativo { opacity: 1; transform: scale(1); pointer-events: auto; z-index: 5; }

        /* ---------- Cabeçalho ---------- */
        .topo {
            display: flex; align-items: center; gap: clamp(10px, 1.4vw, 18px);
            background: var(--uva);
            color: #fff; border-radius: 20px;
            box-shadow: 0 5px 0 var(--uva-escuro);
            padding: clamp(10px, 1.6vh, 18px) clamp(14px, 1.6vw, 22px);
            flex-shrink: 0;
        }
        .topo-emoji { font-size: clamp(1.8rem, 3.4vh, 2.6rem); line-height: 1; display: flex; align-items: center; gap: clamp(4px,.6vw,8px); flex-shrink: 0; }
        .topo-textos { flex: 1; min-width: 0; }
        .topo h1 { font-size: clamp(1.05rem, 2.5vh, 1.75rem); font-weight: 800; line-height: 1.15; }
        .topo p { font-size: clamp(.75rem, 1.5vh, 1rem); opacity: .92; font-weight: 600; }

        .btn-ouvir {
            background: #fff; color: var(--uva-escuro); border: none;
            border-radius: 999px; padding: clamp(7px,1.2vh,11px) clamp(12px,1.4vw,20px);
            font-size: clamp(.78rem, 1.5vh, .98rem); font-weight: 800; cursor: pointer;
            font-family: inherit; white-space: nowrap; flex-shrink: 0;
            box-shadow: 0 4px 0 rgba(0,0,0,.18);
            transition: transform .08s, box-shadow .08s;
        }
        .btn-ouvir:hover { transform: translateY(-1px); }
        .btn-ouvir:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
        .btn-ouvir.falando { background: var(--sol); color: #7a5b00; }

        /* ---------- Corpo ---------- */
        .corpo {
            flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
            display: flex; flex-direction: column; gap: clamp(8px, 1.3vh, 14px);
            justify-content: safe center;
            padding-right: 4px;
        }
        .corpo::-webkit-scrollbar { width: 8px; }
        .corpo::-webkit-scrollbar-thumb { background: var(--uva); border-radius: 10px; }

        .cartao {
            background: #fff; border: 3px solid var(--borda); border-radius: 16px;
            box-shadow: 0 4px 0 var(--borda);
            padding: clamp(10px, 1.6vh, 18px) clamp(12px, 1.4vw, 20px);
            font-weight: 700; font-size: clamp(.85rem, 1.75vh, 1.1rem); line-height: 1.35;
        }
        .cartao.menta  { background: var(--menta-claro);  border-color: var(--menta);  box-shadow: 0 4px 0 var(--menta); color: #2f6e00; }
        .cartao.laranja{ background: var(--laranja-claro);border-color: var(--laranja);box-shadow: 0 4px 0 var(--laranja); color: #8a5200; }
        .cartao.uva    { background: var(--uva-claro);    border-color: var(--uva);    box-shadow: 0 4px 0 var(--uva); color: #0c6ea3; }
        .cartao.coral  { background: var(--coral-claro);  border-color: var(--coral);  box-shadow: 0 4px 0 var(--coral); color: #a81f1f; }
        .cartao.centro { text-align: center; }
        .cartao b, .cartao strong { color: var(--uva-escuro); }

        .faixa-pc {
            display: inline-flex; align-items: center; gap: 8px; align-self: flex-start;
            background: var(--uva); color: #fff; font-weight: 800;
            font-size: clamp(.72rem, 1.4vh, .92rem); letter-spacing: .04em;
            padding: clamp(5px,.9vh,8px) clamp(12px,1.2vw,18px); border-radius: 999px; flex-shrink: 0;
            box-shadow: 0 3px 0 var(--uva-escuro);
        }

        /* ---------- Trilha de cliques ---------- */
        /* Passos quadrados (não esticados), tema azul do Word, cada um com um selo numerado. */
        .trilha { display: flex; align-items: stretch; gap: clamp(10px,1.4vw,20px); flex-wrap: wrap; justify-content: center; }
        .trilha-passo {
            position: relative;
            flex: 1 1 0; min-width: clamp(130px, 20vw, 200px); max-width: 300px;
            min-height: clamp(130px, 21vh, 215px);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(8px,1.4vh,14px);
            border: 3px solid var(--uva); border-radius: 22px;
            padding: clamp(14px,2.2vh,24px) clamp(10px,1.2vw,18px);
            font-weight: 800; text-align: center;
            font-size: clamp(.75rem, 1.6vh, 1.05rem); line-height: 1.3;
            box-shadow: 0 6px 0 var(--uva);
        }
        .trilha-passo::before {
            content: attr(data-passo);
            position: absolute; top: -12px; left: -12px;
            width: clamp(24px,3.4vh,30px); height: clamp(24px,3.4vh,30px);
            border-radius: 50%; background: var(--sol); color: #7a5b00;
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(.7rem,1.4vh,.85rem); font-weight: 800;
            box-shadow: 0 3px 0 var(--sol-escuro);
        }
        .trilha-passo.cor0 { background: var(--uva-claro); color: var(--uva-escuro); }
        .trilha-passo.cor1 { background: #e3f1ff; color: #0d5fa8; border-color: #4c9eea; box-shadow: 0 6px 0 #4c9eea; }
        .trilha-passo.cor2 { background: #eaf0fd; color: #1d3f8f; border-color: #2b579a; box-shadow: 0 6px 0 #2b579a; }
        .trilha-passo.cor3 { background: #e6ecfb; color: #17275c; border-color: #1c2f6b; box-shadow: 0 6px 0 #1c2f6b; }
        .trilha-passo .ic { font-size: clamp(1.5rem, 3.2vh, 2.2rem); line-height: 1; }
        .trilha-seta { display: flex; align-items: center; align-self: center; font-size: clamp(1.2rem,2.8vh,2rem); color: var(--laranja); font-weight: 900; flex-shrink: 0; }

        /* ---------- Exemplo de folha do Word ---------- */
        .folha {
            background: #fff; border: 3px dashed var(--uva); border-radius: 16px;
            padding: clamp(14px, 2vh, 22px);
        }
        .folha .linha { margin-bottom: 8px; color: #333; font-size: clamp(.85rem, 1.6vh, 1.05rem); }
        .folha .titulo-folha { text-align: center; font-weight: 800; font-size: clamp(1rem, 2vh, 1.3rem); color: var(--uva-escuro); margin-bottom: 10px; }

        /* ---------- Ícones de botão (parecidos com os do Word de verdade, mas coloridos) ---------- */
        .gb {
            display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
            width: clamp(40px,6.2vh,58px); height: clamp(40px,6.2vh,58px); flex-shrink: 0;
            background: #fff; border: 2.5px solid var(--borda); border-radius: 14px;
            box-shadow: 0 3px 0 var(--borda);
            font-family: Georgia, 'Times New Roman', serif; color: #2b2b2b;
            line-height: 1; gap: 3px;
        }
        .gb-letra { font-size: clamp(1.15rem,2.7vh,1.65rem); }
        .gb-n .gb-letra { font-weight: 900; }
        .gb-i .gb-letra { font-style: italic; font-weight: 700; }
        .gb-s .gb-letra { text-decoration: underline; text-underline-offset: 2px; font-weight: 700; }
        .gb-barra { width: 62%; height: 5px; border-radius: 2px; background: var(--coral); }
        .gb-tam { flex-direction: row; gap: 3px; font-family: inherit; }
        .gb-tam .gb-num { font-size: clamp(.82rem,1.8vh,1.08rem); font-weight: 800; }
        .gb-tam .gb-setas { display: flex; flex-direction: column; font-size: .55rem; line-height: .8; color: #8a6d00; }
        .gb-align { gap: 4px; padding: 8px; justify-content: center; }
        .gb-align .gb-linha { height: 4px; border-radius: 2px; background: #556; }
        .gb-align.esq { align-items: flex-start; }
        .gb-align.centro { align-items: center; }
        .gb-align.dir { align-items: flex-end; }
        .gb-align .gb-linha:nth-child(1) { width: 100%; }
        .gb-align .gb-linha:nth-child(2) { width: 62%; }
        .gb-align .gb-linha:nth-child(3) { width: 80%; }
        .gb-lista { gap: 4px; padding: 8px 9px; align-items: flex-start; justify-content: center; }
        .gb-lista .gb-linhaponto { display: flex; align-items: center; gap: 4px; }
        .gb-lista .gb-ponto { width: 5px; height: 5px; border-radius: 50%; background: #556; flex-shrink: 0; }
        .gb-lista .gb-tra { width: 20px; height: 4px; border-radius: 2px; background: #556; }
        .gb-emoji { font-size: clamp(1.3rem,3vh,1.85rem); font-family: inherit; }

        /* preenchimento colorido de cada botão, para combinar com o resto da atividade */
        .gb-n { background: var(--laranja-claro); border-color: var(--laranja); box-shadow: 0 3px 0 var(--laranja); }
        .gb-n .gb-letra { color: #8a5200; }
        .gb-i { background: var(--menta-claro); border-color: var(--menta); box-shadow: 0 3px 0 var(--menta); }
        .gb-i .gb-letra { color: #2f6e00; }
        .gb-s { background: var(--uva-claro); border-color: var(--uva); box-shadow: 0 3px 0 var(--uva); }
        .gb-s .gb-letra { color: var(--uva-escuro); }
        .gb-cor { background: var(--coral-claro); border-color: var(--coral); box-shadow: 0 3px 0 var(--coral); }
        .gb-tam { background: var(--sol-claro); border-color: var(--sol); box-shadow: 0 3px 0 var(--sol); }
        .gb-tam .gb-num { color: #8a6d00; }
        .gb-align.esq { background: var(--uva-claro); border-color: var(--uva); box-shadow: 0 3px 0 var(--uva); }
        .gb-align.esq .gb-linha { background: var(--uva-escuro); }
        .gb-align.centro { background: var(--menta-claro); border-color: var(--menta); box-shadow: 0 3px 0 var(--menta); }
        .gb-align.centro .gb-linha { background: #2f6e00; }
        .gb-align.dir { background: var(--laranja-claro); border-color: var(--laranja); box-shadow: 0 3px 0 var(--laranja); }
        .gb-align.dir .gb-linha { background: #8a5200; }
        .gb-lista { background: var(--coral-claro); border-color: var(--coral); box-shadow: 0 3px 0 var(--coral); }
        .gb-lista .gb-ponto, .gb-lista .gb-tra { background: #a81f1f; }
        .gb-desfazer { background: var(--sol-claro); border-color: var(--sol); box-shadow: 0 3px 0 var(--sol); }
        .gb-salvar { background: var(--menta-claro); border-color: var(--menta); box-shadow: 0 3px 0 var(--menta); }

        .ribbon-mock {
            display: flex; align-items: center; gap: clamp(6px,1vw,10px); flex-wrap: wrap; justify-content: center;
            background: var(--uva-claro); border: 3px solid var(--uva); border-radius: 18px;
            box-shadow: 0 4px 0 var(--uva);
            padding: clamp(10px,1.5vh,16px);
        }
        .ribbon-mock .rotulo {
            width: 100%; text-align: center; font-weight: 800; color: var(--uva-escuro);
            font-size: clamp(.66rem,1.3vh,.8rem); text-transform: uppercase; letter-spacing: .05em;
            margin-bottom: 2px;
        }

        /* ---------- Tabela de vocabulário ---------- */
        .tabela-vocab { width: 100%; border-collapse: collapse; border-radius: 16px; overflow: hidden; border: 3px solid var(--borda); box-shadow: 0 4px 0 var(--borda); }
        .tabela-vocab th {
            background: var(--uva); color: #fff; text-align: left;
            padding: clamp(8px,1.3vh,12px) clamp(10px,1vw,14px);
            font-size: clamp(.75rem,1.45vh,.92rem);
        }
        .tabela-vocab td {
            padding: clamp(7px,1.15vh,11px) clamp(10px,1vw,14px);
            font-size: clamp(.72rem,1.35vh,.88rem); line-height: 1.3;
            border-bottom: 1px solid var(--borda); background: #fff;
        }
        .tabela-vocab tr:nth-child(even) td { background: var(--uva-claro); }
        .tabela-vocab td:first-child { font-weight: 800; color: var(--uva-escuro); white-space: nowrap; }

        /* ---------- Checklist ---------- */
        .lista { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: clamp(7px,1.1vh,11px); }
        .item {
            display: flex; align-items: center; gap: clamp(8px,1vw,14px);
            background: #fff; border: 3px solid var(--borda); border-radius: 16px;
            box-shadow: 0 4px 0 var(--borda);
            padding: clamp(8px,1.3vh,14px) clamp(10px,1.1vw,16px);
            cursor: pointer; user-select: none; transition: transform .1s, box-shadow .1s, background .18s, border-color .18s;
        }
        .item:hover { border-color: var(--menta); }
        .item:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--borda); }
        .item .ic { font-size: clamp(1.3rem, 2.6vh, 1.9rem); flex-shrink: 0; line-height: 1; }
        .item .txt { flex: 1; font-weight: 700; font-size: clamp(.8rem, 1.6vh, 1rem); line-height: 1.25; }
        .item .selo { font-size: clamp(1.1rem, 2.2vh, 1.5rem); flex-shrink: 0; }
        .item.feito { background: var(--menta-claro); border-color: var(--menta); box-shadow: 0 4px 0 var(--menta); }

        .placar { text-align: center; font-weight: 800; color: var(--uva-escuro); font-size: clamp(.85rem,1.7vh,1.1rem); flex-shrink: 0; }

        /* ---------- Jogos ---------- */
        .pergunta { font-weight: 800; color: var(--tinta); font-size: clamp(.9rem,1.9vh,1.15rem); line-height: 1.3; }

        .opcoes { display: grid; gap: clamp(7px,1.1vh,10px); }
        .opcoes.duas { grid-template-columns: 1fr 1fr; }
        .opcao {
            background: #fff; border: 3px solid var(--borda); border-radius: 16px;
            box-shadow: 0 4px 0 var(--borda);
            padding: clamp(9px,1.4vh,15px) clamp(10px,1.2vw,18px);
            font-weight: 800; font-size: clamp(.82rem,1.65vh,1.05rem); cursor: pointer;
            font-family: inherit; text-align: left; color: var(--tinta); transition: transform .1s, box-shadow .1s, background .18s, border-color .18s;
        }
        .opcao:hover { border-color: var(--uva); }
        .opcao:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--borda); }
        .opcao.certo { background: var(--menta-claro); border-color: var(--menta); box-shadow: 0 4px 0 var(--menta); color: #2f6e00; }
        .opcao.errado { background: var(--coral-claro); border-color: var(--coral); box-shadow: 0 4px 0 var(--coral); color: #a81f1f; }

        .aviso {
            padding: clamp(9px,1.3vh,14px) clamp(11px,1.2vw,18px); border-radius: 14px;
            font-weight: 800; font-size: clamp(.8rem,1.6vh,1rem); display: none; flex-shrink: 0;
        }
        .aviso.on { display: block; }
        .aviso.ok  { background: var(--menta-claro); color: #2f6e00; }
        .aviso.nao { background: var(--coral-claro); color: #a81f1f; }

        .duplas { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(10px,1.4vw,22px); max-width: 760px; margin: 0 auto; width: 100%; }
        .coluna { display: flex; flex-direction: column; gap: clamp(9px,1.3vh,14px); }
        .liga {
            display: flex; align-items: center; gap: clamp(8px,1vw,12px);
            border: 3px solid transparent; border-radius: 16px;
            padding: clamp(12px,1.8vh,18px) clamp(12px,1.2vw,18px);
            font-weight: 800; font-size: clamp(.78rem,1.55vh,1rem); cursor: pointer;
            font-family: inherit; text-align: left; transition: transform .1s, box-shadow .1s; line-height: 1.25;
        }
        .liga:hover { transform: translateY(-2px); }
        .liga:active { transform: translateY(2px); }
        .liga.cor0 { background: var(--uva-claro); color: var(--uva-escuro); box-shadow: 0 4px 0 #a9e2ff; }
        .liga.cor1 { background: var(--menta-claro); color: #2f6e00; box-shadow: 0 4px 0 #b6f27a; }
        .liga.cor2 { background: var(--laranja-claro); color: #8a5200; box-shadow: 0 4px 0 #ffd699; }
        .liga.cor3 { background: var(--coral-claro); color: #a81f1f; box-shadow: 0 4px 0 #ffb3b5; }
        .liga.sel { border-color: var(--tinta); transform: translateY(2px); }
        .liga.certo { border-color: var(--menta); background: var(--menta-claro); color: #2f6e00; cursor: default; box-shadow: none; transform: none; }
        .liga.errado { border-color: var(--coral); animation: chacoalhar .3s; }
        @keyframes chacoalhar { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

        /* ---------- Capa e final ---------- */
        .capa { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: clamp(8px,1.6vh,18px); min-height: 0; }
        .capa h1 { font-size: clamp(1.4rem, 4.2vh, 2.7rem); color: var(--uva-escuro); line-height: 1.1; font-weight: 800; }
        .capa .sub { font-size: clamp(.85rem, 1.9vh, 1.2rem); color: #6b6b6b; font-weight: 700; }
        .capa .emoji { font-size: clamp(2.2rem, 6vh, 3.6rem); line-height: 1; }
        .grade-icones { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: clamp(6px,1.1vh,12px); width: 100%; max-width: 640px; }
        .mini { display: flex; flex-direction: column; align-items: center; gap: 3px; background: #fff; border: 3px solid var(--borda); border-radius: 16px; box-shadow: 0 4px 0 var(--borda); padding: clamp(6px,1.1vh,11px) 4px; }
        .mini .ic { font-size: clamp(1.2rem,2.6vh,1.8rem); line-height: 1; }
        .mini span { font-size: clamp(.6rem,1.25vh,.8rem); font-weight: 800; color: var(--tinta); }

        .troféu { text-align: center; }
        .troféu .emoji { font-size: clamp(2.4rem,6.5vh,4rem); }
        .troféu h2 { color: var(--uva-escuro); font-size: clamp(1.3rem,3.6vh,2.2rem); margin: 8px 0; font-weight: 800; }
        .troféu p { font-size: clamp(.9rem,1.85vh,1.15rem); color: #6b6b6b; font-weight: 600; line-height: 1.45; margin-bottom: 8px; }
        .troféu b { color: var(--menta-escuro); }

        .aviso-adulto {
            background: var(--coral-claro); border-left: 6px solid var(--coral);
            padding: clamp(9px,1.3vh,14px) clamp(11px,1.2vw,18px); border-radius: 12px;
            font-weight: 700; font-size: clamp(.78rem,1.55vh,.98rem); color: #a81f1f; flex-shrink: 0;
        }

        /* ---------- Barra de baixo ---------- */
        .rodape { display: flex; align-items: center; gap: clamp(8px,1.4vw,20px); flex-shrink: 0; }
        .nav {
            border: none; text-transform: uppercase; letter-spacing: .03em;
            padding: clamp(9px,1.5vh,14px) clamp(14px,1.8vw,28px); border-radius: 14px;
            cursor: pointer; font-size: clamp(.8rem,1.6vh,1.02rem); font-weight: 800; font-family: inherit; white-space: nowrap;
            transition: transform .08s, box-shadow .08s;
        }
        .nav:disabled { opacity: .4; cursor: not-allowed; }
        #btnProximo { background: var(--menta); color: #fff; box-shadow: 0 4px 0 var(--menta-escuro); }
        #btnProximo:hover:not(:disabled) { background: #65db02; }
        #btnProximo:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 var(--menta-escuro); }
        #btnVoltar { background: #fff; color: var(--tinta); border: 3px solid var(--borda); box-shadow: 0 4px 0 var(--borda); }
        #btnVoltar:hover:not(:disabled) { background: #f7f7f7; }
        #btnVoltar:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 var(--borda); }
        .barra { flex: 1; height: 14px; background: var(--borda); border-radius: 999px; overflow: hidden; min-width: 40px; }
        .barra span { display: block; height: 100%; background: var(--menta); border-radius: 999px; transition: width .3s; }
        .contagem { color: var(--tinta); font-weight: 800; font-size: clamp(.75rem,1.5vh,.95rem); white-space: nowrap; }

        @media (max-width: 820px) {
            .topo { flex-wrap: wrap; padding: 10px 14px; gap: 10px; }
            .topo-emoji { font-size: 1.7rem; }
            .btn-ouvir { width: 100%; margin-top: 2px; }
            .trilha { flex-direction: column; gap: 10px; }
            .trilha-passo { flex-direction: row; justify-content: flex-start; gap: 10px; padding: 9px 12px 9px 20px; width: 100%; min-height: auto; text-align: left; }
            .trilha-passo .ic { font-size: 1.4rem; }
            .trilha-seta { height: auto; justify-content: center; transform: rotate(90deg); font-size: 1rem; }
            .duplas { grid-template-columns: 1fr; }
            .opcoes.duas { grid-template-columns: 1fr; }
            .grade-icones { grid-template-columns: repeat(4, minmax(0,1fr)); }
            .cartao { padding: 10px 12px; }
            .item { padding: 8px 10px; }
            .rodape { flex-wrap: wrap; }
            .nav { flex: 1; }
            .barra { order: 3; width: 100%; flex-basis: 100%; }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="palco" id="palco"></div>
        <div class="rodape">
            <button class="nav" id="btnVoltar" onclick="voltar()">← Voltar</button>
            <div class="barra"><span id="progresso"></span></div>
            <span class="contagem"><span id="atual">1</span> / <span id="total">1</span></span>
            <button class="nav" id="btnProximo" onclick="avancar()">Próximo →</button>
        </div>
    </div>

    <script>
        let atual = 0;

        function topo(emoji, titulo, sub, fala) {
            return `<div class="topo">
                <div class="topo-emoji">${emoji}</div>
                <div class="topo-textos"><h1>${titulo}</h1><p>${sub}</p></div>
                <button class="btn-ouvir" data-falar="${fala.replace(/"/g,'&quot;')}">🔊 Ouvir</button>
            </div>`;
        }

        function trilha(passos) {
            return `<div class="trilha">${passos.map((p,i) =>
                (i ? '<div class="trilha-seta">➜</div>' : '') +
                `<div class="trilha-passo cor${i % 4}" data-passo="${i + 1}"><span class="ic">${p.ic}</span>${p.txt}</div>`
            ).join('')}</div>`;
        }

        function item(ic, txt) {
            return `<div class="item"><span class="ic">${ic}</span><span class="txt">${txt}</span><span class="selo">⬜</span></div>`;
        }

        // ---------- Ícones de botão parecidos com os do Word de verdade ----------
        function gbLetra(cls, letra) { return `<span class="gb ${cls}"><span class="gb-letra">${letra}</span></span>`; }
        function gbCor() { return `<span class="gb gb-cor"><span class="gb-letra" style="font-weight:900">A</span><span class="gb-barra"></span></span>`; }
        function gbTam() { return `<span class="gb gb-tam"><span class="gb-num">14</span><span class="gb-setas">▲▼</span></span>`; }
        function gbAlign(tipo) { return `<span class="gb gb-align ${tipo}"><span class="gb-linha"></span><span class="gb-linha"></span><span class="gb-linha"></span></span>`; }
        function gbLista() { return `<span class="gb gb-lista">${[1,2,3].map(() => '<span class="gb-linhaponto"><span class="gb-ponto"></span><span class="gb-tra"></span></span>').join('')}</span>`; }
        function gbEmoji(emoji, cls) { return `<span class="gb ${cls || ''}"><span class="gb-emoji">${emoji}</span></span>`; }

        const BOTAO_N = gbLetra('gb-n', 'N');
        const BOTAO_I = gbLetra('gb-i', 'I');
        const BOTAO_S = gbLetra('gb-s', 'S');
        const BOTAO_COR = gbCor();
        const BOTAO_TAM = gbTam();
        const BOTAO_ESQ = gbAlign('esq');
        const BOTAO_CENTRO = gbAlign('centro');
        const BOTAO_DIR = gbAlign('dir');
        const BOTAO_LISTA = gbLista();
        const BOTAO_DESFAZER = gbEmoji('↩️', 'gb-desfazer');
        const BOTAO_SALVAR = gbEmoji('💾', 'gb-salvar');

        function ribbonMock() {
            return `<div class="ribbon-mock">
                <span class="rotulo">📋 Guia Início — os botões que você vai usar</span>
                ${BOTAO_N}${BOTAO_I}${BOTAO_S}${BOTAO_COR}${BOTAO_TAM}${BOTAO_ESQ}${BOTAO_CENTRO}${BOTAO_DIR}${BOTAO_LISTA}${BOTAO_DESFAZER}${BOTAO_SALVAR}
            </div>`;
        }

        function tabelaVocab() {
            const linhas = [
                ['Negrito', 'Deixa a letra mais grossa e escura.'],
                ['Itálico', 'Deixa a letra tombada para o lado.'],
                ['Sublinhado', 'Faz um risco embaixo da letra.'],
                ['Cor da fonte', 'Muda a cor da letra.'],
                ['Alinhar', 'Decide se o texto fica na esquerda, no meio ou na direita da folha.'],
                ['Lista', 'Coloca uma bolinha antes de cada linha.'],
                ['Desfazer', 'Volta o que você acabou de fazer, se errou algo.'],
                ['Salvar', 'Guarda o arquivo no computador.'],
            ];
            return `<table class="tabela-vocab">
                <thead><tr><th>Botão</th><th>O que ele faz</th></tr></thead>
                <tbody>${linhas.map(([t,d]) => `<tr><td>${t}</td><td>${d}</td></tr>`).join('')}</tbody>
            </table>`;
        }

        const telas = [
            // 1 capa
            { html: `<div class="capa">
                <div class="emoji">📝💻</div>
                <h1>Conhecendo o Word!</h1>
                <p class="sub">Aprendendo a usar a ferramenta de verdade</p>
                <div class="grade-icones">
                    <div class="mini">${BOTAO_N}<span>Negrito</span></div>
                    <div class="mini">${BOTAO_I}<span>Itálico</span></div>
                    <div class="mini">${BOTAO_COR}<span>Cor</span></div>
                    <div class="mini">${BOTAO_CENTRO}<span>Alinhar</span></div>
                    <div class="mini">${BOTAO_TAM}<span>Tamanho</span></div>
                    <div class="mini">${BOTAO_LISTA}<span>Lista</span></div>
                    <div class="mini">${BOTAO_DESFAZER}<span>Desfazer</span></div>
                    <div class="mini">${BOTAO_SALVAR}<span>Salvar</span></div>
                </div>
                <button class="btn-ouvir" style="background:var(--uva); border-color:var(--uva);" data-falar="Bem-vindo! Hoje você vai aprender a usar o Word de verdade no computador.">🔊 Ouvir</button>
            </div>` },

            // 2 o que vamos fazer
            { html: topo('🎯','O Que Vamos Fazer?','Aprender aqui, fazer no Word de verdade','Vamos aprender aqui na tela e depois fazer a mesma coisa no Word de verdade, no computador.') + `
                <div class="corpo">
                    <div class="cartao uva">Essa atividade não é para escrever um trabalho grande. É para você <b>conhecer os botões do Word</b> e saber usá-los em qualquer arquivo, não importa o que você for escrever depois.</div>
                    <div class="cartao laranja">Você vai digitar só um textinho bem curto, chamado <b>"Sobre Mim"</b>, e usar ele para praticar os botões.</div>
                    <div class="aviso-adulto">👨‍👩‍👧 Peça para um adulto ficar por perto enquanto você usa o computador!</div>
                </div>` },

            // 3 abrindo o word
            { html: topo('📂','Abrindo o Word','O primeiro passo','Clique no botão Iniciar, procure por Word, e depois clique em Documento em branco.') + `
                <div class="corpo">
                    ${trilha([
                        {ic:'🏁', txt:'Botão Iniciar'},
                        {ic:'🔎', txt:'Digite "Word"'},
                        {ic:'📄', txt:'Documento em branco'},
                    ])}
                    <div class="cartao menta">Pronto! Agora apareceu uma <b>folha branca</b> na sua tela, esperando você digitar.</div>
                </div>` },

            // 4 conhecendo a tela
            { html: topo('🖥️','Conhecendo a Tela','Onde ficam os botões','Lá em cima da tela fica a Guia Início, com os botões de negrito, cor e tamanho da letra.') + `
                <div class="corpo">
                    <div class="cartao uva">Lá em cima da tela do Word tem várias abas. A mais importante para você agora é a <b>Guia Início</b> — normalmente ela já vem selecionada.</div>
                    ${ribbonMock()}
                    ${tabelaVocab()}
                </div>` },

            // 5 digitando o texto
            { html: topo('⌨️','Digitando "Sobre Mim"','Um texto bem curtinho','Digite seu nome, sua idade, sua cor favorita e um animal que você gosta, cada coisa em uma linha.') + `
                <div class="corpo">
                    <div class="cartao laranja">Na folha em branco, digite estas 4 linhas (pode trocar pelas suas respostas de verdade!):</div>
                    <div class="folha">
                        <div class="titulo-folha">Sobre Mim</div>
                        <div class="linha">Nome: Ana</div>
                        <div class="linha">Idade: 8 anos</div>
                        <div class="linha">Cor favorita: Verde</div>
                        <div class="linha">Animal favorito: Cachorro</div>
                    </div>
                    <div class="cartao menta">Aperte <b>Enter</b> depois de cada linha para pular para a próxima.</div>
                </div>` },

            // 6 selecionando texto
            { html: topo('🖱️','Selecionando o Texto','Antes de formatar, tem que selecionar','Para formatar uma palavra, primeiro você precisa selecionar ela, deixando ela pintada de azul.') + `
                <div class="corpo">
                    <div class="cartao uva">Antes de deixar uma palavra colorida ou em negrito, você precisa <b>selecionar</b> ela — ou seja, deixar ela pintada de azul.</div>
                    ${trilha([
                        {ic:'🖱️', txt:'2 cliques rápidos em cima de uma palavra a seleciona'},
                        {ic:'👆', txt:'Clicar e arrastar seleciona um pedaço maior'},
                        {ic:'⌨️', txt:'Ctrl + A seleciona a folha inteira'},
                    ])}
                    <div class="cartao menta">Experimente selecionar a palavra <b>"Sobre"</b> do seu título, dando 2 cliques rápidos nela.</div>
                </div>` },

            // 7 negrito itálico sublinhado
            { html: topo(BOTAO_N + BOTAO_I + BOTAO_S,'Negrito, Itálico e Sublinhado','As três letrinhas mágicas','Selecione o título Sobre Mim e clique no N para negrito, no I para itálico e no S para sublinhado.') + `
                <div class="corpo">
                    <div class="cartao uva">Selecione o título <b>"Sobre Mim"</b> e experimente clicar em cada um destes botões da Guia Início:</div>
                    ${trilha([
                        {ic: BOTAO_N, txt:'N = Negrito (letra grossa)'},
                        {ic: BOTAO_I, txt:'I = Itálico (letra tombada)'},
                        {ic: BOTAO_S, txt:'S = Sublinhado (risco embaixo)'},
                    ])}
                    <div class="cartao laranja">Você pode clicar em mais de um ao mesmo tempo! Deixe o título em <b>negrito</b>.</div>
                </div>` },

            // 8 quiz V/F
            { html: topo('🧠','Verdadeiro ou Falso?','Vamos testar','Se você clicar de novo no botão negrito depois de já ter deixado a letra em negrito, ela volta ao normal. Isso é verdadeiro ou falso?') + `
                <div class="corpo">
                    <div class="pergunta">Depois de deixar uma palavra em negrito, se você <b>clicar de novo</b> no mesmo botão N, a letra volta ao normal.</div>
                    <div class="opcoes duas" id="vf1">
                        <button class="opcao" data-vf="verdadeiro">✅ Verdadeiro</button>
                        <button class="opcao" data-vf="falso">❌ Falso</button>
                    </div>
                    <div class="aviso" id="vf1msg"></div>
                </div>`, jogo: 'vf1' },

            // 9 tamanho e cor
            { html: topo(BOTAO_TAM + BOTAO_COR,'Tamanho e Cor da Fonte','Deixando do seu jeito','Selecione o título e mude o número do tamanho da letra e clique na setinha da cor da fonte para escolher uma cor.') + `
                <div class="corpo">
                    <div class="cartao laranja">Com o título ainda selecionado, procure na Guia Início:</div>
                    ${trilha([
                        {ic: BOTAO_TAM, txt:'A caixinha com um número = tamanho da letra'},
                        {ic: BOTAO_COR, txt:'A letra A com uma cor embaixo = cor da fonte'},
                    ])}
                    <div class="cartao menta">Aumente o tamanho da letra do título e escolha a sua cor favorita para ele!</div>
                </div>` },

            // 10 alinhamento
            { html: topo(BOTAO_ESQ + BOTAO_CENTRO + BOTAO_DIR,'Alinhamento','Onde o texto fica na folha','Selecione o título e clique no botão do meio, o de centralizar, para deixar o título no meio da folha.') + `
                <div class="corpo">
                    <div class="cartao uva">O alinhamento decide se o texto fica na esquerda, no meio, na direita ou espalhado na folha.</div>
                    ${trilha([
                        {ic: BOTAO_ESQ, txt:'Esquerda'},
                        {ic: BOTAO_CENTRO, txt:'Centralizar'},
                        {ic: BOTAO_DIR, txt:'Direita'},
                    ])}
                    <div class="cartao laranja">Selecione o título "Sobre Mim" e clique no botão do <b>meio (centralizar)</b>.</div>
                </div>` },

            // 11 lista com marcadores
            { html: topo(BOTAO_LISTA,'Lista com Marcadores','Bolinhas antes de cada linha','Selecione suas 3 últimas linhas e clique no botão da lista com bolinhas para transformar em uma lista.') + `
                <div class="corpo">
                    <div class="cartao laranja">Selecione as linhas de <b>idade, cor favorita e animal favorito</b> (as 3 últimas) e clique no botão da lista com bolinhas, na Guia Início.</div>
                    <div class="folha">
                        <div class="linha">• Idade: 8 anos</div>
                        <div class="linha">• Cor favorita: Verde</div>
                        <div class="linha">• Animal favorito: Cachorro</div>
                    </div>
                    <div class="cartao menta">Cada linha ganhou uma bolinha na frente. Ficou mais fácil de ler!</div>
                </div>` },

            // 12 jogo ligar
            { html: topo('🔗','Ligue os Pontos','Botão ↔ o que ele faz','Clique num botão da esquerda e depois na função que combina com ele, na direita.') + `
                <div class="corpo">
                    <div class="duplas">
                        <div class="coluna" id="ligaE"></div>
                        <div class="coluna" id="ligaD"></div>
                    </div>
                    <div class="placar" id="ligaPlacar">0 de 4 certos</div>
                </div>`, jogo: 'ligar1' },

            // 13 desfazer
            { html: topo(BOTAO_DESFAZER,'Desfazer','O botão que te salva de erros','Se você errar alguma coisa, aperte Ctrl mais Z, ou clique na setinha para a esquerda lá em cima, para desfazer.') + `
                <div class="corpo">
                    <div class="cartao coral">Errou alguma coisa? Não precisa ficar nervoso(a)! O Word tem um botão mágico para consertar.</div>
                    ${trilha([
                        {ic:'⌨️', txt:'Aperte Ctrl + Z ao mesmo tempo'},
                        {ic: BOTAO_DESFAZER, txt:'Ou clique na setinha para a esquerda, lá em cima'},
                    ])}
                    <div class="cartao menta">Experimente: digite uma letra qualquer a mais, e depois desfaça ela com Ctrl + Z.</div>
                </div>` },

            // 14 salvando
            { html: topo(BOTAO_SALVAR,'Salvando o Arquivo','Guardando seu trabalho','Aperte Ctrl mais S, escolha um lugar para guardar, escreva um nome para o arquivo e clique em Salvar.') + `
                <div class="corpo">
                    ${trilha([
                        {ic:'⌨️', txt:'Aperte Ctrl + S'},
                        {ic:'📁', txt:'Escolha um lugar (ex: área de trabalho)'},
                        {ic:'✏️', txt:'Escreva um nome para o arquivo'},
                        {ic: BOTAO_SALVAR, txt:'Clique em Salvar'},
                    ])}
                    <div class="cartao menta">Pronto! Da próxima vez, você só aperta <b>Ctrl + S</b> de novo para salvar as novas mudanças.</div>
                </div>` },

            // 15 checklist final
            { html: topo('✅','Hora de Praticar!','Faça cada coisa no Word de verdade','Agora faça cada uma dessas coisas no Word de verdade, no computador, e marque aqui.') + `
                <div class="corpo">
                    <div class="lista">
                        ${item('📂','Abri o Word e um documento em branco')}
                        ${item('⌨️','Digitei o texto Sobre Mim')}
                        ${item(BOTAO_N,'Deixei uma palavra em negrito')}
                        ${item(BOTAO_COR,'Mudei o tamanho ou a cor da letra')}
                        ${item(BOTAO_CENTRO,'Centralizei o título')}
                        ${item(BOTAO_LISTA,'Fiz uma lista com bolinhas')}
                        ${item(BOTAO_DESFAZER,'Usei o Ctrl + Z para desfazer algo')}
                        ${item(BOTAO_SALVAR,'Salvei o arquivo com um nome')}
                    </div>
                    <div class="placar" id="placarFinal">0 de 8 feitos</div>
                </div>` },

            // 16 troféu
            { html: `<div class="corpo" style="justify-content:center;">
                <div class="troféu">
                    <div class="emoji">🏆</div>
                    <h2>Você Já Sabe Usar o Word!</h2>
                    <p>Agora você conhece os botões de <b>negrito</b>, <b>itálico</b>, <b>sublinhado</b>, <b>cor</b>, <b>tamanho</b>, <b>alinhamento</b>, <b>lista</b>, <b>desfazer</b> e <b>salvar</b>.</p>
                    <p>Não importa o que você for escrever depois — um trabalho, uma carta, uma lista — você já sabe onde clicar!</p>
                    <button class="btn-ouvir" style="background:var(--uva); border-color:var(--uva);" data-falar="Parabéns! Agora você já sabe usar os botões principais do Word. Mostre para um adulto o que você fez.">🔊 Ouvir</button>
                </div>
            </div>` },
        ];

        function falar(texto, botao) {
            if (!('speechSynthesis' in window)) return;
            speechSynthesis.cancel();
            const f = new SpeechSynthesisUtterance(texto);
            f.lang = 'pt-BR'; f.rate = .92;
            if (botao) {
                botao.classList.add('falando');
                f.onend = () => botao.classList.remove('falando');
                f.onerror = () => botao.classList.remove('falando');
            }
            speechSynthesis.speak(f);
        }
        document.addEventListener('click', e => {
            const b = e.target.closest('[data-falar]');
            if (b) falar(b.dataset.falar, b);
        });

        // ---------- dados dos jogos ----------
        const PARES_BOTOES = [
            { chave:'negrito',    e: BOTAO_N + '<span>Negrito</span>',        d:'Deixa a letra mais grossa' },
            { chave:'italico',    e: BOTAO_I + '<span>Itálico</span>',        d:'Deixa a letra tombada' },
            { chave:'cor',        e: BOTAO_COR + '<span>Cor da fonte</span>', d:'Muda a cor da letra' },
            { chave:'centralizar',e: BOTAO_CENTRO + '<span>Centralizar</span>', d:'Coloca o texto no meio da folha' },
        ];

        const misturar = l => { const c=l.slice(); for(let i=c.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[c[i],c[j]]=[c[j],c[i]];} return c; };

        // ---------- checklists ----------
        function ligarListas() {
            document.querySelectorAll('.lista').forEach(lista => {
                lista.querySelectorAll('.item').forEach(it => {
                    it.addEventListener('click', () => {
                        it.classList.toggle('feito');
                        it.querySelector('.selo').textContent = it.classList.contains('feito') ? '✅' : '⬜';
                        const placar = lista.nextElementSibling;
                        if (placar && placar.classList.contains('placar')) {
                            const t = lista.querySelectorAll('.item').length;
                            const f = lista.querySelectorAll('.item.feito').length;
                            placar.textContent = `${f} de ${t} feitos`;
                        }
                    });
                });
            });
        }

        // ---------- jogos ----------
        function jogoVf1() {
            const area = document.getElementById('vf1'), msg = document.getElementById('vf1msg');
            if (!area) return;
            area.querySelectorAll('.opcao').forEach(b => b.addEventListener('click', () => {
                const certo = b.dataset.vf === 'verdadeiro';
                area.querySelectorAll('.opcao').forEach(x => x.classList.remove('certo','errado'));
                b.classList.add(certo ? 'certo' : 'errado');
                msg.className = 'aviso on ' + (certo ? 'ok' : 'nao');
                msg.textContent = certo ? '✅ Isso mesmo, é Verdadeiro! Clicar de novo tira o negrito.' : '❌ A resposta certa é Verdadeiro! Clicar de novo tira o negrito.';
            }));
        }

        function jogoLigar1() {
            const colE = document.getElementById('ligaE'), colD = document.getElementById('ligaD'), placar = document.getElementById('ligaPlacar');
            if (!colE) return;
            const pares = misturar(PARES_BOTOES);
            const direitas = misturar(pares);
            let selecionada = null, acertos = 0;

            pares.forEach((p, i) => {
                const b = document.createElement('button');
                b.className = 'liga cor' + (i % 4); b.innerHTML = p.e; b.dataset.chave = p.chave;
                colE.appendChild(b);
            });
            direitas.forEach((p, i) => {
                const b = document.createElement('button');
                b.className = 'liga cor' + (i % 4); b.textContent = p.d; b.dataset.chave = p.chave;
                colD.appendChild(b);
            });

            function checar() {
                document.querySelectorAll(`.liga[data-chave]`).forEach(b => {
                    if (b.classList.contains('certo')) return;
                    b.addEventListener('click', () => {
                        if (b.classList.contains('certo')) return;
                        const emE = b.parentElement === colE;
                        if (!selecionada) {
                            if (!emE) return;
                            selecionada = b;
                            b.classList.add('sel');
                        } else {
                            if (emE) {
                                selecionada.classList.remove('sel');
                                selecionada = b;
                                b.classList.add('sel');
                                return;
                            }
                            const ok = selecionada.dataset.chave === b.dataset.chave;
                            if (ok) {
                                selecionada.classList.remove('sel');
                                selecionada.classList.add('certo');
                                b.classList.add('certo');
                                acertos++;
                                placar.textContent = `${acertos} de ${pares.length} certos`;
                            } else {
                                b.classList.add('errado');
                                setTimeout(() => b.classList.remove('errado'), 500);
                            }
                            selecionada.classList.remove('sel');
                            selecionada = null;
                        }
                    }, { once: false });
                });
            }
            checar();
        }

        const JOGOS = { vf1: jogoVf1, ligar1: jogoLigar1 };

        function montar() {
            const palco = document.getElementById('palco');
            telas.forEach((t,i) => {
                const d = document.createElement('div');
                d.className = 'slide' + (i === 0 ? ' ativo' : '');
                d.innerHTML = t.html;
                palco.appendChild(d);
            });
            document.getElementById('total').textContent = telas.length;
            ligarListas();
            telas.forEach(t => { if (t.jogo && JOGOS[t.jogo]) JOGOS[t.jogo](); });
            atualizar();
        }

        function mostrar(n) {
            document.querySelectorAll('.slide')[atual].classList.remove('ativo');
            atual = n;
            document.querySelectorAll('.slide')[atual].classList.add('ativo');
            atualizar();
        }
        function avancar() { if (atual < telas.length - 1) mostrar(atual + 1); }
        function voltar()  { if (atual > 0) mostrar(atual - 1); }

        function atualizar() {
            document.getElementById('atual').textContent = atual + 1;
            document.getElementById('btnVoltar').disabled = atual === 0;
            document.getElementById('btnProximo').disabled = atual === telas.length - 1;
            document.getElementById('progresso').style.width = ((atual + 1) / telas.length * 100) + '%';
            if ('speechSynthesis' in window) speechSynthesis.cancel();
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight') avancar();
            if (e.key === 'ArrowLeft') voltar();
        });

        montar();
    </script>
</body>
</html>
