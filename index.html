<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MicroAtividades</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="icon" href="img/siteicon.svg" type="image/svg+xml">
  <!-- no <head> pra página já abrir escura, sem piscar branco antes -->
  <script src="js/core/tema.js"></script>
</head>

<body>

  <app-navbar></app-navbar>

  <div class="container">

    <app-banner titulo="Atividades Extras" texto="Escolha uma atividade abaixo para começar.">
    </app-banner>

    <div class="barra">
      <input type="search" class="busca" id="busca-curso" placeholder="Buscar atividade..."
        aria-label="Buscar atividade">
    </div>

    <!-- As grades abaixo são preenchidas por js/pages/home.js a partir do
         catálogo em js/data/atividades.js — não escreva cursos aqui. -->

    <h2 class="section-title">Atividades disponíveis</h2>
    <div class="cursos-grid" id="lista-cursos"></div>

    <h2 class="section-title">Mais Atividades</h2>
    <div class="cursos-grid" id="lista-extras"></div>

    <div class="aviso hidden" id="home-sem-resultado">
      <strong>Nenhuma atividade encontrada.</strong>
      <p>Tente procurar por outra palavra — por exemplo "Excel", "Word" ou "Python".</p>
    </div>

  </div>

  <app-footer></app-footer>

  <script src="js/core/router.js"></script>
  <script src="js/components/layout.js"></script>
  <script src="js/components/cards.js"></script>
  <script src="js/data/atividades.js"></script>
  <script src="js/pages/home.js"></script>
</body>

</html>
