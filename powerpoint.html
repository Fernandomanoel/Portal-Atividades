<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerPoint Atividades</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: #f1f5f9;
            color: #1e293b;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        /* SIDEBAR (COR DO POWERPOINT) */
        .sidebar {
            width: 220px;
            background: linear-gradient(180deg, #d24726, #b9381e);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: bold;
            color: white;
        }

        .logo-icon {
            background: white;
            color: #d24726;
            padding: 5px 10px;
            border-radius: 8px;
        }

        .sidebar nav a {
            display: block;
            text-decoration: none;
            color: #ffe4dc;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: 0.3s;
        }

        .sidebar nav a:hover,
        .sidebar nav .active {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        /* CONTENT (FUNDO BRANCO) */
        .content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            background: white;
            border-top-left-radius: 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .tabs {
            margin-bottom: 20px;
        }

        .tab {
            background: #f97316;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            display: inline-block;
        }

        /* CARD */
        .course-card {
            background: #ffffff;
            border-radius: 16px;
            display: flex;
            align-items: center;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #e2e8f0;
            transition: 0.3s;
        }

        .course-card:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .thumb {
            width: 100px;
            height: 70px;
            background: #f1f5f9;
            border-radius: 10px;
            overflow: hidden;
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .info {
            flex: 1;
            padding: 0 15px;
        }

        .info h3 {
            margin-bottom: 5px;
        }

        .desc {
            font-size: 14px;
            color: #64748b;
        }

        .tags span {
            background: #f97316;
            color: white;
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 12px;
            margin-top: 5px;
            display: inline-block;
        }

        /* BOTÃO POWERPOINT */
        .right button {
            background: linear-gradient(45deg, #f97316, #d24726);
            border: none;
            padding: 10px 15px;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }

        .right button:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(210, 71, 38, 0.4);
        }

        /* OVERLAY */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }

        .frame-box {
            width: 80%;
            height: 80%;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 20px;
            cursor: pointer;
            z-index: 10;
            color: white;
        }

        iframe {
            width: 100%;
            height: 100%;
        }

        /* RESPONSIVO */
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }

            .content {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="app">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-icon">P</span>
                <span>PowerPoint</span>
            </div>

            <nav>
                <a href="index.html">Voltar</a>
                <a href="#" class="active">Atividades</a>
            </nav>
        </aside>

        <!-- MAIN -->
        <main class="content">

            <h1>Atividades PowerPoint 2021</h1>

            <div class="tabs">
                <span class="tab">Disponíveis</span>
            </div>

            <div class="course-card">
                <div class="thumb">
                    <img src="https://imgs.search.brave.com/UwROwf8rFKDh4JDQ9gIR_A6kPcgy3m0o2nPXI1sqFlA/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9pbWFn/ZXMuc2Z0Y2RuLm5l/dC9pbWFnZXMvdF9h/cHAtY292ZXItcyxm/X2F1dG8vcC81YzFm/ZjM4Ni05NmQxLTEx/ZTYtOTU0MC0wMDE2/M2VjOWY1ZmEvNDA2/MzI4NTI5OS9taWNy/b3NvZnQtcG93ZXJw/b2ludC0yMDEwLWJk/MjI4ZmQ5LTMxNzct/NDg0OC1iNTZjLWMz/MGRhZTg0MDdjZS5w/bmc" alt="Atividade">
                </div>

                <div class="info">
                    <h3>PowerPoint: Lista de Atividades</h3>
                    <p class="desc">Criação de slides básicos com título, texto e organização.</p>

                    <div class="tags">
                        <span>PDF</span>
                    </div>
                </div>

                <div class="right">
                    <a href="pdfs/PowerPoint/PowerPoint - Lista de Atividades 01.pdf"><button>Abrir</button></a>
                </div>
            </div>

        </main>

    </div>

    <!-- OVERLAY -->
    <div class="overlay" id="overlay">
        <div class="frame-box">
            <span class="close-btn" onclick="closeOverlay()">✖</span>

            <iframe src="" id="pdfFrame"></iframe>
        </div>
    </div>


</body>

</html>
