<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missão Conhecendo o Computador - Peças e Programas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --tinta: #14213d;
            --papel: #fffdf7;
            --menta: #12b886;
            --menta-claro: #e6fcf5;
            --laranja: #ff8c42;
            --laranja-claro: #fff4ec;
            --uva: #7048e8;
            --uva-claro: #f3f0ff;
            --sol: #ffd43b;
            --coral: #ff6b6b;
            --coral-claro: #fff0f0;
            --borda: #dfe3ec;
        }

        html, body { height: 100%; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at 12% 18%, rgba(255,212,59,.18) 0, transparent 42%),
                radial-gradient(circle at 88% 82%, rgba(18,184,134,.20) 0, transparent 45%),
                linear-gradient(160deg, #1b1f3b 0%, #2d1b53 100%);
            color: var(--tinta);
            overflow: hidden;
        }

        .app { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; padding: clamp(8px, 1.6vh, 20px); gap: clamp(8px, 1.4vh, 16px); }
        .palco { flex: 1; position: relative; min-height: 0; overflow: hidden; display: flex; }

        .slide {
            position: absolute; inset: 0;
            background: var(--papel); border-radius: 22px;
            box-shadow: 0 18px 60px rgba(0,0,0,.38);
            padding: clamp(14px, 2.4vh, 26px);
            display: flex; flex-direction: column; gap: clamp(8px, 1.4vh, 16px);
            opacity: 0; transform: scale(.97);
            transition: opacity .35s ease, transform .35s ease;
            pointer-events: none; overflow: hidden;
        }
        .slide.ativo { opacity: 1; transform: scale(1); pointer-events: auto; z-index: 5; }

        .topo {
            display: flex; align-items: center; gap: clamp(10px, 1.4vw, 18px);
            background: linear-gradient(100deg, var(--uva) 0%, #9775fa 100%);
            color: #fff; border-radius: 18px;
            padding: clamp(10px, 1.6vh, 18px) clamp(14px, 1.6vw, 22px);
            flex-shrink: 0;
        }
        .topo-emoji { font-size: clamp(1.8rem, 3.4vh, 2.6rem); line-height: 1; }
        .topo-textos { flex: 1; min-width: 0; }
        .topo h1 { font-size: clamp(1.05rem, 2.5vh, 1.75rem); font-weight: 800; line-height: 1.15; }
        .topo p { font-size: clamp(.75rem, 1.5vh, 1rem); opacity: .92; }

        .btn-ouvir {
            background: rgba(255,255,255,.22); color: #fff; border: 2px solid rgba(255,255,255,.5);
            border-radius: 999px; padding: clamp(7px,1.2vh,11px) clamp(12px,1.4vw,20px);
            font-size: clamp(.78rem, 1.5vh, .98rem); font-weight: 800; cursor: pointer;
            font-family: inherit; white-space: nowrap; flex-shrink: 0;
        }
        .btn-ouvir:hover { background: rgba(255,255,255,.34); }
        .btn-ouvir.falando { background: var(--menta); border-color: var(--menta); }

        .corpo {
            flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
            display: flex; flex-direction: column; gap: clamp(8px, 1.3vh, 14px);
            justify-content: safe center; padding-right: 4px;
        }
        .corpo::-webkit-scrollbar { width: 8px; }
        .corpo::-webkit-scrollbar-thumb { background: var(--uva); border-radius: 10px; }

        .cartao {
            background: #fff; border: 3px solid var(--borda); border-radius: 16px;
            padding: clamp(10px, 1.6vh, 18px) clamp(12px, 1.4vw, 20px);
            font-weight: 700; font-size: clamp(.85rem, 1.75vh, 1.1rem); line-height: 1.35;
        }
        .cartao.menta { background: var(--menta-claro); border-color: var(--menta); }
        .cartao.laranja { background: var(--laranja-claro); border-color: var(--laranja); }
        .cartao.uva { background: var(--uva-claro); border-color: var(--uva); }
        .cartao.coral { background: var(--coral-claro); border-color: var(--coral); }
        .cartao.centro { text-align: center; }
        .cartao b { color: var(--uva); }

        .pergunta { font-weight: 800; color: var(--tinta); font-size: clamp(.9rem,1.9vh,1.15rem); line-height: 1.3; text-align: center; }

        /* ---------- Desenho interativo ---------- */
        .cena { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
        .cena svg { max-width: 100%; max-height: 100%; height: auto; }

        .peca-svg { cursor: pointer; transition: opacity .15s; }
        .peca-svg:hover { opacity: .78; }
        .peca-svg.acertou { filter: drop-shadow(0 0 10px var(--menta)); }
        .peca-svg.errou { filter: drop-shadow(0 0 10px var(--coral)); }
        .rotulo-svg { font: 800 13px 'Segoe UI', sans-serif; fill: var(--tinta); pointer-events: none; }

        .balao {
            background: var(--uva); color: #fff; border-radius: 16px;
            padding: clamp(9px,1.4vh,15px) clamp(12px,1.4vw,20px);
            font-weight: 700; font-size: clamp(.82rem,1.65vh,1.05rem); text-align: center;
            line-height: 1.35; flex-shrink: 0; min-height: clamp(44px,7vh,64px);
            display: grid; place-items: center;
        }
        .balao > span { display: block; }
        .balao.vazio { background: #eef0f6; color: #7a8194; }

        /* ---------- Botões e opções ---------- */
        .opcoes { display: grid; gap: clamp(7px,1.1vh,10px); }
        .opcoes.duas { grid-template-columns: 1fr 1fr; }
        .opcoes.tres { grid-template-columns: repeat(3, 1fr); }
        .opcao {
            background: #fff; border: 3px solid var(--borda); border-radius: 14px;
            padding: clamp(9px,1.4vh,15px) clamp(10px,1.2vw,18px);
            font-weight: 800; font-size: clamp(.82rem,1.65vh,1.05rem); cursor: pointer;
            font-family: inherit; text-align: center; color: var(--tinta); transition: all .18s;
        }
        .opcao:hover { border-color: var(--uva); }
        .opcao.certo { background: var(--menta-claro); border-color: var(--menta); }
        .opcao.errado { background: var(--coral-claro); border-color: var(--coral); }

        .aviso {
            padding: clamp(9px,1.3vh,14px) clamp(11px,1.2vw,18px); border-radius: 14px;
            font-weight: 800; font-size: clamp(.8rem,1.6vh,1rem); display: none; flex-shrink: 0; text-align: center;
        }
        .aviso.on { display: block; }
        .aviso.ok { background: var(--menta-claro); color: #0b7c5b; }
        .aviso.nao { background: var(--coral-claro); color: #b02525; }

        .btn-acao {
            align-self: center; background: var(--laranja); color: #fff; border: none; border-radius: 14px;
            padding: clamp(9px,1.4vh,14px) clamp(16px,1.6vw,26px); font-weight: 800;
            font-size: clamp(.85rem,1.6vh,1.05rem); cursor: pointer; font-family: inherit; flex-shrink: 0;
        }
        .btn-acao:hover { background: #f97316; }

        .placar { text-align: center; font-weight: 800; color: var(--uva); font-size: clamp(.85rem,1.7vh,1.1rem); flex-shrink: 0; }

        /* ---------- Paleta de pintura ---------- */
        .paleta { display: flex; justify-content: center; gap: clamp(8px,1.2vw,16px); flex-wrap: wrap; flex-shrink: 0; }
        .tinta-btn {
            display: flex; align-items: center; gap: 8px; cursor: pointer;
            border: 4px solid var(--borda); border-radius: 14px; background: #fff;
            padding: clamp(7px,1.1vh,12px) clamp(11px,1.3vw,18px);
            font-weight: 800; font-size: clamp(.78rem,1.55vh,1rem); font-family: inherit; color: var(--tinta);
        }
        .tinta-btn .bola { width: clamp(18px,2.6vh,26px); height: clamp(18px,2.6vh,26px); border-radius: 50%; border: 2px solid rgba(0,0,0,.25); flex-shrink: 0; }
        .tinta-btn.ativa { border-color: var(--tinta); transform: scale(1.05); }

        .quadro { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr)); gap: clamp(7px,1.1vh,12px); }
        .alvo {
            background: #fff; border: 4px solid var(--borda); border-radius: 16px;
            padding: clamp(8px,1.3vh,14px) 6px; text-align: center; cursor: pointer;
            transition: background .2s, border-color .2s;
        }
        .alvo .ic { font-size: clamp(1.5rem,3.2vh,2.4rem); line-height: 1; display: block; }
        .alvo .nm { font-weight: 800; font-size: clamp(.7rem,1.4vh,.92rem); margin-top: 4px; display: block; }
        .alvo.marcado { border-color: var(--tinta); }
        .alvo.ok { box-shadow: 0 0 0 4px var(--menta) inset; }
        .alvo.nao { box-shadow: 0 0 0 4px var(--coral) inset; }

        /* ---------- Classificar (2 caixas) ---------- */
        .caixas { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(8px,1.2vw,16px); }
        .caixa { border-radius: 16px; padding: clamp(8px,1.2vh,14px); min-height: clamp(70px,12vh,120px); }
        .caixa.azul { background: #e7f0ff; border: 4px dashed #4c6ef5; }
        .caixa.verde { background: var(--menta-claro); border: 4px dashed var(--menta); }
        .caixa h3 { text-align: center; font-size: clamp(.78rem,1.55vh,1rem); margin-bottom: 6px; }
        .caixa .conteudo { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }

        .banco-fichas { display: flex; flex-wrap: wrap; gap: clamp(6px,1vh,10px); justify-content: center; }
        .ficha {
            background: #fff; border: 3px solid var(--uva); border-radius: 12px;
            padding: clamp(6px,1vh,10px) clamp(9px,1.1vw,14px); cursor: pointer;
            font-weight: 800; font-size: clamp(.75rem,1.5vh,.95rem); color: var(--uva);
            display: flex; align-items: center; gap: 6px; transition: all .18s;
        }
        .ficha:hover { background: var(--uva); color: #fff; }
        .ficha.sel { background: var(--uva); color: #fff; }
        .ficha.posta { border-color: var(--borda); color: var(--tinta); cursor: default; background: #fff; }

        /* ---------- Capa / final ---------- */
        .capa { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: clamp(8px,1.6vh,18px); min-height: 0; }
        .capa h1 { font-size: clamp(1.4rem, 4.2vh, 2.7rem); color: var(--uva); line-height: 1.1; }
        .capa .sub { font-size: clamp(.85rem, 1.9vh, 1.2rem); color: #566; font-weight: 600; }
        .capa .emoji { font-size: clamp(2.2rem, 6vh, 3.6rem); line-height: 1; }
        .grade-icones { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: clamp(6px,1.1vh,12px); width: 100%; max-width: 560px; }
        .mini { display: flex; flex-direction: column; align-items: center; gap: 3px; background: #fff; border: 3px solid var(--borda); border-radius: 14px; padding: clamp(6px,1.1vh,11px) 4px; }
        .mini .ic { font-size: clamp(1.2rem,2.6vh,1.8rem); line-height: 1; }
        .mini span { font-size: clamp(.6rem,1.25vh,.8rem); font-weight: 800; color: var(--tinta); }

        .trofeu { text-align: center; }
        .trofeu .emoji { font-size: clamp(2.4rem,6.5vh,4rem); }
        .trofeu h2 { color: var(--uva); font-size: clamp(1.3rem,3.6vh,2.2rem); margin: 8px 0; }
        .trofeu p { font-size: clamp(.9rem,1.85vh,1.15rem); color: #455; font-weight: 600; line-height: 1.45; margin-bottom: 8px; }
        .trofeu b { color: var(--menta); }

        /* ---------- Rodapé ---------- */
        .rodape { display: flex; align-items: center; gap: clamp(8px,1.4vw,20px); flex-shrink: 0; }
        .nav { background: var(--sol); color: var(--tinta); border: none; padding: clamp(9px,1.5vh,14px) clamp(14px,1.8vw,28px); border-radius: 12px; cursor: pointer; font-size: clamp(.8rem,1.6vh,1.02rem); font-weight: 800; font-family: inherit; white-space: nowrap; }
        .nav:hover { background: #ffe066; }
        .nav:disabled { opacity: .4; cursor: not-allowed; }
        .barra { flex: 1; height: 10px; background: rgba(255,255,255,.25); border-radius: 999px; overflow: hidden; min-width: 40px; }
        .barra span { display: block; height: 100%; background: linear-gradient(90deg, var(--menta), var(--sol)); transition: width .3s; }
        .contagem { color: #fff; font-weight: 800; font-size: clamp(.75rem,1.5vh,.95rem); white-space: nowrap; }

        @media (max-width: 820px) {
            .topo { flex-wrap: wrap; padding: 10px 14px; gap: 10px; }
            .topo-emoji { font-size: 1.7rem; }
            .btn-ouvir { width: 100%; margin-top: 2px; }
            .opcoes.duas, .opcoes.tres { grid-template-columns: 1fr; }
            .caixas { grid-template-columns: 1fr; }
            .grade-icones { grid-template-columns: repeat(3, minmax(0,1fr)); }
            .cartao { padding: 10px 12px; }
            .rodape { flex-wrap: wrap; }
            .nav { flex: 1; }
            .barra { order: 3; width: 100%; flex-basis: 100%; }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="palco" id="palco"></div>
        <div class="rodape">
            <button class="nav" id="btnVoltar" onclick="voltar()">← Voltar</button>
            <div class="barra"><span id="progresso"></span></div>
            <span class="contagem"><span id="atual">1</span> / <span id="total">1</span></span>
            <button class="nav" id="btnProximo" onclick="avancar()">Próximo →</button>
        </div>
    </div>

    <script>
        let atual = 0;

        function topo(emoji, titulo, sub, fala) {
            return `<div class="topo">
                <div class="topo-emoji">${emoji}</div>
                <div class="topo-textos"><h1>${titulo}</h1><p>${sub}</p></div>
                <button class="btn-ouvir" data-falar="${fala.replace(/"/g,'&quot;')}">🔊 Ouvir</button>
            </div>`;
        }

        /* ============ DESENHO: computador completo ============ */
        function svgComputador(idPrefixo) {
            return `<svg viewBox="0 0 460 300" role="img">
                <!-- monitor -->
                <g class="peca-svg" data-peca="monitor" id="${idPrefixo}-monitor">
                    <rect x="112" y="18" width="196" height="130" rx="10" fill="#cfd6e6" stroke="#2b2f45" stroke-width="5"/>
                    <rect x="124" y="30" width="172" height="106" rx="5" fill="#9ad5f5" stroke="#2b2f45" stroke-width="3"/>
                    <rect x="196" y="148" width="28" height="26" fill="#b6bfd2" stroke="#2b2f45" stroke-width="5"/>
                    <rect x="164" y="172" width="92" height="12" rx="5" fill="#b6bfd2" stroke="#2b2f45" stroke-width="5"/>
                </g>
                <!-- gabinete -->
                <g class="peca-svg" data-peca="gabinete" id="${idPrefixo}-gabinete">
                    <rect x="330" y="60" width="86" height="164" rx="9" fill="#8f97ad" stroke="#2b2f45" stroke-width="5"/>
                    <circle cx="373" cy="82" r="9" fill="#4ade80" stroke="#2b2f45" stroke-width="3"/>
                    <rect x="346" y="104" width="54" height="9" rx="4" fill="#e8ebf2" stroke="#2b2f45" stroke-width="3"/>
                    <rect x="346" y="122" width="54" height="9" rx="4" fill="#e8ebf2" stroke="#2b2f45" stroke-width="3"/>
                </g>
                <!-- teclado -->
                <g class="peca-svg" data-peca="teclado" id="${idPrefixo}-teclado">
                    <rect x="96" y="200" width="188" height="52" rx="9" fill="#d7dce8" stroke="#2b2f45" stroke-width="5"/>
                    <rect x="110" y="212" width="24" height="10" rx="3" fill="#fff" stroke="#2b2f45" stroke-width="2"/>
                    <rect x="140" y="212" width="24" height="10" rx="3" fill="#fff" stroke="#2b2f45" stroke-width="2"/>
                    <rect x="170" y="212" width="24" height="10" rx="3" fill="#fff" stroke="#2b2f45" stroke-width="2"/>
                    <rect x="200" y="212" width="24" height="10" rx="3" fill="#fff" stroke="#2b2f45" stroke-width="2"/>
                    <rect x="230" y="212" width="24" height="10" rx="3" fill="#fff" stroke="#2b2f45" stroke-width="2"/>
                    <rect x="130" y="230" width="120" height="12" rx="4" fill="#fff" stroke="#2b2f45" stroke-width="2"/>
                </g>
                <!-- mouse -->
                <g class="peca-svg" data-peca="mouse" id="${idPrefixo}-mouse">
                    <rect x="308" y="200" width="52" height="76" rx="26" fill="#e3e7f0" stroke="#2b2f45" stroke-width="5"/>
                    <line x1="334" y1="202" x2="334" y2="236" stroke="#2b2f45" stroke-width="4"/>
                    <rect x="329" y="212" width="10" height="18" rx="5" fill="#ffd43b" stroke="#2b2f45" stroke-width="3"/>
                </g>
            </svg>`;
        }

        /* ============ DESENHO: portas de trás do gabinete ============ */
        function svgPortas() {
            return `<svg viewBox="0 0 340 240" role="img">
                <rect x="14" y="14" width="312" height="212" rx="12" fill="#8f97ad" stroke="#2b2f45" stroke-width="5"/>
                <g class="peca-svg" data-porta="energia">
                    <rect x="42" y="44" width="72" height="52" rx="8" fill="#2b2f45" stroke="#1b1e2e" stroke-width="4"/>
                    <circle cx="66" cy="70" r="8" fill="#ffd43b"/><circle cx="90" cy="70" r="8" fill="#ffd43b"/>
                    <text x="78" y="118" text-anchor="middle" class="rotulo-svg">⚡ Energia</text>
                </g>
                <g class="peca-svg" data-porta="video">
                    <rect x="140" y="44" width="72" height="52" rx="8" fill="#1e40af" stroke="#1b1e2e" stroke-width="4"/>
                    <rect x="156" y="62" width="40" height="16" rx="5" fill="#93c5fd"/>
                    <text x="176" y="118" text-anchor="middle" class="rotulo-svg">🖥️ Vídeo</text>
                </g>
                <g class="peca-svg" data-porta="usb">
                    <rect x="238" y="44" width="72" height="52" rx="8" fill="#111827" stroke="#1b1e2e" stroke-width="4"/>
                    <rect x="252" y="60" width="44" height="9" rx="3" fill="#e5e7eb"/>
                    <rect x="252" y="76" width="44" height="9" rx="3" fill="#e5e7eb"/>
                    <text x="274" y="118" text-anchor="middle" class="rotulo-svg">🔌 USB</text>
                </g>
                <g class="peca-svg" data-porta="som">
                    <rect x="42" y="146" width="72" height="52" rx="8" fill="#166534" stroke="#1b1e2e" stroke-width="4"/>
                    <circle cx="66" cy="172" r="9" fill="#86efac"/><circle cx="92" cy="172" r="9" fill="#fda4af"/>
                    <text x="78" y="218" text-anchor="middle" class="rotulo-svg">🎧 Som</text>
                </g>
                <g class="peca-svg" data-porta="rede">
                    <rect x="140" y="146" width="72" height="52" rx="8" fill="#4b5563" stroke="#1b1e2e" stroke-width="4"/>
                    <rect x="158" y="162" width="36" height="20" rx="4" fill="#d1d5db"/>
                    <text x="176" y="218" text-anchor="middle" class="rotulo-svg">🌐 Rede</text>
                </g>
            </svg>`;
        }

        /* ============ Telas ============ */
        const telas = [
            // 1 capa
            { html: `<div class="capa">
                <div class="emoji">🖥️🔍</div>
                <h1>Conhecendo o Computador</h1>
                <p class="sub">Clique, descubra e pinte!</p>
                <div class="grade-icones">
                    <div class="mini"><span class="ic">🖥️</span><span>Monitor</span></div>
                    <div class="mini"><span class="ic">🖱️</span><span>Mouse</span></div>
                    <div class="mini"><span class="ic">⌨️</span><span>Teclado</span></div>
                    <div class="mini"><span class="ic">🗄️</span><span>Gabinete</span></div>
                    <div class="mini"><span class="ic">🧠</span><span>CPU</span></div>
                    <div class="mini"><span class="ic">💾</span><span>HD</span></div>
                    <div class="mini"><span class="ic">🔌</span><span>Onde ligar</span></div>
                    <div class="mini"><span class="ic">🎨</span><span>Pintar</span></div>
                </div>
                <button class="btn-ouvir" style="background:var(--uva); border-color:var(--uva);" data-falar="Vamos conhecer o computador! Você vai clicar nas peças, descobrir o nome delas e pintar.">🔊 Ouvir</button>
            </div>` },

            // 2 explorador
            { html: topo('👆','Clique e Descubra!','Toque em cada peça do desenho','Clique em cada peça do computador para descobrir o nome dela e para que serve.') + `
                <div class="corpo">
                    <div class="balao vazio" id="balaoExp"><span>👆 Clique numa peça do desenho!</span></div>
                    <div class="cena">${svgComputador('exp')}</div>
                    <div class="placar" id="placarExp">0 de 4 peças descobertas</div>
                </div>`, jogo: 'explorador' },

            // 3 monitor
            { html: topo('🖥️','O Monitor','A tela que mostra tudo','O monitor é a tela. Ele mostra as imagens, mas não pensa e não guarda nada.') + `
                <div class="corpo">
                    <div class="cartao uva centro">🖥️ O monitor é a <b>TELA</b>. Ele só <b>mostra</b> as coisas!</div>
                    <div class="cartao laranja centro">👁️ É como os <b>olhos</b> do computador... ao contrário: ele mostra pra VOCÊ ver.</div>
                    <div class="cartao coral centro">❌ O monitor <b>não pensa</b> e <b>não guarda</b> nada. Se desligar, nada some!</div>
                </div>` },

            // 4 mouse
            { html: topo('🖱️','O Mouse','Os 3 botões','O mouse tem botão esquerdo, botão direito e a rodinha do meio. Clique em cada um.') + `
                <div class="corpo">
                    <div class="balao vazio" id="balaoMouse"><span>👆 Clique numa parte do mouse!</span></div>
                    <div class="cena">
                        <svg viewBox="0 0 240 300" role="img">
                            <rect x="40" y="20" width="160" height="260" rx="78" fill="#e3e7f0" stroke="#2b2f45" stroke-width="6"/>

                            <path class="peca-svg" data-mouse="dir" d="M122 22 A78 78 0 0 1 197 98 L197 90 L122 90 Z" fill="#fbcfe8" stroke="#2b2f45" stroke-width="5"/>
                            <rect class="peca-svg" data-mouse="roda" x="108" y="52" width="24" height="46" rx="12" fill="#ffd43b" stroke="#2b2f45" stroke-width="5"/>

                    </div>
                    <div class="placar" id="placarMouse">0 de 3 partes descobertas</div>

            // 5 teclado
            { html: topo('⌨️','O Teclado','Para escrever','O teclado serve para escrever letras e números. As teclas ficam em fileiras.') + `

            // 6 CPU x HD
            { html: topo('🧠','CPU e HD','Qual é a diferença?','A CPU é o cérebro que pensa. O HD é o armário que guarda. Os dois ficam dentro do gabinete.') + `

            // 7 quiz CPU/HD
            { html: topo('🧠','CPU ou HD?','Escolha a resposta','Quem guarda as suas fotos e jogos: a CPU ou o HD?') + `

            // 8 onde ligar

            { html: topo('🧩','Peça ou Programa?','Hardware e Software','Hardware é a peça que você pega com a mão. Software é o programa que você só vê na tela.') + `

            // 11 classificar
            { html: topo('📦','Guarde na Caixa Certa','Peça ou programa?','Clique numa ficha e depois na caixa certa: peça ou programa.') + `

                    <div class="banco-fichas" id="bancoFichas"></div>

                        <div class="caixa azul" data-caixa="hardware"><h3>✋ PEÇA</h3><div class="conteudo"></div></div>

            // 12 quiz final
            { html: topo('🧠','Rodada Final','Verdadeiro ou Falso','Vamos testar tudo o que você aprendeu sobre o computador.') + `
                <div class="corpo" id="vfFinal"></div>`, jogo: 'vfFinal' },

            // 13 final
            { html: `<div class="capa">
                <div class="trofeu">
                    <div class="emoji">🏆🖥️</div>
                    <h2>Parabéns!</h2>
                    <p>Agora você conhece as <b>peças</b> do computador e sabe a diferença entre <b>peça</b> e <b>programa</b>!</p>
                    <p>Mostre para um adulto tudo o que você descobriu! 🎉</p>
                </div>
                <button class="btn-ouvir" style="background:var(--uva); border-color:var(--uva);" data-falar="Parabéns! Agora você conhece as peças do computador e sabe a diferença entre peça e programa.">🔊 Ouvir</button>
            </div>` },
        ];

        /* ============ voz ============ */
        function falar(texto, botao) {
            if (!('speechSynthesis' in window)) return;
            speechSynthesis.cancel();
            const f = new SpeechSynthesisUtterance(texto);
            f.lang = 'pt-BR'; f.rate = .92;
            if (botao) {
                botao.classList.add('falando');
                f.onend = () => botao.classList.remove('falando');
                f.onerror = () => botao.classList.remove('falando');
            }
            speechSynthesis.speak(f);
        }
        document.addEventListener('click', e => {
            const b = e.target.closest('[data-falar]');
            if (b) falar(b.dataset.falar, b);
        });

        /* ============ dados ============ */
        const INFO_PECAS = {
            monitor:  '🖥️ <b>MONITOR</b> — é a tela! Mostra tudo o que o computador faz.',
            gabinete: '🗄️ <b>GABINETE</b> — a caixa. Dentro dele moram a CPU e o HD.',
            teclado:  '⌨️ <b>TECLADO</b> — serve para escrever letras e números.',
            mouse:    '🖱️ <b>MOUSE</b> — move a setinha e clica nas coisas.',
        };
        const INFO_MOUSE = {
            esq:  '👈 <b>BOTÃO ESQUERDO</b> — o mais usado! Serve para clicar e abrir.',
            dir:  '👉 <b>BOTÃO DIREITO</b> — abre o menu com mais opções.',
            roda: '🎡 <b>RODINHA</b> — role para subir e descer a página.',
        };
        const PERGUNTAS_PORTA = [
            { txt: '🔌 Onde eu ligo o <b>cabo de energia</b>?', certa: 'energia', ok: '⚡ Isso! Sem energia o computador nem liga.' },
            { txt: '🖥️ Onde eu ligo o <b>monitor</b>?',        certa: 'video',   ok: '🖥️ Isso! A porta de vídeo leva a imagem para a tela.' },
            { txt: '🖱️ Onde eu ligo o <b>mouse</b>?',          certa: 'usb',     ok: '🔌 Isso! Mouse e teclado usam a porta USB.' },
        ];
        const ITENS_PINTAR = [
            { ic:'🖥️', nm:'Monitor',   tipo:'hardware' },
            { ic:'🖱️', nm:'Mouse',     tipo:'hardware' },
            { ic:'⌨️', nm:'Teclado',   tipo:'hardware' },
            { ic:'🎮', nm:'Jogo',      tipo:'software' },
            { ic:'🎨', nm:'Paint',     tipo:'software' },
            { ic:'🖨️', nm:'Impressora',tipo:'hardware' },
            { ic:'🌐', nm:'Navegador', tipo:'software' },
            { ic:'💾', nm:'HD',        tipo:'hardware' },
        ];
        const FICHAS = [
            { ic:'🔊', nm:'Caixa de som', tipo:'hardware' },
            { ic:'📝', nm:'Word',         tipo:'software' },
            { ic:'📷', nm:'Webcam',       tipo:'hardware' },
            { ic:'🧮', nm:'Calculadora',  tipo:'software' },
            { ic:'🧠', nm:'CPU',          tipo:'hardware' },
            { ic:'🎵', nm:'Spotify',      tipo:'software' },
        ];
        const VFS = [
            { t:'🖥️ O monitor guarda as fotos do computador.',        v:false, x:'Falso! Quem guarda é o HD. O monitor só mostra.' },
            { t:'🧠 A CPU é o cérebro que pensa e faz as contas.',      v:true,  x:'Isso mesmo! Por isso ela é o cérebro.' },
            { t:'✋ Se eu pego com a mão, é uma PEÇA (hardware).',      v:true,  x:'Exatamente! Peça é o que dá pra pegar.' },
            { t:'🎮 Um jogo é uma peça do computador.',                v:false, x:'Falso! Jogo é programa — você só vê na tela.' },
        ];

        const misturar = l => { const c=l.slice(); for(let i=c.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[c[i],c[j]]=[c[j],c[i]];} return c; };

        /* ============ jogos ============ */
        function jogoExplorador() {
            const balao = document.getElementById('balaoExp'), placar = document.getElementById('placarExp');
            const achadas = new Set();
            document.querySelectorAll('[id^="exp-"]').forEach(g => {
                g.addEventListener('click', () => {
                    const peca = g.dataset.peca;
                    balao.className = 'balao';
                    balao.innerHTML = '<span>' + INFO_PECAS[peca] + '</span>';
                    falar(balao.textContent);
                    if (!achadas.has(peca)) {
                        achadas.add(peca);
                        g.classList.add('acertou');
                        placar.textContent = `${achadas.size} de 4 peças descobertas`;
                        if (achadas.size === 4) placar.textContent = '🎉 Você descobriu todas as 4 peças!';
                    }
                });
            });
        }

        function jogoMouse() {
            const balao = document.getElementById('balaoMouse'), placar = document.getElementById('placarMouse');
            const achadas = new Set();
            document.querySelectorAll('[data-mouse]').forEach(p => {
                p.addEventListener('click', () => {
                    const parte = p.dataset.mouse;
                    balao.className = 'balao';
                    balao.innerHTML = '<span>' + INFO_MOUSE[parte] + '</span>';
                    falar(balao.textContent);
                    if (!achadas.has(parte)) {
                        achadas.add(parte);
                        p.classList.add('acertou');
                        placar.textContent = `${achadas.size} de 3 partes descobertas`;
                        if (achadas.size === 3) placar.textContent = '🎉 Você descobriu as 3 partes!';
                    }
                });
            });
        }

        function jogoQuizCpu() {
            const area = document.getElementById('quizCpu'), msg = document.getElementById('quizCpuMsg');
            area.querySelectorAll('.opcao').forEach(b => b.addEventListener('click', () => {
                const certo = b.dataset.q === 'hd';
                area.querySelectorAll('.opcao').forEach(x => x.classList.remove('certo','errado'));
                b.classList.add(certo ? 'certo' : 'errado');
                msg.className = 'aviso on ' + (certo ? 'ok' : 'nao');
                msg.textContent = certo ? '✅ Isso! O HD é o armário que guarda tudo.' : '❌ Quase! Quem guarda é o HD. A CPU só pensa.';
            }));
        }

        function jogoPortas() {
            const balao = document.getElementById('balaoPorta'), placar = document.getElementById('placarPorta');
            let i = 0, acertos = 0;
            const mostrar = () => { balao.innerHTML = '<span>' + PERGUNTAS_PORTA[i].txt + '</span>'; };
            mostrar();
            document.querySelectorAll('[data-porta]').forEach(p => {
                p.addEventListener('click', () => {
                    if (i >= PERGUNTAS_PORTA.length) return;
                    const q = PERGUNTAS_PORTA[i];
                    if (p.dataset.porta === q.certa) {
                        p.classList.add('acertou');
                        acertos++;
                        i++;
                        placar.textContent = `${acertos} de ${PERGUNTAS_PORTA.length} acertos`;
                        if (i < PERGUNTAS_PORTA.length) {
                            balao.innerHTML = '<span>✅ ' + q.ok + '</span>';
                            falar(balao.textContent);
                            setTimeout(mostrar, 1600);
                        } else {
                            balao.innerHTML = '<span>🎉 Você acertou todas! Já sabe onde ligar tudo.</span>';
                            falar('Você acertou todas! Já sabe onde ligar tudo.');
                        }
                    } else {
                        p.classList.add('errou');
                        setTimeout(() => p.classList.remove('errou'), 600);
                    }
                });
            });
        }

        let tintaAtual = 'hardware';
        function jogoPintar() {
            const quadro = document.getElementById('quadroPintar'), msg = document.getElementById('pintarMsg');
            const CORES = { hardware: '#dbe7ff', software: '#d3f9e8' };
            tintaAtual = 'hardware';
            quadro.innerHTML = '';
            misturar(ITENS_PINTAR).forEach(it => {
                const d = document.createElement('div');
                d.className = 'alvo';
                d.dataset.tipo = it.tipo;
                d.innerHTML = `<span class="ic">${it.ic}</span><span class="nm">${it.nm}</span>`;
                d.addEventListener('click', () => {
                    d.dataset.pintado = tintaAtual;
                    d.style.background = CORES[tintaAtual];
                    d.classList.add('marcado');
                    d.classList.remove('ok','nao');
                    msg.className = 'aviso';
                });
                quadro.appendChild(d);
            });
            document.querySelectorAll('[data-tinta]').forEach(b => b.addEventListener('click', () => {
                document.querySelectorAll('[data-tinta]').forEach(x => x.classList.remove('ativa'));
                b.classList.add('ativa');
                tintaAtual = b.dataset.tinta;
            }));
            document.getElementById('btnPintarConferir').onclick = () => {
                let ok = 0, faltou = 0;
                quadro.querySelectorAll('.alvo').forEach(d => {
                    if (!d.dataset.pintado) { faltou++; return; }
                    const certo = d.dataset.pintado === d.dataset.tipo;
                    d.classList.add(certo ? 'ok' : 'nao');
                    if (certo) ok++;
                });
                const total = ITENS_PINTAR.length;
                if (faltou > 0) {
                    msg.className = 'aviso on nao';
                    msg.textContent = `🎨 Faltam ${faltou} desenho(s) para pintar!`;
                } else if (ok === total) {
                    msg.className = 'aviso on ok';
                    msg.textContent = '🎉 Perfeito! Você pintou todos certinho!';
                } else {
                    msg.className = 'aviso on nao';
                    msg.textContent = `⚠️ Você acertou ${ok} de ${total}. Os de borda vermelha estão na cor errada.`;
                }
            };
        }

        function jogoClassificar() {
            const banco = document.getElementById('bancoFichas'), placar = document.getElementById('placarClass'), msg = document.getElementById('classMsg');
            banco.innerHTML = '';
            document.querySelectorAll('.caixa .conteudo').forEach(c => c.innerHTML = '');
            let sel = null, postas = 0;
            misturar(FICHAS).forEach(f => {
                const b = document.createElement('button');
                b.className = 'ficha';
                b.innerHTML = `${f.ic} ${f.nm}`;
                b.dataset.tipo = f.tipo;
                b.addEventListener('click', () => {
                    if (b.classList.contains('posta')) return;
                    banco.querySelectorAll('.ficha').forEach(x => x.classList.remove('sel'));
                    b.classList.add('sel');
                    sel = b;
                });
                banco.appendChild(b);
            });
            document.querySelectorAll('.caixa').forEach(caixa => {
                caixa.addEventListener('click', () => {
                    if (!sel) return;
                    const certo = sel.dataset.tipo === caixa.dataset.caixa;
                    if (certo) {
                        sel.classList.remove('sel');
                        sel.classList.add('posta');
                        caixa.querySelector('.conteudo').appendChild(sel);
                        sel = null;
                        postas++;
                        placar.textContent = `${postas} de ${FICHAS.length} guardados`;
                        msg.className = 'aviso on ok';
                        msg.textContent = '✅ Isso mesmo!';
                        if (postas === FICHAS.length) msg.textContent = '🎉 Você guardou tudo no lugar certo!';
                    } else {
                        msg.className = 'aviso on nao';
                        msg.textContent = '❌ Essa não é a caixa certa. Tente a outra!';
                    }
                });
            });
        }

        function jogoVFFinal() {
            const area = document.getElementById('vfFinal');
            area.innerHTML = '';
            VFS.forEach((q,i) => {
                const bloco = document.createElement('div');
                bloco.className = 'cartao';
                bloco.innerHTML = `<div class="pergunta">${i+1}) ${q.t}</div>
                    <div class="opcoes duas" style="margin-top:8px;">
                        <button class="opcao" data-r="falso">❌ Falso</button>
                        <button class="opcao" data-r="verdadeiro">✅ Verdadeiro</button>
                    </div>
                    <div class="aviso" style="margin-top:8px;"></div>`;
                const msg = bloco.querySelector('.aviso');
                bloco.querySelectorAll('.opcao').forEach(b => b.addEventListener('click', () => {
                    const certo = (b.dataset.r === 'verdadeiro') === q.v;
                    bloco.querySelectorAll('.opcao').forEach(x => x.classList.remove('certo','errado'));
                    b.classList.add(certo ? 'certo' : 'errado');
                    msg.className = 'aviso on ' + (certo ? 'ok' : 'nao');
                    msg.textContent = (certo ? '✅ ' : '❌ ') + q.x;
                }));
                area.appendChild(bloco);
            });
        }

        const JOGOS = {
            explorador: jogoExplorador, mouse: jogoMouse, quizCpu: jogoQuizCpu,
            portas: jogoPortas, pintar: jogoPintar, classificar: jogoClassificar, vfFinal: jogoVFFinal,
        };

        function montar() {
            const palco = document.getElementById('palco');
            telas.forEach((t,i) => {
                const d = document.createElement('div');
                d.className = 'slide' + (i === 0 ? ' ativo' : '');
                d.innerHTML = t.html;
                palco.appendChild(d);
            });
            document.getElementById('total').textContent = telas.length;
            telas.forEach(t => { if (t.jogo && JOGOS[t.jogo]) JOGOS[t.jogo](); });
            atualizar();
        }

        function mostrar(n) {
            document.querySelectorAll('.slide')[atual].classList.remove('ativo');
            atual = n;
            document.querySelectorAll('.slide')[atual].classList.add('ativo');
            atualizar();
        }
        function avancar() { if (atual < telas.length - 1) mostrar(atual + 1); }
        function voltar()  { if (atual > 0) mostrar(atual - 1); }

        function atualizar() {
            document.getElementById('atual').textContent = atual + 1;
            document.getElementById('btnVoltar').disabled = atual === 0;
            document.getElementById('btnProximo').disabled = atual === telas.length - 1;
            document.getElementById('progresso').style.width = ((atual + 1) / telas.length * 100) + '%';
            if ('speechSynthesis' in window) speechSynthesis.cancel();
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight') avancar();
            if (e.key === 'ArrowLeft') voltar();
        });

        montar();
    </script>
