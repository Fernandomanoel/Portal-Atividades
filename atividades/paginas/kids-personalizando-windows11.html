<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missão Windows Personalizado - Deixe o Computador do Seu Jeito</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --tinta: #14213d;
            --papel: #fffdf7;
            --menta: #12b886;
            --menta-claro: #e6fcf5;
            --laranja: #ff8c42;
            --laranja-claro: #fff4ec;
            --uva: #7048e8;
            --uva-claro: #f3f0ff;
            --sol: #ffd43b;
            --coral: #ff6b6b;
            --coral-claro: #fff0f0;
            --borda: #dfe3ec;
        }

        html, body { height: 100%; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at 12% 18%, rgba(255,212,59,.18) 0, transparent 42%),
                radial-gradient(circle at 88% 82%, rgba(18,184,134,.20) 0, transparent 45%),
                linear-gradient(160deg, #1b1f3b 0%, #2d1b53 100%);
            color: var(--tinta);
            overflow: hidden;
        }

        .app { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; padding: clamp(8px, 1.6vh, 20px); gap: clamp(8px, 1.4vh, 16px); }

        .palco { flex: 1; position: relative; min-height: 0; overflow: hidden; display: flex; }

        .slide {
            position: absolute;
            inset: 0;
            background: var(--papel);
            border-radius: 22px;
            box-shadow: 0 18px 60px rgba(0,0,0,.38);
            padding: clamp(14px, 2.4vh, 26px);
            display: flex;
            flex-direction: column;
            gap: clamp(8px, 1.4vh, 16px);
            opacity: 0;
            transform: scale(.97);
            transition: opacity .35s ease, transform .35s ease;
            pointer-events: none;
            overflow: hidden;
        }
        .slide.ativo { opacity: 1; transform: scale(1); pointer-events: auto; z-index: 5; }

        /* ---------- Cabeçalho ---------- */
        .topo {
            display: flex; align-items: center; gap: clamp(10px, 1.4vw, 18px);
            background: linear-gradient(100deg, var(--uva) 0%, #9775fa 100%);
            color: #fff; border-radius: 18px;
            padding: clamp(10px, 1.6vh, 18px) clamp(14px, 1.6vw, 22px);
            flex-shrink: 0;
        }
        .topo-emoji { font-size: clamp(1.8rem, 3.4vh, 2.6rem); line-height: 1; }
        .topo-textos { flex: 1; min-width: 0; }
        .topo h1 { font-size: clamp(1.05rem, 2.5vh, 1.75rem); font-weight: 800; line-height: 1.15; }
        .topo p { font-size: clamp(.75rem, 1.5vh, 1rem); opacity: .92; }

        .btn-ouvir {
            background: rgba(255,255,255,.22); color: #fff; border: 2px solid rgba(255,255,255,.5);
            border-radius: 999px; padding: clamp(7px,1.2vh,11px) clamp(12px,1.4vw,20px);
            font-size: clamp(.78rem, 1.5vh, .98rem); font-weight: 800; cursor: pointer;
            font-family: inherit; white-space: nowrap; flex-shrink: 0;
        }
        .btn-ouvir:hover { background: rgba(255,255,255,.34); }
        .btn-ouvir.falando { background: var(--menta); border-color: var(--menta); }

        /* ---------- Corpo ---------- */
        .corpo {
            flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
            display: flex; flex-direction: column; gap: clamp(8px, 1.3vh, 14px);
            justify-content: safe center;
            padding-right: 4px;
        }
        .corpo::-webkit-scrollbar { width: 8px; }
        .corpo::-webkit-scrollbar-thumb { background: var(--uva); border-radius: 10px; }

        .cartao {
            background: #fff; border: 3px solid var(--borda); border-radius: 16px;
            padding: clamp(10px, 1.6vh, 18px) clamp(12px, 1.4vw, 20px);
            font-weight: 700; font-size: clamp(.85rem, 1.75vh, 1.1rem); line-height: 1.35;
        }
        .cartao.menta  { background: var(--menta-claro);  border-color: var(--menta); }
        .cartao.laranja{ background: var(--laranja-claro);border-color: var(--laranja); }
        .cartao.uva    { background: var(--uva-claro);    border-color: var(--uva); }
        .cartao.coral  { background: var(--coral-claro);  border-color: var(--coral); }
        .cartao.centro { text-align: center; }
        .cartao b, .cartao strong { color: var(--uva); }

        .faixa-pc {
            display: inline-flex; align-items: center; gap: 8px; align-self: flex-start;
            background: var(--tinta); color: #fff; font-weight: 800;
            font-size: clamp(.72rem, 1.4vh, .92rem); letter-spacing: .04em;
            padding: clamp(5px,.9vh,8px) clamp(12px,1.2vw,18px); border-radius: 999px; flex-shrink: 0;
        }

        /* ---------- Trilha de cliques ---------- */
        .trilha { display: flex; align-items: stretch; gap: clamp(6px,.8vw,10px); flex-wrap: nowrap; }
        .trilha-passo {
            flex: 1; min-width: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
            background: #fff; border: 3px solid var(--uva); border-radius: 16px;
            padding: clamp(8px,1.4vh,14px) clamp(6px,.8vw,12px);
            font-weight: 800; color: var(--uva); text-align: center;
            font-size: clamp(.72rem, 1.5vh, .98rem); line-height: 1.2;
        }
        .trilha-passo .ic { font-size: clamp(1.4rem, 3vh, 2.1rem); line-height: 1; }
        .trilha-seta { display: flex; align-items: center; font-size: clamp(1.1rem,2.4vh,1.7rem); color: var(--laranja); font-weight: 900; flex-shrink: 0; }

        /* ---------- Checklist ---------- */
        .lista { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: clamp(7px,1.1vh,11px); }
        .item {
            display: flex; align-items: center; gap: clamp(8px,1vw,14px);
            background: #fff; border: 3px solid var(--borda); border-radius: 14px;
            padding: clamp(8px,1.3vh,14px) clamp(10px,1.1vw,16px);
            cursor: pointer; user-select: none; transition: all .18s;
        }
        .item:hover { border-color: var(--menta); }
        .item .ic { font-size: clamp(1.3rem, 2.6vh, 1.9rem); flex-shrink: 0; line-height: 1; }
        .item .txt { flex: 1; font-weight: 700; font-size: clamp(.8rem, 1.6vh, 1rem); line-height: 1.25; }
        .item .selo { font-size: clamp(1.1rem, 2.2vh, 1.5rem); flex-shrink: 0; }
        .item.feito { background: var(--menta-claro); border-color: var(--menta); }

        .placar { text-align: center; font-weight: 800; color: var(--uva); font-size: clamp(.85rem,1.7vh,1.1rem); flex-shrink: 0; }

        /* ---------- Jogos ---------- */
        .pergunta { font-weight: 800; color: var(--tinta); font-size: clamp(.9rem,1.9vh,1.15rem); line-height: 1.3; }

        .opcoes { display: grid; gap: clamp(7px,1.1vh,10px); }
        .opcoes.duas { grid-template-columns: 1fr 1fr; }
        .opcao {
            background: #fff; border: 3px solid var(--borda); border-radius: 14px;
            padding: clamp(9px,1.4vh,15px) clamp(10px,1.2vw,18px);
            font-weight: 800; font-size: clamp(.82rem,1.65vh,1.05rem); cursor: pointer;
            font-family: inherit; text-align: left; color: var(--tinta); transition: all .18s;
        }
        .opcao:hover { border-color: var(--uva); }
        .opcao.certo { background: var(--menta-claro); border-color: var(--menta); }
        .opcao.errado { background: var(--coral-claro); border-color: var(--coral); }

        .aviso {
            padding: clamp(9px,1.3vh,14px) clamp(11px,1.2vw,18px); border-radius: 14px;
            font-weight: 800; font-size: clamp(.8rem,1.6vh,1rem); display: none; flex-shrink: 0;
        }
        .aviso.on { display: block; }
        .aviso.ok  { background: var(--menta-claro); color: #0b7c5b; }
        .aviso.nao { background: var(--coral-claro); color: #b02525; }

        .banco, .fila { display: flex; flex-direction: column; gap: clamp(6px,1vh,9px); padding: clamp(8px,1.2vh,12px); border-radius: 16px; min-height: 50px; }
        .banco { background: #f3f4f8; border: 3px dashed #c8cede; }
        .fila  { background: var(--uva-claro); border: 3px solid var(--uva); }

        .peca {
            background: #fff; border: 3px solid var(--uva); color: var(--uva);
            border-radius: 12px; padding: clamp(8px,1.2vh,13px) clamp(10px,1.1vw,16px);
            font-weight: 800; cursor: pointer; text-align: center;
            font-size: clamp(.8rem,1.55vh,1rem); transition: all .18s;
        }
        .peca:hover { background: var(--uva); color: #fff; }

        .posto { display: flex; align-items: center; gap: 10px; background: #fff; border: 3px solid transparent; border-radius: 12px; padding: clamp(7px,1.1vh,11px) clamp(10px,1.1vw,15px); font-weight: 700; font-size: clamp(.8rem,1.55vh,1rem); }
        .posto .n { width: clamp(24px,4vh,32px); height: clamp(24px,4vh,32px); border-radius: 50%; background: var(--uva); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; flex-shrink: 0; font-size: clamp(.75rem,1.5vh,.95rem); }
        .posto.certo { background: var(--menta-claro); border-color: var(--menta); }
        .posto.errado { background: var(--coral-claro); border-color: var(--coral); }

        .btn-acao { align-self: flex-start; background: var(--laranja); color: #fff; border: none; border-radius: 14px; padding: clamp(9px,1.4vh,14px) clamp(16px,1.6vw,26px); font-weight: 800; font-size: clamp(.85rem,1.6vh,1.05rem); cursor: pointer; font-family: inherit; flex-shrink: 0; }
        .btn-acao:hover { background: #f97316; }

        .duplas { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(8px,1vw,16px); }
        .coluna { display: flex; flex-direction: column; gap: clamp(6px,1vh,9px); }
        .liga {
            background: #fff; border: 3px solid var(--borda); border-radius: 13px;
            padding: clamp(8px,1.25vh,13px) clamp(9px,1vw,14px);
            font-weight: 700; font-size: clamp(.75rem,1.5vh,.98rem); cursor: pointer;
            font-family: inherit; text-align: left; color: var(--tinta); transition: all .18s; line-height: 1.2;
        }
        .liga:hover { border-color: var(--laranja); }
        .liga.sel { border-color: var(--uva); background: var(--uva-claro); }
        .liga.certo { border-color: var(--menta); background: var(--menta-claro); cursor: default; }
        .liga.errado { border-color: var(--coral); background: var(--coral-claro); }

        /* ---------- Capa e final ---------- */
        .capa { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: clamp(8px,1.6vh,18px); min-height: 0; }
        .capa h1 { font-size: clamp(1.4rem, 4.2vh, 2.7rem); color: var(--uva); line-height: 1.1; }
        .capa .sub { font-size: clamp(.85rem, 1.9vh, 1.2rem); color: #566; font-weight: 600; }
        .capa .emoji { font-size: clamp(2.2rem, 6vh, 3.6rem); line-height: 1; }
        .grade-icones { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: clamp(6px,1.1vh,12px); width: 100%; max-width: 640px; }
        .mini { display: flex; flex-direction: column; align-items: center; gap: 3px; background: #fff; border: 3px solid var(--borda); border-radius: 14px; padding: clamp(6px,1.1vh,11px) 4px; }
        .mini .ic { font-size: clamp(1.2rem,2.6vh,1.8rem); line-height: 1; }
        .mini span { font-size: clamp(.6rem,1.25vh,.8rem); font-weight: 800; color: var(--tinta); }

        .troféu { text-align: center; }
        .troféu .emoji { font-size: clamp(2.4rem,6.5vh,4rem); }
        .troféu h2 { color: var(--uva); font-size: clamp(1.3rem,3.6vh,2.2rem); margin: 8px 0; }
        .troféu p { font-size: clamp(.9rem,1.85vh,1.15rem); color: #455; font-weight: 600; line-height: 1.45; margin-bottom: 8px; }
        .troféu b { color: var(--menta); }

        .grupo-titulo { font-weight: 900; color: var(--laranja); font-size: clamp(.82rem,1.6vh,1.02rem); display: flex; align-items: center; gap: 6px; }

        /* ---------- Barra de baixo ---------- */
        .rodape { display: flex; align-items: center; gap: clamp(8px,1.4vw,20px); flex-shrink: 0; }
        .nav {
            background: var(--sol); color: var(--tinta); border: none;
            padding: clamp(9px,1.5vh,14px) clamp(14px,1.8vw,28px); border-radius: 12px;
            cursor: pointer; font-size: clamp(.8rem,1.6vh,1.02rem); font-weight: 800; font-family: inherit; white-space: nowrap;
        }
        .nav:hover { background: #ffe066; }
        .nav:disabled { opacity: .4; cursor: not-allowed; }
        .barra { flex: 1; height: 10px; background: rgba(255,255,255,.25); border-radius: 999px; overflow: hidden; min-width: 40px; }
        .barra span { display: block; height: 100%; background: linear-gradient(90deg, var(--menta), var(--sol)); transition: width .3s; }
        .contagem { color: #fff; font-weight: 800; font-size: clamp(.75rem,1.5vh,.95rem); white-space: nowrap; }

        @media (max-width: 820px) {
            .topo { flex-wrap: wrap; padding: 10px 14px; gap: 10px; }
            .topo-emoji { font-size: 1.7rem; }
            .btn-ouvir { width: 100%; margin-top: 2px; }
            .trilha { flex-direction: column; gap: 4px; }
            .trilha-passo { flex-direction: row; justify-content: flex-start; gap: 10px; padding: 9px 12px; text-align: left; }
            .trilha-passo .ic { font-size: 1.4rem; }
            .trilha-seta { justify-content: center; transform: rotate(90deg); font-size: 1rem; }
            .duplas { grid-template-columns: 1fr; }
            .opcoes.duas { grid-template-columns: 1fr; }
            .grade-icones { grid-template-columns: repeat(4, minmax(0,1fr)); }
            .cartao { padding: 10px 12px; }
            .item { padding: 8px 10px; }
            .rodape { flex-wrap: wrap; }
            .nav { flex: 1; }
            .barra { order: 3; width: 100%; flex-basis: 100%; }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="palco" id="palco"></div>
        <div class="rodape">
            <button class="nav" id="btnVoltar" onclick="voltar()">← Voltar</button>
            <div class="barra"><span id="progresso"></span></div>
            <span class="contagem"><span id="atual">1</span> / <span id="total">1</span></span>
            <button class="nav" id="btnProximo" onclick="avancar()">Próximo →</button>
        </div>
    </div>

    <script>
        let atual = 0;

        function topo(emoji, titulo, sub, fala) {
            return `<div class="topo">
                <div class="topo-emoji">${emoji}</div>
                <div class="topo-textos"><h1>${titulo}</h1><p>${sub}</p></div>
                <button class="btn-ouvir" data-falar="${fala.replace(/"/g,'&quot;')}">🔊 Ouvir</button>
            </div>`;
        }

        function trilha(passos) {
            return `<div class="trilha">${passos.map((p,i) =>
                (i ? '<div class="trilha-seta">➜</div>' : '') +
                `<div class="trilha-passo"><span class="ic">${p.ic}</span>${p.txt}</div>`
            ).join('')}</div>`;
        }

        function item(ic, txt) {
            return `<div class="item"><span class="ic">${ic}</span><span class="txt">${txt}</span><span class="selo">⬜</span></div>`;
        }

        const telas = [
            // 1 capa
            { html: `<div class="capa">
                <div class="emoji">🎨🖥️</div>
                <h1>Windows do Seu Jeito!</h1>
                <p class="sub">Uma aventura só de personalização</p>
                <div class="grade-icones">
                    <div class="mini"><span class="ic">🖼️</span><span>Fundo</span></div>
                    <div class="mini"><span class="ic">🌗</span><span>Cores</span></div>
                    <div class="mini"><span class="ic">🎯</span><span>Destaque</span></div>
                    <div class="mini"><span class="ic">🔒</span><span>Bloqueio</span></div>
                    <div class="mini"><span class="ic">📦</span><span>Temas</span></div>
                    <div class="mini"><span class="ic">🔊</span><span>Sons</span></div>
                    <div class="mini"><span class="ic">🖱️</span><span>Cursor</span></div>
                    <div class="mini"><span class="ic">📊</span><span>Barra</span></div>
                    <div class="mini"><span class="ic">🏁</span><span>Iniciar</span></div>
                    <div class="mini"><span class="ic">🔤</span><span>Texto</span></div>
                </div>
                <button class="btn-ouvir" style="background:var(--uva); border-color:var(--uva);" data-falar="Bem-vindo! Hoje você vai deixar o Windows do seu jeito.">🔊 Ouvir</button>
            </div>` },

            // 2 como funciona
            { html: topo('🎯','O Que Vamos Fazer?','Aprender aqui, fazer no computador','Vamos aprender aqui na tela e depois fazer a mesma coisa no computador de verdade.') + `
                <div class="corpo">
                    <div class="cartao uva centro">👉 Aqui você <b>aprende e clica</b></div>
                    <div class="cartao menta centro">💻 No computador você <b>faz de verdade</b></div>
                    <div class="cartao coral centro">👨‍👩‍👧 Chame um adulto para ficar perto</div>
                </div>` },

            // 3 o que é personalizar
            { html: topo('🤔','O Que é Personalizar?','Deixar com a sua cara','Personalizar é deixar o computador com a sua cara, do jeito que você gosta.') + `
                <div class="corpo">
                    <div class="cartao uva centro">🎨 Deixar do <b>SEU jeito</b></div>
                    <div class="cartao laranja centro">🛏️ Igual decorar o seu quarto</div>
                    <div class="cartao menta centro">✅ Nada quebra — dá pra trocar de volta</div>
                </div>` },

            // 4 mapa
            { html: topo('🗺️','Onde Fica Tudo?','O caminho mágico','Clique em Iniciar, depois na engrenagem de Configurações, e depois em Personalização.') + `
                <div class="corpo">
                    <div class="faixa-pc">💻 NO COMPUTADOR</div>
                    ${trilha([{ic:'🪟',txt:'Iniciar'},{ic:'⚙️',txt:'Configurações'},{ic:'🎨',txt:'Personalização'}])}
                    <div class="cartao laranja centro">⚡ Atalho: botão direito na área de trabalho → <b>Personalizar</b></div>
                </div>` },

            // 5 papel de fundo
            { html: topo('🖼️','Papel de Fundo','A imagem atrás dos ícones','O papel de fundo é a imagem atrás dos ícones. Escolha uma foto que você gosta.') + `
                <div class="corpo">
                    <div class="cartao uva centro">🖼️ A imagem atrás dos ícones!</div>
                    <div class="faixa-pc">💻 NO COMPUTADOR</div>
                    ${trilha([{ic:'🎨',txt:'Personalização'},{ic:'🖼️',txt:'Plano de fundo'},{ic:'📷',txt:'Escolher imagem'}])}
                    <div class="lista" data-lista="fundo">
                        ${item('⚙️','Abri Personalização')}
                        ${item('📷','Escolhi uma imagem')}
                        ${item('👀','Vi a tela mudar')}
                    </div>
                    <div class="placar">0 de 3 feitos</div>
                </div>` },

            // 6 slideshow
            { html: topo('🎞️','Fotos que Trocam Sozinhas','Apresentação de slides','Você pode colocar várias fotos para trocarem sozinhas de tempo em tempo.') + `
                <div class="corpo">
                    <div class="cartao uva centro">🎞️ Várias fotos trocando sozinhas!</div>
                    <div class="faixa-pc">💻 NO COMPUTADOR</div>
                    ${trilha([{ic:'📁',txt:'Pasta com 3 fotos'},{ic:'🎞️',txt:'Apresentação'},{ic:'⏱️',txt:'1 minuto'}])}
                    <div class="lista" data-lista="slideshow">
                        ${item('📁','Fiz a pasta com fotos')}
                        ${item('🎞️','Liguei a apresentação')}
                        ${item('✨','A foto trocou sozinha')}
                    </div>
                    <div class="placar">0 de 3 feitos</div>
                </div>` },

            // 7 claro e escuro
            { html: topo('🌗','Claro e Escuro','Dois jeitos de ver a tela','O modo claro deixa as janelas brancas. O modo escuro deixa pretas e cansa menos os olhos.') + `
                <div class="corpo">
                    <div class="opcoes duas">
                        <div class="cartao laranja" style="text-align:center;"><div style="font-size:1.8em;">☀️</div><b>Claro</b><br>Janelas brancas</div>
                        <div class="cartao" style="text-align:center; background:#2b2b3d; color:#fff; border-color:#4a4a63;"><div style="font-size:1.8em;">🌙</div><b style="color:#fff;">Escuro</b><br>Janelas pretas</div>
                    </div>
                    <div class="faixa-pc">💻 NO COMPUTADOR</div>
                    ${trilha([{ic:'🎨',txt:'Personalização'},{ic:'🌗',txt:'Cores'},{ic:'✅',txt:'Escolher modo'}])}
                    <div class="lista" data-lista="modo">
                        ${item('☀️','Testei o Claro')}
                        ${item('🌙','Testei o Escuro')}
                    </div>
                    <div class="placar">0 de 2 feitos</div>
                </div>` },

            // 8 VF rápido
            { html: topo('🧠','Verdadeiro ou Falso?','Vamos testar','O modo escuro apaga os arquivos do computador. Isso é verdadeiro ou falso?') + `
                <div class="corpo" id="vf1">
                    <div class="cartao centro">🌙 "O Modo Escuro <b>apaga os arquivos</b>."</div>
                    <div class="opcoes duas">
                        <button class="opcao" style="text-align:center;" data-vf="falso">❌ Falso</button>
                        <button class="opcao" style="text-align:center;" data-vf="verdadeiro">✅ Verdadeiro</button>
                    </div>
                    <div class="aviso" id="vf1msg"></div>
                </div>`, jogo: 'vf1' },

            // 9 cor de destaque
            { html: topo('🎯','Cor de Destaque','A cor dos botões','A cor de destaque aparece nos botões e nas bordas. O Windows pode escolher sozinho.') + `
                <div class="corpo" id="esc1">

            // 20 checklist final

            // 21 final
            { html: `<div class="capa">
                <div class="troféu">
                    <div class="emoji">🏆🎨</div>
                    <h2>Parabéns!</h2>
                    <p>Você personalizou <b>10 partes</b> do Windows 11!</p>
                    <p>Agora o computador tem a <b>sua cara</b>. Mostre para um adulto! 🎉</p>
                </div>
                <button class="btn-ouvir" style="background:var(--uva); border-color:var(--uva);" data-falar="Parabéns! Você personalizou dez partes do Windows onze. Mostre para um adulto.">🔊 Ouvir</button>
            </div>` },
        ];

        // ---------- voz ----------
        function falar(texto, botao) {
            if (!('speechSynthesis' in window)) return;
            speechSynthesis.cancel();
            const f = new SpeechSynthesisUtterance(texto);
            f.lang = 'pt-BR'; f.rate = .92;
            if (botao) {
                botao.classList.add('falando');
                f.onend = () => botao.classList.remove('falando');
                f.onerror = () => botao.classList.remove('falando');
            }
            speechSynthesis.speak(f);
        }
        document.addEventListener('click', e => {
            const b = e.target.closest('[data-falar]');
            if (b) falar(b.dataset.falar, b);
        });

        // ---------- dados dos jogos ----------
        const ORDEM = ['Botão direito na área de trabalho','Clicar em "Personalizar"','Clicar em "Plano de fundo"','Escolher uma imagem'];
        const PARES = [
            { e:'🖼️ Trocar o fundo',      d:'Personalização → Plano de fundo' },
            { e:'🌗 Claro e escuro',       d:'Personalização → Cores' },
            { e:'🔒 Tela de bloqueio',     d:'Personalização → Tela de bloqueio' },
            { e:'🖱️ Cursor colorido',     d:'Acessibilidade → Ponteiro do mouse' },
            { e:'🔊 Som de notificação',   d:'Pesquisar "Alterar sons"' },
            { e:'📊 Esconder a barra',     d:'Personalização → Barra de tarefas' },
        ];
        const VFS = [
            { t:'🖼️ A tela de bloqueio pode ter uma foto diferente da área de trabalho.', v:true,  x:'Isso mesmo! São duas coisas separadas.' },
            { t:'🖱️ Depois de mudar o cursor, não dá mais para trocar de volta.',        v:false, x:'Falso! Você troca quantas vezes quiser.' },
            { t:'📦 Um "Tema" guarda fundo, cores e sons, tudo junto.',                    v:true,  x:'Exatamente! Por isso os temas ajudam tanto.' },
            { t:'🔊 Para trocar sons é preciso desinstalar o Windows.',                    v:false, x:'Falso! É só pesquisar "Alterar sons".' },
        ];

        const misturar = l => { const c=l.slice(); for(let i=c.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[c[i],c[j]]=[c[j],c[i]];} return c; };

        // ---------- checklists ----------
        function ligarListas() {
            document.querySelectorAll('.lista').forEach(lista => {
                lista.querySelectorAll('.item').forEach(it => {
                    it.addEventListener('click', () => {
                        it.classList.toggle('feito');
                        it.querySelector('.selo').textContent = it.classList.contains('feito') ? '✅' : '⬜';
                        const placar = lista.nextElementSibling;
                        if (placar && placar.classList.contains('placar')) {
                            const t = lista.querySelectorAll('.item').length;
                            const f = lista.querySelectorAll('.item.feito').length;
                            placar.textContent = `${f} de ${t} feitos`;
                        }
                    });
                });
            });
        }

        // ---------- jogos ----------
        function jogoVF1() {
            const area = document.getElementById('vf1'), msg = document.getElementById('vf1msg');
            area.querySelectorAll('.opcao').forEach(b => b.addEventListener('click', () => {
                const certo = b.dataset.vf === 'falso';
                area.querySelectorAll('.opcao').forEach(x => x.classList.remove('certo','errado'));
                b.classList.add(certo ? 'certo' : 'errado');
                msg.className = 'aviso on ' + (certo ? 'ok' : 'nao');
                msg.textContent = certo ? '✅ Isso mesmo, é Falso! Só muda as cores.' : '❌ A resposta certa é Falso! Só muda as cores.';
            }));
        }

        function jogoEsc1() {
            const area = document.getElementById('esc1'), msg = document.getElementById('esc1msg');
            area.querySelectorAll('.opcao').forEach(b => b.addEventListener('click', () => {
                const certo = b.dataset.op === 'b';
                area.querySelectorAll('.opcao').forEach(x => x.classList.remove('certo','errado'));
                b.classList.add(certo ? 'certo' : 'errado');
                msg.className = 'aviso on ' + (certo ? 'ok' : 'nao');
                msg.textContent = certo ? '✅ Isso aí! É só ligar "cor automática".' : '❌ Quase! A certa é "Ligar cor automática".';
            }));
        }

        let escolhida = [];
        function jogoOrdenar() {
            escolhida = [];
            const banco = document.getElementById('banco'), fila = document.getElementById('fila'), msg = document.getElementById('ordMsg');
            banco.innerHTML = ''; fila.innerHTML = ''; msg.className = 'aviso';
            misturar(ORDEM).forEach(txt => {
                const p = document.createElement('div');
                p.className = 'peca'; p.textContent = txt;
                p.addEventListener('click', () => { escolhida.push(txt); p.remove(); desenha(); });
                banco.appendChild(p);
            });
            function desenha() {
                fila.innerHTML = '';
                escolhida.forEach((t,i) => {
                    const d = document.createElement('div');
                    d.className = 'posto';
                    d.innerHTML = `<span class="n">${i+1}</span><span>${t}</span>`;
                    fila.appendChild(d);
                });
            }
            document.getElementById('btnConferir').onclick = () => {
                let ok = 0;
                fila.querySelectorAll('.posto').forEach((d,i) => {
                    const c = escolhida[i] === ORDEM[i];
                    d.classList.add(c ? 'certo' : 'errado');
                    if (c) ok++;
                });
                msg.className = 'aviso on ' + (ok === ORDEM.length ? 'ok' : 'nao');
                msg.textContent = ok === ORDEM.length ? '✅ Perfeito! Essa é a ordem certa!' : `⚠️ Acertou ${ok} de ${ORDEM.length}. Os vermelhos estão fora de ordem.`;
            };
        }

        function jogoLigar() {
            const E = document.getElementById('ligaE'), D = document.getElementById('ligaD'), placar = document.getElementById('ligaPlacar');
            E.innerHTML = ''; D.innerHTML = '';
            const comId = PARES.map((p,i) => ({...p, id:i}));
            let sel = null, achou = 0;
            misturar(comId).forEach(p => {
                const b = document.createElement('button');
                b.className = 'liga'; b.textContent = p.e; b.dataset.id = p.id;
                b.addEventListener('click', () => {
                    if (b.classList.contains('certo')) return;
                    E.querySelectorAll('.liga').forEach(x => x.classList.remove('sel'));
                    b.classList.add('sel'); sel = b;
                });
                E.appendChild(b);
            });
            misturar(comId).forEach(p => {
                const b = document.createElement('button');
                b.className = 'liga'; b.textContent = p.d; b.dataset.id = p.id;
                b.addEventListener('click', () => {
                    if (b.classList.contains('certo') || !sel) return;
                    if (sel.dataset.id === b.dataset.id) {
                        sel.classList.remove('sel'); sel.classList.add('certo'); b.classList.add('certo');
                        sel = null; achou++;
                        placar.textContent = `${achou} de ${PARES.length} encontrados`;
                    } else {
                        b.classList.add('errado');
                        setTimeout(() => { b.classList.remove('errado'); if (sel) sel.classList.remove('sel'); sel = null; }, 480);
                    }
                });
                D.appendChild(b);
            });
        }

        function jogoVFFinal() {
            const area = document.getElementById('vfFinal');
            area.innerHTML = '';
            VFS.forEach((q,i) => {
                const bloco = document.createElement('div');
                bloco.className = 'cartao';
                bloco.innerHTML = `<div class="pergunta">${i+1}) ${q.t}</div>
                    <div class="opcoes duas" style="margin-top:8px;">
                        <button class="opcao" style="text-align:center;" data-r="falso">❌ Falso</button>
                        <button class="opcao" style="text-align:center;" data-r="verdadeiro">✅ Verdadeiro</button>
                    </div>
                    <div class="aviso" style="margin-top:8px;"></div>`;
                const msg = bloco.querySelector('.aviso');
                bloco.querySelectorAll('.opcao').forEach(b => b.addEventListener('click', () => {
                    const certo = (b.dataset.r === 'verdadeiro') === q.v;
                    bloco.querySelectorAll('.opcao').forEach(x => x.classList.remove('certo','errado'));
                    b.classList.add(certo ? 'certo' : 'errado');
                    msg.className = 'aviso on ' + (certo ? 'ok' : 'nao');
                    msg.textContent = (certo ? '✅ ' : '❌ ') + q.x;
                }));
                area.appendChild(bloco);
            });
        }

        const JOGOS = { vf1: jogoVF1, esc1: jogoEsc1, ordenar: jogoOrdenar, ligar: jogoLigar, vfFinal: jogoVFFinal };

        function montar() {
            const palco = document.getElementById('palco');
            telas.forEach((t,i) => {
                const d = document.createElement('div');
                d.className = 'slide' + (i === 0 ? ' ativo' : '');
                d.innerHTML = t.html;
                palco.appendChild(d);
            });
            document.getElementById('total').textContent = telas.length;
            ligarListas();
            telas.forEach(t => { if (t.jogo && JOGOS[t.jogo]) JOGOS[t.jogo](); });
            atualizar();
        }

        function mostrar(n) {
            document.querySelectorAll('.slide')[atual].classList.remove('ativo');
            atual = n;
            document.querySelectorAll('.slide')[atual].classList.add('ativo');
            atualizar();
        }
        function avancar() { if (atual < telas.length - 1) mostrar(atual + 1); }
        function voltar()  { if (atual > 0) mostrar(atual - 1); }

        function atualizar() {
            document.getElementById('atual').textContent = atual + 1;
            document.getElementById('btnVoltar').disabled = atual === 0;
            document.getElementById('btnProximo').disabled = atual === telas.length - 1;
            document.getElementById('progresso').style.width = ((atual + 1) / telas.length * 100) + '%';
            if ('speechSynthesis' in window) speechSynthesis.cancel();
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight') avancar();
            if (e.key === 'ArrowLeft') voltar();
        });

        montar();
    </script>
