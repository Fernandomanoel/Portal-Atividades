<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MicroAtividades</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="icon" href="img/siteicon.svg" type="image/svg+xml">
  <!-- no <head> pra página já abrir escura, sem piscar branco antes -->
  <script src="js/core/tema.js"></script>
</head>

<body>

  <app-navbar></app-navbar>

  <div class="container">

    <app-banner titulo="Atividades Extras" texto="Escolha uma atividade abaixo para começar.">
    </app-banner>

    <!-- As listas abaixo são preenchidas por js/pages/home.js a partir do
         catálogo em js/data/atividades.js — não escreva cursos aqui. -->

    <h2 class="section-title">Atividades disponíveis</h2>

    <div class="courses-container">
      <button type="button" class="arrow left" data-rolar="-1" aria-label="Voltar">❮</button>

      <div class="courses-wrapper">
        <div class="courses" id="lista-cursos"></div>
      </div>

      <button type="button" class="arrow right" data-rolar="1" aria-label="Avançar">❯</button>
    </div>

    <h2 class="section-title">Mais Atividades</h2>

    <div class="courses games" id="lista-extras"></div>

  </div>

  <app-footer></app-footer>

  <script src="js/core/router.js"></script>
  <script src="js/components/layout.js"></script>
  <script src="js/components/cards.js"></script>
  <script src="js/data/atividades.js"></script>
  <script src="js/pages/home.js"></script>
</body>

</html>
