<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Power BI - Atividades</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter', sans-serif;
}

body {
    display:flex;
    background:#f8fafc;
}

/* SIDEBAR FIXA */
.sidebar {
    width:260px;
    height:100vh;
    background:#0f172a;
    color:#fff;
    padding:30px 20px;
    position:fixed;
    left:0;
    top:0;
    display:flex;
    flex-direction:column;
}

.logo {
    font-size:20px;
    font-weight:600;
    margin-bottom:40px;
    color:#facc15;
}

.menu a {
    display:block;
    padding:12px;
    border-radius:10px;
    color:#cbd5e1;
    text-decoration:none;
    margin-bottom:10px;
}

.menu a:hover {
    background:#1e293b;
    color:#fff;
}

.toggle {
    margin-top:auto;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#facc15;
    font-weight:600;
    cursor:pointer;
}

/* CONTEÚDO */
.container {
    margin-left:260px;
    flex:1;
    padding:30px;
}

/* HEADER */
.header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.title {
    font-size:26px;
    font-weight:600;
}

.search {
    padding:10px;
    border-radius:10px;
    border:1px solid #ddd;
}

/* GRID */
.grid {
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap:15px;
}

/* CARD */
.card {
    background:#fff;
    border-radius:15px;
    padding:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.05);
    transition:.3s;
    position:relative;
}

.card:hover {
    transform:translateY(-5px);
}

/* TOPO */
.top {
    display:flex;
    align-items:center;
    margin-bottom:10px;
}

.icon {
    width:45px;
    height:45px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-right:10px;
    font-size:11px;
    font-weight:bold;
    color:#fff;
}

.pdf { background:#ef4444; }
.dashboard { background:#facc15; color:#000; }
.quiz { background:#22c55e; }

/* TEXTO */
.card h3 {
    font-size:15px;
}

.card p {
    font-size:12px;
    color:#64748b;
}

/* STATUS */
.status {
    position:absolute;
    top:10px;
    right:10px;
    font-size:11px;
    padding:5px 10px;
    border-radius:20px;
}

.pendente {
    background:#fef3c7;
}

.concluido {
    background:#dcfce7;
}

/* BOTÃO */
.btn {
    margin-top:10px;
    width:100%;
    padding:8px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:#fff;
    cursor:pointer;
}

/* VISUALIZADOR */
.viewer {
    margin-top:25px;
    width:100%;
    height:500px;
    border:none;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

/* DARK MODE */
.dark {
    background:#020617;
    color:#fff;
}

.dark .card {
    background:#0f172a;
}

.dark .search {
    background:#0f172a;
    color:#fff;
    border-color:#1e293b;
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="logo">Power BI</div>

    <div class="menu">
        <a href="../index.html">Voltar</a>
        <a href="basedados.html">Planilhas</a>
        <a href="#">Provas</a>
    </div>

    <button class="toggle" onclick="toggleDark()">Modo Noturno</button>
</div>

<!-- CONTEÚDO -->
<div class="container">

    <div class="header">
        <div class="title">Atividades</div>
        <input class="search" placeholder="Pesquisar atividade...">
    </div>

    <div id="lista" class="grid"></div>

    <!-- IFRAME -->
    <iframe id="viewer" class="viewer"></iframe>

</div>

<script>

/* LISTA DE ATIVIDADES COM LINK */
const atividades = [
    {
        tipo:"pdf",
        titulo:"Power Bi: Criando o seu primeiro Dashboard",
        descricao:"Conectar Excel e tratar dados",
        status:"Pendente",
        link:"pdfs/Power Bi/Power Bi - Atividade 1.pdf"
    },
    {
        tipo:"pdf",
        titulo:"Power Bi: : Fazendo Analize de Funcionários de RH",
        descricao:"Criar gráficos",
        status:"pendente",
        link:"pdfs/Power Bi/Power Bi - Atividade 2.pdf"
    },
     {
        tipo:"pdf",
        titulo:"Power Bi: Análise de Vendas",
        descricao:"Criar o primeiro Dashboards",
        status:"Adicionado",
        link:"pdfs/Power Bi/Power Bi - Analise de Vendas com o Básico .pdf"
    },
    {
        tipo:"pdf",
        titulo:"Power Bi: Dashboard de Vendas do Atacadão",
        descricao:"Criar um Dashboard de Vendas",
        status:"Adicionado",
        link:"pdfs/Power Bi/Power Bi - Dashboard de Vendas do Atacadão.pdf"
    }
];

const lista = document.getElementById("lista");

/* RENDER */
function render(listaDados){
    lista.innerHTML = "";

    listaDados.forEach((a) => {
        lista.innerHTML += `
        <div class="card">

            <span class="status ${a.status}">
                ${a.status}
            </span>

            <div class="top">
                <div class="icon ${a.tipo}">
                    ${a.tipo.toUpperCase()}
                </div>

                <div>
                    <h3>${a.titulo}</h3>
                    <p>${a.descricao}</p>
                </div>
            </div>

            <button class="btn" onclick="abrir('${a.link}')">
                Abrir
            </button>

        </div>
        `;
    });
}

render(atividades);

/* BUSCA */
document.querySelector(".search").addEventListener("input", e => {
    const valor = e.target.value.toLowerCase();

    const filtrado = atividades.filter(a =>
        a.titulo.toLowerCase().includes(valor)
    );

    render(filtrado);
});

/* ABRIR NO IFRAME */
function abrir(link){
    if(link.endsWith(".pdf")){
        window.open(link, "_blank"); // abre PDF em nova aba
    } else {
        document.getElementById("viewer").src = link;
    }
}
/* DARK MODE */
function toggleDark(){
    document.body.classList.toggle("dark");
}

</script>

</body>
</html>
