<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missão Minha Primeira Apresentação - PowerPoint</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #7a1f10 0%, #d24726 100%);
            color: #333;
            overflow: hidden;
            height: 100vh;
        }

        .presentation-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .slide-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .slide {
            width: 92%;
            height: 90%;
            max-width: 1200px;
            max-height: 780px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.4);
            padding: 45px;
            position: absolute;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            transform: translateX(100px) scale(0.95);
            pointer-events: none;
        }

        .slide.active {
            opacity: 1;
            transform: translateX(0) scale(1);
            pointer-events: auto;
            z-index: 10;
        }

        :root {
            --laranja: #d24726;
            --laranja-claro: #fdece6;
            --azul: #2563eb;
            --azul-claro: #e8f0ff;
            --verde: #1fa855;
            --verde-claro: #e3f9ec;
            --amarelo: #ffc400;
            --vermelho: #e5484d;
            --vermelho-claro: #fdecec;
            --cinza: #555;
        }

        .slide-header {
            background: linear-gradient(90deg, var(--laranja) 0%, #e8703f 100%);
            color: white;
            padding: 25px 30px;
            border-radius: 18px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .slide-header h1 {
            font-size: 2.1em;
            font-weight: 800;
        }

        .slide-header p {
            font-size: 1em;
            opacity: 0.95;
        }

        .emoji-large {
            font-size: 2.6em;
        }

        .slide-content {
            display: flex;
            flex-direction: column;
            gap: 18px;
            height: 100%;
            overflow-y: auto;
            padding-right: 10px;
            font-size: 1.15em;
        }

        .slide-content::-webkit-scrollbar {
            width: 6px;
        }

        .slide-content::-webkit-scrollbar-thumb {
            background: var(--laranja);
            border-radius: 10px;
        }

        .content-box {
            padding: 22px;
            border-radius: 14px;
            border-left: 8px solid;
            line-height: 1.7;
        }

        .box-laranja {
            background: var(--laranja-claro);
            border-left-color: var(--laranja);
        }

        .box-azul {
            background: var(--azul-claro);
            border-left-color: var(--azul);
        }

        .box-verde {
            background: var(--verde-claro);
            border-left-color: var(--verde);
        }

        .content-box h3 {
            color: var(--laranja);
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .content-box strong {
            color: var(--laranja);
        }

        .temas-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px 0;
        }

        .tema-tag {
            background: var(--laranja-claro);
            color: var(--laranja);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.95em;
        }

        .passos-numerados {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .passo {
            display: flex;
            gap: 16px;
            align-items: center;
            padding: 16px;
            background: #fdf7f5;
            border-radius: 12px;
            border-left: 5px solid var(--laranja);
        }

        .passo-numero {
            min-width: 44px;
            height: 44px;
            background: var(--laranja);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2em;
            flex-shrink: 0;
        }

        .passo-texto {
            flex: 1;
        }

        .mini-slide-exemplo {
            background: linear-gradient(135deg, var(--laranja) 0%, #e8703f 100%);
            color: white;
            border-radius: 14px;
            padding: 30px;
            text-align: center;
        }

        .mini-slide-exemplo h4 {
            font-size: 1.5em;
            margin-bottom: 8px;
        }

        .mini-slide-exemplo p {
            opacity: 0.9;
        }

        /* Checklist clicável */
        .checklist {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            background: #fdf7f5;
            border: 3px solid #f3ddd3;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .check-item:hover {
            border-color: var(--laranja);
        }

        .check-item .icone-programa {
            font-size: 2.2em;
            width: 55px;
            text-align: center;
        }

        .check-item .texto-programa {
            flex: 1;
            font-weight: 600;
            font-size: 1.1em;
        }

        .check-item .selo {
            font-size: 1.6em;
            width: 40px;
            text-align: center;
        }

        .check-item.feito {
            background: var(--verde-claro);
            border-color: var(--verde);
            text-decoration: line-through;
            opacity: 0.75;
        }

        .contador-missao {
            text-align: center;
            font-weight: 700;
            color: var(--laranja);
            font-size: 1.15em;
            margin-top: 5px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            background: rgba(0, 0, 0, 0.25);
        }

        button {
            background: var(--amarelo);
            color: #333;
            border: none;
            padding: 14px 28px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.05em;
            font-weight: 700;
            transition: all 0.3s;
        }

        button:hover {
            background: #ffd94d;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(255, 196, 0, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .slide-counter {
            color: white;
            font-weight: 700;
            font-size: 1em;
        }

        .progress-bar {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.25);
            margin: 0 30px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--amarelo);
            transition: width 0.3s;
        }

        @media (max-width: 768px) {
            .slide {
                padding: 25px;
                width: 95%;
                height: 95%;
            }

            .slide-header {
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }

            .slide-header h1 {
                font-size: 1.5em;
            }

            .controls {
                flex-direction: column;
                gap: 12px;
                padding: 15px;
            }

            .progress-bar {
                margin: 8px 0;
                width: 100%;
            }

            button {
                width: 100%;
            }
        }

        .slide-capa {
            background: linear-gradient(135deg, var(--laranja) 0%, #e8703f 100%);
            color: white;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 25px;
        }

        .slide-capa .slide-header {
            background: none;
            margin-bottom: 0;
        }

        .slide-capa h1 {
            color: white;
            font-size: 2.8em;
        }

        .slide-capa p {
            font-size: 1.3em;
            opacity: 0.95;
        }

        .slide-capa .emoji-large {
            font-size: 3.5em;
        }

        .capa-box {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-radius: 18px;
            padding: 28px;
            backdrop-filter: blur(10px);
            max-width: 560px;
        }

        .capa-box h2 {
            color: white;
            margin-bottom: 16px;
            font-size: 1.4em;
        }

        .capa-box ul {
            list-style: none;
            text-align: left;
        }

        .capa-box li {
            padding: 6px 0;
            font-size: 1.1em;
            color: white;
        }

        .motivacao-box {
            background: linear-gradient(135deg, var(--laranja-claro) 0%, white 100%);
            border: 3px solid var(--laranja);
            border-radius: 18px;
            padding: 40px;
            text-align: center;
        }

        .motivacao-box h2 {
            color: var(--laranja);
            font-size: 2em;
            margin-bottom: 18px;
        }

        .motivacao-box p {
            color: var(--cinza);
            font-size: 1.15em;
            line-height: 1.8;
            margin-bottom: 14px;
        }

        .motivacao-box .destaque {
            color: var(--laranja);
            font-weight: bold;
        }

        .aviso-adulto {
            background: var(--vermelho-claro);
            border-left: 6px solid var(--vermelho);
            padding: 16px 20px;
            border-radius: 10px;
            font-weight: 600;
            color: #7a1c1f;
        }
    </style>
</head>
<body>
    <div class="presentation-container">
        <div class="slide-wrapper" id="slideWrapper"></div>

        <div class="controls">
            <button id="prevBtn" onclick="previousSlide()">← Voltar</button>
            <div style="flex: 1; display: flex; align-items: center; gap: 20px;">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span class="slide-counter"><span id="currentSlide">1</span> / <span id="totalSlides">8</span></span>
            </div>
            <button id="nextBtn" onclick="nextSlide()">Próximo →</button>
        </div>
    </div>

    <script>
        let currentSlide = 0;

        const slides = [
            // Slide 1: Capa
            {
                html: `
                    <div class="slide-capa">
                        <div class="emoji-large">🎨📽️</div>
                        <h1>Missão: Minha Primeira Apresentação!</h1>
                        <p>Criando slides no PowerPoint</p>
                        <div class="capa-box">
                            <h2>Hoje você vai aprender a:</h2>
                            <ul>
                                <li>1️⃣ Escolher um design bonito</li>
                                <li>2️⃣ Criar um slide de capa</li>
                                <li>3️⃣ Adicionar mais slides com imagens</li>
                                <li>4️⃣ Apresentar os seus slides</li>
                            </ul>
                        </div>
                    </div>
                `
            },

            // Slide 2: Objetivo e tema
            {
                html: `
                    <div class="slide-header">
                        <div class="emoji-large">🎯</div>
                        <div>
                            <h1>O que vamos fazer?</h1>
                            <p>Uma apresentação de 3 slides sobre um tema seu</p>
                        </div>
                    </div>
                    <div class="slide-content">
                        <div class="content-box box-laranja" style="font-weight: 600;">
                            Vamos criar uma <strong>apresentação de slides</strong> (tipo um mini show) com pelo menos 3 telas, sobre um assunto que você gosta!
                        </div>
                        <h3 style="color: var(--laranja); font-weight: 700;">Escolha um tema:</h3>
                        <div class="temas-list">
                            <span class="tema-tag">🦸 Meu super-herói favorito</span>
                            <span class="tema-tag">🐾 Meu bicho de estimação</span>
                            <span class="tema-tag">🚀 O espaço</span>
                            <span class="tema-tag">🍕 Minha comida favorita</span>
                            <span class="tema-tag">🎨 Meu hobby favorito</span>
                            <span class="tema-tag">🦖 Dinossauros</span>
                        </div>
                        <div class="aviso-adulto">
                            👨‍👩‍👧 Peça para um adulto ficar por perto enquanto você faz essa atividade!
                        </div>
                    </div>
                `
            },

            // Slide 3: Abrir PowerPoint e escolher design
            {
                html: `
                    <div class="slide-header">
                        <div class="emoji-large">🖌️</div>
                        <div>
                            <h1>Passo a Passo: Escolhendo o Design</h1>
                            <p>Deixando a apresentação colorida</p>
                        </div>
                    </div>
                    <div class="slide-content">
                        <div class="passos-numerados">
                            <div class="passo">
                                <div class="passo-numero">1</div>
                                <div class="passo-texto">Clique no botão <strong>Iniciar</strong> e procure por <strong>PowerPoint</strong>.</div>
                            </div>
                            <div class="passo">
                                <div class="passo-numero">2</div>
                                <div class="passo-texto">Escolha um <strong>modelo colorido</strong> na tela inicial, ou clique em <strong>Apresentação em branco</strong>.</div>
                            </div>
                            <div class="passo">
                                <div class="passo-numero">3</div>
                                <div class="passo-texto">Na aba <strong>Design</strong>, você pode trocar as cores e o estilo quando quiser!</div>
                            </div>
                        </div>
                    </div>
                `
            },

            // Slide 4: Criar slide de capa
            {
                html: `
                    <div class="slide-header">
                        <div class="emoji-large">1️⃣</div>
                        <div>
                            <h1>Criando o Slide de Capa</h1>
                            <p>A primeira coisa que todo mundo vai ver</p>
                        </div>
                    </div>
                    <div class="slide-content">
                        <div class="passos-numerados">
                            <div class="passo">
                                <div class="passo-numero">1</div>
                                <div class="passo-texto">Clique na caixa de <strong>título</strong> e escreva o nome da sua apresentação.</div>
                            </div>
                            <div class="passo">
                                <div class="passo-numero">2</div>
                                <div class="passo-texto">Clique na caixa de <strong>subtítulo</strong> e escreva seu nome ou uma frase curta.</div>
                            </div>
                        </div>
                        <div class="mini-slide-exemplo">
                            <h4>🦖 Tudo Sobre Dinossauros</h4>
                            <p>Por: Você!</p>
                        </div>
                    </div>
                `
            },

            // Slide 5: Adicionar mais slides e imagem
            {
                html: `
                    <div class="slide-header">
                        <div class="emoji-large">2️⃣</div>
                        <div>
                            <h1>Adicionando Mais Slides</h1>
                            <p>Contando mais sobre o seu tema</p>
                        </div>
                    </div>
                    <div class="slide-content">
                        <div class="passos-numerados">
                            <div class="passo">
                                <div class="passo-numero">1</div>
                                <div class="passo-texto">Clique com o botão direito na barra lateral e escolha <strong>Novo Slide</strong> (faça isso 2 vezes).</div>
                            </div>
                            <div class="passo">
                                <div class="passo-numero">2</div>
                                <div class="passo-texto">Em cada slide novo, escreva um <strong>texto curto</strong> sobre o seu tema.</div>
                            </div>
                            <div class="passo">
                                <div class="passo-numero">3</div>
                                <div class="passo-texto">Clique em <strong>Inserir → Imagens</strong> para colocar uma foto no slide.</div>
                            </div>
                        </div>
                    </div>
                `
            },

            // Slide 6: Apresentar
            {
                html: `
                    <div class="slide-header">
                        <div class="emoji-large">🎬</div>
                        <div>
                            <h1>Passo a Passo: Apresentar!</h1>
                            <p>Mostrando os slides em tela cheia</p>
                        </div>
                    </div>
                    <div class="slide-content">
                        <div class="passos-numerados">
                            <div class="passo">
                                <div class="passo-numero">1</div>
                                <div class="passo-texto">Aperte a tecla <strong>F5</strong> no teclado (ou clique em "Apresentação de Slides").</div>
                            </div>
                            <div class="passo">
                                <div class="passo-numero">2</div>
                                <div class="passo-texto">Use a <strong>seta para a direita</strong> ou clique com o mouse para passar de slide.</div>
                            </div>
                            <div class="passo">
                                <div class="passo-numero">3</div>
                                <div class="passo-texto">Aperte <strong>Esc</strong> quando quiser sair da apresentação.</div>
                            </div>
                        </div>
                        <div class="content-box box-azul">
                            💡 Treine falar sobre cada slide antes de apresentar para alguém!
                        </div>
                    </div>
                `
            },

            // Slide 7: Checklist prática
            {
                html: `
                    <div class="slide-header">
                        <div class="emoji-large">✅</div>
                        <div>
                            <h1>Hora de Praticar!</h1>
                            <p>Faça cada tarefa no computador e marque aqui</p>
                        </div>
                    </div>
                    <div class="slide-content">
                        <div class="checklist" id="checklist-ppt">
                            <div class="check-item" data-item="design">
                                <div class="icone-programa">🖌️</div>
                                <div class="texto-programa">Escolhi um design colorido</div>
                                <div class="selo">⬜</div>
                            </div>
                            <div class="check-item" data-item="capa">
                                <div class="icone-programa">1️⃣</div>
                                <div class="texto-programa">Criei o slide de capa com título</div>
                                <div class="selo">⬜</div>
                            </div>
                            <div class="check-item" data-item="slides">
                                <div class="icone-programa">📑</div>
                                <div class="texto-programa">Adicionei pelo menos 2 slides a mais</div>
                                <div class="selo">⬜</div>
                            </div>
                            <div class="check-item" data-item="imagem">
                                <div class="icone-programa">🖼️</div>
                                <div class="texto-programa">Inseri uma imagem em algum slide</div>
                                <div class="selo">⬜</div>
                            </div>
                            <div class="check-item" data-item="apresentar">
                                <div class="icone-programa">🎬</div>
                                <div class="texto-programa">Apresentei os slides com F5</div>
                                <div class="selo">⬜</div>
                            </div>
                        </div>
                        <div class="contador-missao" id="contadorPpt">0 de 5 concluídas</div>
                    </div>
                `
            },

            // Slide 8: Conclusão
            {
                html: `
                    <div class="slide-content" style="justify-content: center;">
                        <div class="motivacao-box">
                            <div class="emoji-large" style="font-size: 3.5em; margin-bottom: 16px;">🏆</div>
                            <h2>Parabéns, Missão Cumprida!</h2>
                            <p>Você criou a sua <span class="destaque">primeira apresentação</span> com design, imagens e vários slides!</p>
                            <p>Agora é só apresentar para a família ou os amigos. Você é um verdadeiro apresentador! 🎉</p>
                        </div>
                    </div>
                `
            }
        ];

        function initPresentation() {
            const wrapper = document.getElementById('slideWrapper');

            slides.forEach((slide, index) => {
                const slideDiv = document.createElement('div');
                slideDiv.className = 'slide' + (index === 0 ? ' active' : '');
                slideDiv.innerHTML = slide.html;
                wrapper.appendChild(slideDiv);
            });

            document.getElementById('totalSlides').textContent = slides.length;
            ativarChecklists();
            updateControls();
        }

        function ativarChecklists() {
            document.querySelectorAll('.check-item').forEach((item) => {
                item.addEventListener('click', () => {
                    item.classList.toggle('feito');
                    const selo = item.querySelector('.selo');
                    selo.textContent = item.classList.contains('feito') ? '✅' : '⬜';
                    atualizarContador(item.closest('.checklist'));
                });
            });
        }

        function atualizarContador(checklist) {
            if (!checklist) return;
            const total = checklist.querySelectorAll('.check-item').length;
            const feitos = checklist.querySelectorAll('.check-item.feito').length;
            const contador = document.getElementById('contadorPpt');
            if (contador) {
                contador.textContent = `${feitos} de ${total} concluídas`;
            }
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                document.querySelectorAll('.slide')[currentSlide].classList.remove('active');
                currentSlide++;
                document.querySelectorAll('.slide')[currentSlide].classList.add('active');
                updateControls();
            }
        }

        function previousSlide() {
            if (currentSlide > 0) {
                document.querySelectorAll('.slide')[currentSlide].classList.remove('active');
                currentSlide--;
                document.querySelectorAll('.slide')[currentSlide].classList.add('active');
                updateControls();
            }
        }

        function updateControls() {
            document.getElementById('currentSlide').textContent = currentSlide + 1;
            document.getElementById('prevBtn').disabled = currentSlide === 0;
            document.getElementById('nextBtn').disabled = currentSlide === slides.length - 1;

            const progress = ((currentSlide + 1) / slides.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') previousSlide();
        });

        initPresentation();
    </script>
</body>
</html>
